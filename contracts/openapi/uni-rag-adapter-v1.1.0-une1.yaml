openapi: 3.1.0
info:
  title: UNI RAG Adapter Contract
  version: 1.1.0-une1
  description: UNI RAG System OpenAPI 1.1.0을 UNE Anti-Corruption Layer에서 호출하기 위한 계약
servers:
- url: http://10.20.10.101:8088
  description: Source document host; deployment must use secured internal endpoint
paths:
  /auth/login:
    post:
      summary: Login
      operationId: uni_auth_login_post
      description: UNE 계정으로 로그인    →   자체 JWT 발급
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
      security: []
      x-source: UNI RAG System OpenAPI 1.1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/directory:
    get:
      summary: Directory
      operationId: uni_auth_directory_get
      description: '조직원 전체 명단 조회 (조직도 표시·담당자 검색 등에 사용).\n\n무엇을: UNE HR 시스템의

        전체 사용자 명단을 접속키(X-API-Key)로 가져온다.\n왜          : 로그인은 본인 정보만 주므로, 조직 단위 정보가 필요할 때

        별도 조회한다.\n인증 : 로그인된 사용자만 호출 가능(JWT 필요). 실제 HR 조회는 서버가 보관한\n              접속키로 수행

        하므로 클라이언트에 접속키가 노출되지 않는다.\n\n반환: {\'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
      security:
      - HTTPBearer: []
      x-source: UNI RAG System OpenAPI 1.1.0
  /chat/files/{file_id}:
    get:
      summary: Download Generated File
      operationId: uni_chat_files_file_id_get
      description: '서버에 생성·저장된 파일을 다운로드한다.\n\n지원 형식:\n - .json : SOP 매뉴얼

        JSON (application/json)\n - .hwpx : 한글 워드 파일 (application/hwp+zip)\n - .svg : 플로차트

        벡터 이미지 (image/svg+xml)\n\n파일은 GENERATED_DIR에 {file_id}.{ext} 형태로 저장된다.\n인증 없이 접근 가

        능 (다운로드 링크를 공유할 수 있도록 의도적으로 공개)'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
      security:
      - HTTPBearer: []
      x-source: UNI RAG System OpenAPI 1.1.0
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
  /chat/:
    post:
      summary: Chat
      operationId: uni_chat_post
      description: '메인 채팅 엔드포인트.\n\nstream=True (기본): SSE 스트리밍으로 응답          →

        StreamingResponse 반환\nstream=False        : 일반 JSON 응답  →   rag_query() 결과 반환'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '422':
          description: Validation Error
      security:
      - HTTPBearer: []
      x-source: UNI RAG System OpenAPI 1.1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
  /chat/json:
    post:
      summary: Chat Json
      operationId: uni_chat_json_post
      description: "SOP JSON을 compns 요소 단위로 SSE 스트리밍하는 백엔드-투-백엔드 전용 엔드포인\n트.\\n\\n■기존 비스트리밍 방식에서 SSE 스트리밍으로 전환한 이유\\n 클라이언트가\
        \ compns 배열의 각 노드를 수신하는 즉\n시 화면에 그릴 수 있도록\\n LLM이 생성하는 JSON을 compns 요소 단위로 실시간 분리해서 전송한다.\\n 전체 JSON 완성\n까지 기다리지 않아도\
        \ 되므로 체감 응답성이 크게 향상된다.\\n\\n           ■\n                                          동작 흐름\\n 1. RAG 검색(벡터)       \
        \     →\n                                                                    리랭킹(BGE)          →\n컨텍스트 조립\\n 2. LLM\
        \ 스트리밍 호출 (chat_stream)\\n 3. 버퍼에 청크 누적 + 중괄호 깊이 추적으로 compns 요소\n완성 감지\\n 4. 요소 완성 즉시 __compn__ SSE 이벤트 발사\\n 5. 완료\
        \ 후 __sources__, __done__, [DONE]\n순서로 전송\\n\\n  ■  SSE 이벤트 포맷\\n - {\\"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '422':
          description: Validation Error
      security:
      - HTTPBearer: []
      x-source: UNI RAG System OpenAPI 1.1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonChatRequest'
  /documents/upload:
    post:
      summary: Upload Document
      operationId: uni_documents_upload_post
      description: '파일 업로드 엔드포인트\n\n[처리 흐름]\n         1. 파일 형식 검증 (MIME 타입 + 확장자

        이중 검증)\n     2. 중복 파일 감지 (force=True이면 무시)\n        3. 고유 파일명으로 UPLOAD_DIR에 저장 (원본 파일

        명은 filename 필드에 별도 보관)\n       4. DB + _documents 캐시에 \'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
      security:
      - HTTPBearer: []
      x-source: UNI RAG System OpenAPI 1.1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
  /documents/upload-urls:
    post:
      summary: Upload From Urls
      operationId: uni_documents_upload_urls_post
      description: "URL 목록을 받아 각 파일을 다운로드하고 학습 큐에 등록한다.\\n\\n[처리 흐름]\\n               1. 각\nURL 다운로드 (최대 60초 타임아웃)\\n    \
        \           2. XML에서 법령명(제목) 추출   → 파일명으로 사용\\n 3. UPLOAD_DIR에 저장\n\\n 4. DB + 캐시 등록            →\n              \
        \        파싱 큐에 추가\\n\\n[지원 형식]\\n 주로 law.go.kr XML 법령 파일 대상.\\n \\u003C법령\n명_한글\\u003E 태그에서 제목 자동 추출.\\n 일반 XML도 \\\
        u003Ctitle\\u003E, \\u003Cname\\u003E 등으로 폴\n백.\\n\\n반환:\\n 각 URL별 처리 결과 목록\\n {\\"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
      security:
