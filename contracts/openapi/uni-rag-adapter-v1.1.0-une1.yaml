components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GenericRequest:
      type: object
      additionalProperties: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    DocumentUploadRequest:
      type: object
      description: Actual source endpoint uses file/multipart; UNE Adapter supplies file and metadata
      additionalProperties: true
    SearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 50
        filters:
          type: object
    ChatRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        stream:
          type: boolean
          default: true
        session_id:
          type: string
        model:
          type: string
    JsonChatRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        session_id:
          type: string
        schema_version:
          type: string
          default: '1.0'
