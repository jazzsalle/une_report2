  planGeneration: NOT USED for T3Q plan flow
  sopFlow: documents/upload -> search -> chat/json or chat
  sseEvents:
  - __status__
  - __thinking__
  - __compn__
  - __sources__
  - __done__
  - __error__
  - '[DONE]'
