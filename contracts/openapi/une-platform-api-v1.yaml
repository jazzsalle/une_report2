  /documents/{documentId}/autosaves:
    post:
      tags:
      - DOC
      summary: 자동저장
      operationId: une_doc_009
      description: '권한: DOC_EDIT


        핵심 요청: If-Match, baseRevisionId, delta, clientMutationId, seq


        핵심 응답: AutosaveReceipt


        오류: DOC-409-003, DOC-422-004, COM-0409, COM-0428


        batch 1건이 저널 1행(document_autosave) + ChangeSet 1건 + Revision 1건이다.
        수신확인(receipt)의 status는 셋뿐이다:


        ACCEPTED — 반영되었다. resultRevisionId가 결과 리비전을 가리킨다. **내용이 그대로면
        새 리비전을 만들지 않고 기존 head를 가리킨다**(ir_hash 동일 → ADR-30 D8 중복 제거):
        같은 문자 재입력·입력 후 즉시 취소 같은 batch가 버전이력을 의미 없는 행으로 덮지
        않게 한다. 저널 행은 그때도 남는다.


        CONFLICT — head가 이미 움직였다. 409 DOC-409-003으로 나가지만 판정 자체는 저널에
        남는다 — 그래야 화면이 저장 실패를 표시할 수 있다(US-PLAN-020 AC-02). 저널의
        base_revision_id에는 **요청이 기준으로 삼은 Revision**을 적는다(재현 가능성).
        If-Match와 baseRevisionId가 서로 다른 Revision을 가리키는 자기모순 요청은 409가
        아니라 422 DOC-422-004다 — 적용(UNE-DOC-006)과 같은 규칙이며, 재조회로 고쳐지지
        않는 오류를 409로 답하면 클라이언트가 무한히 재시도한다.


        SUPERSEDED — 도착했을 때 이미 같은 문서의 더 나중 자동저장이 반영돼 있었다
        (A-01 오프라인 재동기화). 실패가 아니라 무해한 폐기이므로 200이다. 이 판정을
        충돌보다 먼저 하는 이유: 늦게 도착한 항목은 baseRevisionId가 낡아 있는 것이
        정상이라, 충돌로 판정하면 사용자에게 거짓 경보가 된다.


        멱등: clientMutationId가 앵커다(uk_document_autosave_mutation). 오프라인 큐는 같은
        항목을 여러 번 재전송하는 것이 정상 동작이므로, 이 유일성이 없으면 재전송이 곧
        리비전 중복 생성이 된다. 같은 값 + 같은 delta는 같은 receipt를 replayed=true로
        돌려주고, 같은 값 + 다른 delta는 409 COM-0409다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatchRequired'
      # UNE-DOC-006/008/009의 멱등 앵커는 본문 clientMutationId다(uk_change_set_mutation·uk_autosave_mutation).
      # Idempotency-Key 헤더는 이 경로에서 아무 효과도 없으므로 선언하지 않는다.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: 새 head revision_no (SUPERSEDED면 기존 값)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosaveReceiptResponse'
              examples:
                accepted:
                  summary: batch 수락 → revision 6
                  value:
                    success: true
                    data:
                      autosaveId: 4b5c6d7e-8f90-4a1b-9c2d-3e4f50617283
                      documentId: 8f14e45f-ceea-467a-9a1c-2b3d4e5f6071
                      clientMutationId: autosave-000042
                      seq: '42'
                      status: ACCEPTED
                      baseRevisionId: c2e3d4f5-6071-4b8c-9d0e-1f2a3b4c5d6e
                      resultRevisionId: d3f4a5b6-7182-4c9d-8e0f-1a2b3c4d5e6f
                      resultRevisionNo: 6
                      irHash: 3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c
                      replayed: false
                      receivedAt: '2026-08-01T02:41:12.000Z'
                    meta:
                      requestId: req_5c6d7e8f90a1b2c3
                      correlationId: corr_1a2b3c4d5e6f7081
                      timestamp: '2026-08-01T02:41:12.050Z'
                      schemaVersion: '1.0'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
