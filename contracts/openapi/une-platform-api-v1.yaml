components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  schemas:
    Meta:
      type: object
      required:
      - requestId
      - correlationId
      - timestamp
      - schemaVersion
      properties:
        requestId:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        schemaVersion:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      - recoverable
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
          nullable: true
        recoverable:
          type: boolean
        userAction:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    GenericRequest:
      type: object
      additionalProperties: true
    GenericResponse:
      type: object
      additionalProperties: true
    PageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    SsoExchangeRequest:
      type: object
      required:
      - externalToken
      properties:
        externalToken:
          type: string
        returnUrl:
          type: string
          format: uri
    TokenResponse:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - userContext
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        userContext:
          type: object
    PlanCreateRequest:
      type: object
      required:
      - title
      - startMode
      properties:
        title:
          type: string
          maxLength: 300
        startMode:
          type: string
          enum:
          - BLANK
          - UPLOAD_HWPX
          - RECENT
        templateFileId:
          type: string
          format: uuid
          nullable: true
    PlanContext:
      type: object
      description: See 03_json-schema/plan-context.schema.json
      additionalProperties: true
    TocGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        generationOption:
          type: object
    ContentGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      - tocVersionId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        tocVersionId:
          type: string
          format: uuid
        protectedBlockIds:
          type: array
          items:
            type: string
            format: uuid
    HwpImportRequest:
      type: object
      required:
      - fileId
      properties:
        fileId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
          nullable: true
    ChangeSetRequest:
      type: object
      required:
      - baseRevisionId
      - operations
      - clientMutationId
      properties:
        baseRevisionId:
          type: string
          format: uuid
        operations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        clientMutationId:
          type: string
    ExportRequest:
      type: object
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - HWPX
          - PDF
          - DOCX
          - JSON
        revisionId:
          type: string
          format: uuid
          nullable: true
    SituationCreateRequest:
      type: object
      required:
      - mode
      - title
      - hazardType
      properties:
        mode:
          type: string
          enum:
          - LIVE
          - EXERCISE
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
        occurredAt:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          nullable: true
    ProviderQueryRequest:
      type: object
      required:
      - providers
      - query
      properties:
        providers:
          type: array
          items:
            type: string
            enum:
            - KMA
            - MOIS
            - SAFEKOREA
            - NAVER
            - T3Q
        query:
          type: object
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    SituationSnapshotCreateRequest:
      type: object
      required:
      - factIds
      - effectiveAt
      properties:
        factIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        conflictResolutionIds:
          type: array
          items:
            type: string
            format: uuid
        effectiveAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
    KnowledgeDocumentCreateRequest:
      type: object
      required:
      - fileId
      - documentType
      properties:
        fileId:
          type: string
          format: uuid
        documentType:
          type: string
        metadata:
          type: object
    EvidenceSearchRequest:
      type: object
      required:
      - query
      - topK
      properties:
        query:
          type: string
        filters:
          type: object
        topK:
          type: integer
          minimum: 1
          maximum: 50
    SopGenerationRequest:
      type: object
      required:
      - snapshotId
      - evidenceSetId
      - schemaVersion
      properties:
        snapshotId:
          type: string
          format: uuid
        evidenceSetId:
          type: string
          format: uuid
        schemaVersion:
          type: string
          enum:
          - '1.0'
    SopCreateRequest:
      type: object
      required:
      - title
      - hazardType
      properties:
        situationId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        hazardType:
          type: string
    SopGraph:
      type: object
      description: See 03_json-schema/sop-graph.schema.json
      additionalProperties: true
    SopRunCreateRequest:
      type: object
      required:
      - approvedVersionId
      - snapshotId
      - mode
      properties:
        approvedVersionId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - LIVE
          - EXERCISE
          - DRY_RUN
        startPolicy:
          type: string
          enum:
          - AUTO
          - MANUAL
    TaskActionRequest:
      type: object
      additionalProperties: true
    JournalProjectionRequest:
      type: object
      required:
      - snapshotId
      - from
      - to
      properties:
        snapshotId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        templateId:
          type: string
          format: uuid
          nullable: true
    EvaluationRequest:
      type: object
      required:
      - criteria
      properties:
        criteria:
          type: array
          items:
            type: object
        comments:
          type: string
          nullable: true
    Plan:
      type: object
      additionalProperties: true
    GenerationJob:
      type: object
      additionalProperties: true
    Situation:
      type: object
      additionalProperties: true
    SituationSnapshot:
      type: object
      additionalProperties: true
    SopRun:
      type: object
      additionalProperties: true
    Task:
      type: object
      additionalProperties: true
    Journal:
      type: object
      additionalProperties: true
    ExportJob:
      type: object
      additionalProperties: true
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderError:
      description: Provider Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
