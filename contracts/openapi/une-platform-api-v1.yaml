      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    # ADR-23 D1: create/confirm operations of the plan slice require the header so
    # the api_idempotency replay store can return the original result on retry.
    # Missing or malformed key -> COM-0400; same key with a different payload
    # (or still in flight) -> COM-0409.
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]{1,100}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    # CC-150: 문서 편집 오퍼레이션(UNE-DOC-006/008/009)은 If-Match가 필수다.
    # 값은 document_revision.revision_no의 강한 엔티티 태그다. 약한 태그(W/"3")는
    # 거부한다 — RFC 7232는 If-Match에 강한 비교만 허용한다. 부재는 428 COM-0428,
    # 형식 오류는 400 COM-0400, 불일치는 409 DOC-409-00x다.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"?[0-9]{1,9}"?$'
    # SSE 재접속 지점. 값은 마지막으로 수신한 job_event.sequence_no (설계 10 §2 SSE 규칙).
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]{1,18}$'
  schemas:
    Meta:
      type: object
      required:
      - requestId
      - correlationId
      - timestamp
      - schemaVersion
      properties:
        requestId:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        schemaVersion:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      - recoverable
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
          nullable: true
        recoverable:
          type: boolean
        userAction:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    GenericRequest:
      type: object
      additionalProperties: true
    GenericResponse:
      type: object
      additionalProperties: true
    PageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    SsoExchangeRequest:
      type: object
      required:
      - externalToken
      properties:
        externalToken:
          type: string
        returnUrl:
          type: string
          format: uri
    # ADR-22 D4: aligned to the design §2 common response envelope
    # ({success, data, meta}) used by every other success response, the
    # common-error schema, and the mock server.
    TokenResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - accessToken
          - refreshToken
          - expiresIn
          - userContext
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            userContext:
              type: object
        meta:
          type: object
    # CC-110 (ADR-23): the plan slice (UNE-PLAN-001~008) replaces the loose
    # `Plan` placeholder with explicit resource schemas and {success, data, meta}
    # envelopes. The placeholder below is kept only because UNE-PLAN-009+ still
    # reference it; each later work item replaces its own usage.
    # ADR-23 D3: hazard/phase vocabulary is taken from
    # contracts/schemas/plan-context.schema.json (backgroundInfo.disasterType /
    # backgroundInfo.controlPhase) until a code catalog table exists.
    PlanHazardType:
      type: string
      enum:
      - 폭염
      - 태풍/호우
      - 지진
      - 황사
      - 산불
      - 감염병
      - 가축질병
      - 다중밀집건축물붕괴대형사고
      - 정부주요시설
      - 학교시설
    PlanManagementPhase:
      type: string
      enum:
      - 예방
      - 대비
    # 설계 09 §4 계획서 Document 상태모델
    PlanStatus:
      type: string
      enum:
      - DRAFT
      - CONTEXT_READY
      - OUTLINE_GENERATING
      - OUTLINE_REVIEW
      - OUTLINE_CONFIRMED
      - CONTENT_GENERATING
      - EDITING
      - REVIEW_REQUESTED
      - CHANGES_REQUESTED
      - APPROVED
      - FINAL
      - REOPENED
      - ERROR
    PlanStartMode:
      type: string
      enum:
      - BLANK
      - UPLOAD_HWPX
      - RECENT
    PlanResource:
      type: object
      required:
      - planId
      - tenantId
      - title
      - hazardType
      - managementPhase
      - status
      - ownerId
      - versionNo
      - createdAt
      - updatedAt
      properties:
        planId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
        status:
          $ref: '#/components/schemas/PlanStatus'
        documentId:
          type:
          - string
          - 'null'
          format: uuid
        currentContextSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
        currentTocVersionId:
          type:
          - string
          - 'null'
          format: uuid
        startMode:
          $ref: '#/components/schemas/PlanStartMode'
        versionNo:
          type: integer
          description: 낙관적 잠금 버전 (If-Match/ETag 값)
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 휴지통 이동 시각 (null이면 활성)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # ADR-23 D4: 확정된 기준정보는 불변이며 content_hash(정규화 JSON SHA-256)로
    # 동일 내용 재확정을 dedupe한다.
    PlanContextSnapshotResource:
      type: object
      required:
      - contextSnapshotId
      - planId
      - versionNo
      - contextJson
      - contentHash
      - confirmedBy
      - confirmedAt
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        versionNo:
          type: integer
        contextJson:
          $ref: '#/components/schemas/PlanContext'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        supersedesId:
          type:
          - string
          - 'null'
          format: uuid
        confirmedBy:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
    # ADR-23 D2: 계획서당 1행 upsert. 임시저장은 완화 검증이므로 contextJson은
    # 미완성 상태를 허용한다(타입·enum·길이 위반은 PLAN-422-001).
    ContextDraftResource:
      type: object
      required:
      - contextDraftId
      - planId
      - contextJson
      - schemaVersion
      - updatedBy
      - updatedAt
      properties:
        contextDraftId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        contextJson:
          type: object
          additionalProperties: true
        schemaVersion:
          type: string
          maxLength: 20
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
    PlanResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlanResource'
        meta:
          type: object
    PlanDetailResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          allOf:
          - $ref: '#/components/schemas/PlanResource'
          properties:
            currentContextSnapshot:
              anyOf:
              - $ref: '#/components/schemas/PlanContextSnapshotResource'
              - type: 'null'
              description: 현재 확정 Snapshot (없으면 null)
        meta:
          type: object
    PlanPageResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - page
          - size
          - totalElements
          - totalPages
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanResource'
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
        meta:
          type: object
    ContextDraftResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ContextDraftResource'
        meta:
          type: object
    PlanContextSnapshotResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlanContextSnapshotResource'
        meta:
          type: object
    PlanContextSnapshotListResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanContextSnapshotResource'
        meta:
          type: object
    # ADR-23 D3: plan.hazard_type/management_phase는 NOT NULL이므로 생성 요청에
    # 필수로 포함한다(기준선 계약 누락 해소).
    PlanCreateRequest:
      type: object
      required:
      - title
      - startMode
      - hazardType
      - managementPhase
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        startMode:
          $ref: '#/components/schemas/PlanStartMode'
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
        templateFileId:
          type:
          - string
          - 'null'
          format: uuid
          description: 파일 업로드는 CC-140 범위로 보류 — 값이 제공되면 400 PLAN-4001로 거부한다 (ADR-23 D3).
    # JSON Merge Patch 부분집합: 메타 3필드만 허용하고 null(필드 삭제)은 불가.
    # status/owner 변경은 별도 도메인 액션이다 (ADR-23 D5).
    PlanMetaPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
    PlanDeleteRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    PlanContextDraftRequest:
      type: object
      required:
      - context
      properties:
        context:
          type: object
          additionalProperties: true
          description: 완화 검증 대상 기준정보 작업본 (미완성 허용, ADR-23 D2)
        schemaVersion:
          type: string
          maxLength: 20
          default: '1.0'
    PlanContext:
      type: object
      description: '엄격 검증: contracts/schemas/plan-context.schema.json
        (additionalProperties 불가). Snapshot 확정은 전체 스키마 통과 필수,
        draft는 required/minLength/minItems만 유예'
      additionalProperties: true
    # CC-120: UNE-PLAN-009~015 (목차 생성 Job / SSE / 목차 버전) 슬라이스.
    # CC-130에서 UNE-PLAN-016(content-jobs)도 GenerationJobResponse로 옮겼다.
    # 아래 `GenerationJob` placeholder는 아직 후속 항목이 소유한 operation
    # (UNE-DOC-010 AI 편집, UNE-SOP-001, UNE-JNL-007)이 참조하므로 남겨둔다.
    JobStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - CANCEL_REQUESTED
      - COMPLETED
      - FAILED
      - CANCELLED
    GenerationJobResource:
      type: object
      required:
      - jobId
      - jobType
      - aggregateType
      - aggregateId
      - providerCode
      - status
      - progressPct
      - attemptNo
      - correlationId
      - createdAt
      properties:
        jobId:
          type: string
          format: uuid
        jobType:
          type: string
          enum:
          - TOC
          - CONTENT
          - AI_EDIT
          - SOP
        aggregateType:
          type: string
          maxLength: 30
          description: 대상 Aggregate 종류 (설계 10 §6.15 어휘 PLAN/DOCUMENT/SITUATION)
        aggregateId:
          type: string
          format: uuid
        providerCode:
          type: string
          enum:
          - T3Q
          - UNI
          - UNE
        status:
          $ref: '#/components/schemas/JobStatus'
        progressPct:
          type: number
          minimum: 0
          maximum: 100
        attemptNo:
          type: integer
          minimum: 0
          description: 워커 실행 시도 횟수. 생성 시 0이고 워커가 선점할 때마다 +1 한다
            (첫 실행 후 1). UNE-PLAN-013 사용자 재시도는 0으로 리셋한다
            (마이그레이션 0015 generation_job.attempt_no / ADR-25 D9).
        correlationId:
          type: string
          maxLength: 80
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        result:
          type:
          - object
          - 'null'
          description: 완료된 Job의 산출물. 진행 중이거나 실패면 null. TOC Job은
            tocVersionId/tocVersionNo를, CONTENT Job(UNE-PLAN-016)은 contentSummary와
            입력 tocVersionId를 싣는다. Job 타입별 oneOf 분기를 두지 않는 이유는 생성
            타입이 파괴되기 때문이며, 타입별로 실리는 속성만 다르다.
          properties:
            tocVersionId:
              type: string
              format: uuid
            tocVersionNo:
              type: integer
            contentSummary:
              type: object
              description: CONTENT Job 집계. generated+preserved+failed는 이번 job의 대상
                노드 수와 일치한다. 범위 지정 재생성(targetNodeKeys)에서 범위 밖 노드는
                대상이 아니므로 어느 항목에도 집계되지 않는다.
              properties:
                generated:
                  type: integer
                  minimum: 0
                  description: 새로 생성된 블록 수.
                preserved:
                  type: integer
                  minimum: 0
                  description: 보호(protection_state=USER_LOCKED 또는 SYSTEM_LOCKED)로
                    재생성하지 않고 유지한 블록 수.
                failed:
                  type: integer
                  minimum: 0
                  description: 생성에 실패한 노드 수 (content.block outcome=FAILED). legacy
                    경로에서는 항상 0이다 — provider 응답 정합 위반은 job 전체를 FAILED로
                    만들고, 블록 단위 실패는 target-v2 partialRetry(CC-135) 소관이다.
                blocksWithoutEvidence:
                  type: integer
                  minimum: 0
                  description: 근거(EvidenceLink)가 하나도 연결되지 않은 생성 블록 수. 사실값
                    검토 대상 지표다.
                tocVersionId:
                  type: string
                  format: uuid
                  description: 본문 생성의 기준이 된 목차 버전 id.
        createdAt:
          type: string
          format: date-time
    GenerationJobResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/GenerationJobResource'
        meta:
          type: object
    TocNodeResource:
      type: object
      required:
      - nodeKey
      - title
      - level
      - sortOrder
      properties:
        nodeKey:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 500
        level:
          type: integer
          minimum: 1
          maximum: 6
          description: 목차 계층은 1~6단계 (마이그레이션 0015 ck_toc_node_level, SCR-PLAN-006)
        sortOrder:
          type: integer
          minimum: 0
        generationPolicy:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TocNodeResource'
    TocVersionResource:
      type: object
      required:
      - tocVersionId
      - planId
      - versionNo
      - sourceType
      - baseSnapshotId
      - status
      - contentHash
      - createdBy
      - createdAt
      - nodes
      properties:
        tocVersionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        versionNo:
          type: integer
        sourceType:
          type: string
          enum:
          - AI
          - USER
        baseSnapshotId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TocNodeResource'
    TocVersionResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TocVersionResource'
        meta:
          type: object
    TocTreeNodeInput:
      type: object
      required:
      - title
      properties:
        nodeKey:
          type: string
          maxLength: 80
          description: 기존 노드를 승계할 때만 지정한다. 미지정이면 서버가 새로 발급한다.
        title:
          type: string
          minLength: 1
          maxLength: 500
        generationPolicy:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TocTreeNodeInput'
    TocGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        generationOption:
          type: object
          additionalProperties: false
          properties:
            additionalInstruction:
              type: string
              maxLength: 2000
            notes:
              type: string
              maxLength: 2000
    GenerationJobCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    GenerationJobRetryRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        blockIds:
          type: array
          items:
            type: string
            format: uuid
          description: 예약 필드. TOC/CONTENT 어느 Job이든 값이 오면 400 PLAN-4001로 거절한다.
            블록 단위 provider 재시도는 target-v2 partialRetry(CC-135) 소관이며,
            범위 지정 재생성은 UNE-PLAN-016의 targetNodeKeys로 새 job을 생성해야 한다.
    TocVersionSaveRequest:
      type: object
      required:
      - baseVersionId
      - tocTree
      properties:
        baseVersionId:
          type: string
          format: uuid
        tocTree:
          type: array
          minItems: 1
          description: 중첩 깊이는 6단계까지 허용한다 (초과 시 422 PLAN-422-002).
          items:
            $ref: '#/components/schemas/TocTreeNodeInput'
        confirm:
          type: boolean
          default: false
    ContentGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      - tocVersionId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
          description: 계획서의 현재 확정 PlanContextSnapshot id. 다른 값이면 400 PLAN-4001,
            확정 스냅샷이 없으면 412 PLAN-412-001.
        tocVersionId:
          type: string
          format: uuid
          description: 본문 생성의 기준이 되는 확정(CONFIRMED) 목차 버전 id. 계획서에 속하지
            않거나 없으면 404 TOC-404-001, 미확정이면 412 PLAN-412-002.
        targetNodeKeys:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          description: 범위 지정 재생성. 지정하면 해당 노드의 subtree만 재생성하고 나머지 블록은
            보존한다. 미지정이면 목차 전체를 생성한다(빈 배열은 400 PLAN-4001 —
            "전체"는 필드 생략으로 표현한다). 목차 버전에 없는 nodeKey는
            422 PLAN-422-002.
        protectedBlockIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 현재(supersede되지 않은) generated_block id 목록. 지정 시 해당 블록은
            protection_state=USER_LOCKED로 영속 기록되어 이후 모든 재생성에서 보호된다
            (범위 지정 재생성 여부와 무관). 알 수 없는 id는 422 PLAN-422-002.
    HwpImportRequest:
      type: object
      required:
      - fileId
      properties:
        fileId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
          nullable: true
    # 전체 형태는 contracts/schemas/change-set.schema.json이 정본이다(SelectionEnvelope
    # 5종 · 8종 연산 · materialize 소스 변형). 여기에는 OpenAPI 소비자가 필요로 하는
    # 최소 형태만 두고, 연산 내부는 그 스키마를 참조한다 — 같은 어휘를 두 벌로 적으면
    # 반드시 갈라진다(packages/domain의 CHANGE_OPERATION_TYPES가 런타임 정본).
    ChangeSetRequest:
      type: object
      required:
      - baseRevisionId
      - origin
      - clientMutationId
      description: |-
        일반 편집은 `operations`가 필수다. **Undo/Redo는 반대로 `operations`를 싣지
        않는다** — `undoesChangeSetId`로 되돌릴 ChangeSet만 지목하면 서버가 저장해 둔
        역연산을 쓴다(ADR-30 D6 보정). 역연산은 원본 블록 IR을 통째로 나르므로, 요청
        표면에서 받으면 클라이언트가 origin:'SOURCE'·위조 앵커·locked 노드를 문서에
        직접 심을 수 있다.
      allOf:
      - if:
          required:
          - undoesChangeSetId
        then:
          properties:
            origin:
              enum:
              - UNDO
              - REDO
          not:
            required:
            - operations
        else:
          required:
          - operations
      properties:
        baseRevisionId:
          type: string
          format: uuid
          description: If-Match가 가리키는 Revision과 같아야 한다(다르면 422 DOC-422-004).
        origin:
          $ref: '#/components/schemas/ChangeSetOrigin'
        operations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ChangeOperation'
        clientMutationId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,100}$'
          description: 문서 범위 멱등 앵커(uk_change_set_mutation).
        dryRun:
          type: boolean
          default: false
          description: 검증·Diff만 수행하고 리비전을 만들지 않는다.
        undoesChangeSetId:
          type: string
          format: uuid
          description: |-
            되돌릴 ChangeSet(change_set.undoes_change_set_id). 이 값을 실으면 origin은
            UNDO 또는 REDO여야 하고 operations를 실을 수 없다. 대상 이후 같은 노드를
            건드린 ChangeSet이 있으면 422 DOC-422-004(UNDO_CONFLICT)다.
        checkpointLabel:
          type: string
          maxLength: 100
        changeSummary:
          type: string
          maxLength: 2000
    ChangeSetOrigin:
      type: string
      enum:
      - USER
      - AI
      - AUTOSAVE
      - UNDO
      - REDO
      - RESTORE
      - MATERIALIZE
    ChangeOperationType:
      type: string
      description: 설계 07 §1.9가 고정한 8종. ADR 없이 늘어나지 않는다(ck_change_operation_type).
      enum:
      - INSERT_BLOCKS
      - REPLACE_RANGE
      - DELETE_RANGE
      - SPLIT_PARAGRAPH
      - MERGE_PARAGRAPHS
      - MOVE_BLOCK
      - APPLY_STYLE_ROLE
      - TABLE_PATCH
    TextPosition:
      type: object
      required:
      - paragraphId
      - offset
      properties:
        paragraphId:
          type: string
          minLength: 1
        offset:
          type: integer
          minimum: 0
          description: 문단 run 텍스트를 이은 문자열에 대한 UTF-16 코드 단위 인덱스(§1.8).
    SelectionEnvelope:
      type: object
      description: 화면좌표와 원시 XML 앵커를 담는 필드가 없다(§1.8-4). 종류별 필수 항목은
        contracts/schemas/change-set.schema.json이 oneOf로 닫는다.
      required:
      - kind
      - baseRevisionId
      properties:
        kind:
          type: string
          enum:
          - CURSOR
          - TEXT_RANGE
          - BLOCK
          - SECTION
          - TABLE_CELL
        baseRevisionId:
          type: string
          format: uuid
        at:
          $ref: '#/components/schemas/TextPosition'
        start:
          $ref: '#/components/schemas/TextPosition'
        end:
          $ref: '#/components/schemas/TextPosition'
        blockIds:
          type: array
          items:
            type: string
        sectionId:
          type: string
        tableId:
          type: string
        cellId:
          type: string
    BlockAnchor:
      type: object
      required:
      - relation
      - ref
      properties:
        relation:
          type: string
          enum:
          - BEFORE
          - AFTER
          - FIRST_CHILD
          - LAST_CHILD
        ref:
          type: string
          description: 기준 노드의 안정 ID(원시 XML 앵커가 아니다).
    InsertSource:
      type: object
      description: INSERT_BLOCKS의 블록 출처. GENERATED_BLOCKS가 materialize 경로이며
        서버가 3중 방어(현재 목차버전 일치, superseded_at IS NULL, 보호 블록 제외)를 건다.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - INLINE
          - PROTOTYPE
          - GENERATED_BLOCKS
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        prototypeId:
          type: string
        count:
          type: integer
          minimum: 1
        planId:
          type: string
          format: uuid
        tocVersionId:
          type: string
          format: uuid
    ChangeOperation:
      type: object
      required:
      - type
      - order
      properties:
        type:
          $ref: '#/components/schemas/ChangeOperationType'
        order:
          type: integer
          minimum: 0
          description: ChangeSet 안에서 유일해야 한다(uk_change_operation_order).
        selection:
          $ref: '#/components/schemas/SelectionEnvelope'
        anchor:
          $ref: '#/components/schemas/BlockAnchor'
        source:
          $ref: '#/components/schemas/InsertSource'
        payload:
          type: object
          additionalProperties: true
    DiffEntry:
      type: object
      required:
      - kind
      - nodeId
      properties:
        kind:
          type: string
          enum:
          - ADDED
          - REMOVED
          - MODIFIED
          - MOVED
        nodeId:
          type: string
        preview:
          type: string
          description: 짧은 텍스트 미리보기. 본문이므로 로그·목록에는 싣지 않는다.
    NodeAlias:
      type: object
      required:
      - from
      - to
      - offsetDelta
      properties:
        from:
          type: string
        to:
          type: string
        offsetDelta:
          type: integer
          description: MERGE는 오른쪽 문단의 모든 오프셋을 왼쪽 길이만큼 민다. 이 값이
            없으면 재조회가 노드는 맞히고 문자 위치는 틀린다.
    MaterializeReport:
      type: object
      required:
      - planId
      - tocVersionId
      - candidateBlocks
      - insertedBlocks
      - excluded
      properties:
        planId:
          type: string
          format: uuid
        tocVersionId:
          type: string
          format: uuid
        candidateBlocks:
          type: integer
        insertedBlocks:
          type: integer
        excluded:
          type: array
          description: 제외된 블록과 사유. 조용히 빠지면 사용자는 문서가 왜 비었는지 모른다.
          items:
            type: object
            required:
            - blockId
            - nodeKey
            - reason
            properties:
              blockId:
                type: string
                format: uuid
              nodeKey:
                type: string
              reason:
                type: string
    ChangeSetResult:
      type: object
      required:
      - changeSetId
      - documentId
      - baseRevisionId
      - dryRun
      - applied
      - replayed
      - newRevisionId
      - newRevisionNo
      - irHash
      - diff
      - inverseOperations
      - aliases
      - aliasRemovals
      - warnings
      - materialize
      properties:
        changeSetId:
          type: string
          format: uuid
          nullable: true
          description: dryRun이면 null(아무 행도 쓰지 않았다).
        documentId:
          type: string
          format: uuid
        baseRevisionId:
          type: string
          format: uuid
        dryRun:
          type: boolean
        applied:
          type: boolean
        replayed:
          type: boolean
          description: 같은 clientMutationId 재전송으로 원래 결과를 돌려준 경우 true.
        newRevisionId:
          type: string
          format: uuid
          nullable: true
        newRevisionNo:
          type: integer
          nullable: true
        irHash:
          type: string
        diff:
          type: array
          items:
            $ref: '#/components/schemas/DiffEntry'
        inverseOperations:
          type: array
          description: Undo가 재유도가 아니라 자료 조회가 되도록 저장된 역연산(ADR-30 D6).
          items:
            $ref: '#/components/schemas/ChangeOperation'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/NodeAlias'
        aliasRemovals:
          type: array
          description: 이번 ChangeSet이 무효화한 alias(MERGE 되돌림으로 되살아난 문단).
          items:
            $ref: '#/components/schemas/NodeAlias'
        warnings:
          type: array
          items:
            type: string
        materialize:
          oneOf:
          - $ref: '#/components/schemas/MaterializeReport'
          - type: 'null'
    ChangeSetResultResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ChangeSetResult'
        meta:
          $ref: '#/components/schemas/Meta'
    DocumentIrResource:
      type: object
      required:
      - documentId
      - revisionId
      - revisionNo
      - irHash
      - origin
      - checkpointLabel
      - headRevisionId
      - headRevisionNo
      - irVersion
      - liftedFromV1
      - ir
      - createdBy
      - createdAt
      properties:
        documentId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
        irHash:
          type: string
        origin:
          $ref: '#/components/schemas/RevisionOrigin'
        checkpointLabel:
          type: string
          nullable: true
        headRevisionId:
          type: string
          format: uuid
        headRevisionNo:
          type: integer
        irVersion:
          type: string
          enum:
          - '1'
          - '2'
        liftedFromV1:
          type: boolean
          description: 저장된 ir_json이 v1이라 읽기 시 v2로 승격했는가(ADR-30 D3).
        ir:
          type: object
          description: contracts/schemas/document-ir.schema.json이 정본이다.
          additionalProperties: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    DocumentIrResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/DocumentIrResource'
        meta:
          $ref: '#/components/schemas/Meta'
    RevisionOrigin:
      type: string
      description: 리비전이 어떤 기제로 만들어졌는가(ck_document_revision_origin).
        ChangeSet의 출처(누가 요청했나)와 축이 다르다 — USER/AI 편집은 둘 다 CHANGESET이다.
      enum:
      - IMPORT
      - MATERIALIZE
      - CHANGESET
      - AUTOSAVE
      - UNDO
      - REDO
      - RESTORE
    RevisionResource:
      type: object
      required:
      - revisionId
      - documentId
      - revisionNo
      - parentRevisionId
      - irHash
      - changeSummary
      - origin
      - checkpointLabel
      - isHead
      - createdBy
      - createdAt
      properties:
        revisionId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        parentRevisionId:
          type: string
          format: uuid
          nullable: true
        irHash:
          type: string
        changeSummary:
          type: string
          nullable: true
        origin:
          $ref: '#/components/schemas/RevisionOrigin'
        checkpointLabel:
          type: string
          nullable: true
          description: 자동/수동 checkpoint 라벨. 어휘가 정본에서 닫혀 있지 않아 enum이 아니다.
        isHead:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    RevisionPageResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - page
          - size
          - totalElements
          - totalPages
          - headRevisionId
          - headRevisionNo
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RevisionResource'
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
            headRevisionId:
              type: string
              format: uuid
              nullable: true
            headRevisionNo:
              type: integer
              nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
    RevisionRestoreRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        checkpointLabel:
          type: string
          maxLength: 100
    RevisionRestoreResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - revision
          - changeSetId
          - restoredFromRevisionId
          - restoredFromRevisionNo
          properties:
            revision:
              $ref: '#/components/schemas/RevisionResource'
            changeSetId:
              type: string
              format: uuid
            restoredFromRevisionId:
              type: string
              format: uuid
            restoredFromRevisionNo:
              type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    AutosaveRequest:
      type: object
      required:
      - baseRevisionId
      - delta
      - clientMutationId
      properties:
        baseRevisionId:
          type: string
          format: uuid
        delta:
          type: object
          required:
          - operations
          properties:
            operations:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ChangeOperation'
        clientMutationId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,100}$'
        seq:
          type: integer
          minimum: 0
          description: 클라이언트 큐 순번. 생략하면 서버가 문서별 다음 값을 쓴다.
            하한이 0인 이유는 0-based/1-based를 정하는 정본이 없기 때문이다(0019 §6).
    AutosaveReceipt:
      type: object
      required:
      - autosaveId
      - documentId
      - clientMutationId
      - seq
      - status
      - baseRevisionId
      - resultRevisionId
      - resultRevisionNo
      - irHash
      - replayed
      - receivedAt
      properties:
        autosaveId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        clientMutationId:
          type: string
        seq:
          type: string
          description: bigint이므로 문자열로 나간다(정밀도 보존).
        status:
          type: string
          enum:
          - ACCEPTED
          - CONFLICT
          - SUPERSEDED
        baseRevisionId:
          type: string
          format: uuid
        resultRevisionId:
          type: string
          format: uuid
          nullable: true
        resultRevisionNo:
          type: integer
          nullable: true
        irHash:
          type: string
          nullable: true
        replayed:
          type: boolean
        receivedAt:
          type: string
          format: date-time
    AutosaveReceiptResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AutosaveReceipt'
        meta:
          $ref: '#/components/schemas/Meta'
    RevisionConflictEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          # allOf를 쓰되 어느 브랜치에도 additionalProperties:false를 두지 않는다.
          # 2020-12에서 그 조합은 형제 브랜치의 property를 보지 못해 모든 인스턴스를
          # 무효로 만든다(ADR-24 D4). meta는 원래 열린 객체이므로 제약이 필요 없다.
          allOf:
          - $ref: '#/components/schemas/Meta'
          - type: object
            required:
            - conflict
            properties:
              conflict:
                description: 복구 정보. 이것이 없는 409는 클라이언트가 쓸 수 없다 —
                  최신 Revision을 다시 조회할 좌표가 응답 안에 있어야 한다.
                type: object
                required:
                - currentRevisionId
                - currentRevisionNo
                - headIrHash
                properties:
                  currentRevisionId:
                    type: string
                    format: uuid
                  currentRevisionNo:
                    type: integer
                  headIrHash:
                    type: string
