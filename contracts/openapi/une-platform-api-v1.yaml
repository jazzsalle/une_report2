        ir_json이 v1로 적힌 행은 읽기 시 v2로 승격해 반환한다(liftedFromV1=true,
        ADR-30 D3). 승격은 origin=SOURCE 주입뿐이며 ID·앵커·텍스트는 바뀌지 않는다.'
