openapi: 3.1.0
info:
  title: UNE 재난안전 AI 문서 통합플랫폼 API
  version: 1.0.0
  description: ADR v1.1 및 API·DB·화면별 Sequence 상세설계서 기준 121개 내부 API 계약 초안
# NOTE(CC-003/ADR-20): GET /health is a confirmed out-of-contract operational endpoint
# served at the server root (excluded from the /api/v1 prefix and from this contract).
servers:
- url: http://localhost:3001/api/v1
  description: Local development
- url: https://{host}/api/v1
  description: Deployment
  variables:
    host:
      default: une-platform.example.local
tags:
- name: AUTH
  description: 인증·조직·사용자
- name: HOME
  description: 통합 홈·알림
- name: PLAN
  description: 계획서 기준정보·생성
- name: DOC
  description: HWPX·문서편집·Revision·Export
- name: SIT
  description: 상황·Fact·Snapshot
- name: KNOW
  description: UNI 학습자료·Evidence
- name: SOP
  description: SOP 생성·편집·승인·실행
- name: TASK
  description: 임무·전파·현장보고
- name: JNL
  description: 전자상황판·Execution Log·상황일지·평가
- name: ADMIN
  description: RBAC·조직 Binding·감사·Provider 운영
paths:
  /auth/sso/exchange:
    post:
      tags:
      - AUTH
      summary: T3Q SSO 토큰 교환
      operationId: une_auth_001
      description: '권한: PUBLIC_SSO


        핵심 요청: externalToken, returnUrl


        핵심 응답: accessToken, refreshToken, userContext


        오류: AUTH-1001~1004'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-001
      x-permission: PUBLIC_SSO
      x-db-tables:
      - app_user
      - user_session
      - audit_log
      x-error-codes:
      - AUTH-1001
      - '1004'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoExchangeRequest'
      security: []
  /auth/me:
    get:
      tags:
      - AUTH
      summary: 현재 사용자·기관·역할 조회
      operationId: une_auth_002
      description: '권한: AUTHENTICATED


        핵심 요청: -


        핵심 응답: UserContext


        오류: AUTH-1005'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-002
      x-permission: AUTHENTICATED
      x-db-tables:
      - app_user
      - user_role
      - organization
      x-error-codes:
      - AUTH-1005
      security:
      - BearerAuth: []
  /auth/refresh:
    post:
      tags:
      - AUTH
      summary: Access Token 갱신
      operationId: une_auth_003
      description: '권한: PUBLIC_REFRESH (ADR-22 D3: refresh 토큰 자체가 세션 보유
        증명이며, 만료된 access token으로는 갱신할 수 없으므로 Bearer를 요구하지
        않는다. 토큰의 tenant 세그먼트가 RLS 스코프를 열고 app_user 부모 조인이
        위조를 차단한다. 사용 시 회전(rotation)되어 재사용/동시사용은 AUTH-1002.)


        핵심 요청: refreshToken


        핵심 응답: accessToken


        오류: AUTH-1002'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-003
      # PUBLIC_REFRESH is an auth level (like PUBLIC_SSO/AUTHENTICATED), not a
      # permission-catalog code (ADR-22 D3/D6).
      x-permission: PUBLIC_REFRESH
      x-db-tables:
      - user_session
      x-error-codes:
      - AUTH-1002
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      security: []
  /auth/logout:
    post:
      tags:
      - AUTH
      summary: 세션 종료
      operationId: une_auth_004
      description: '권한: AUTHENTICATED


        핵심 요청: -


        핵심 응답: 204


        오류: AUTH-1006'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-004
      x-permission: AUTHENTICATED
      x-db-tables:
      - user_session
      - audit_log
      x-error-codes:
      - AUTH-1006
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      security:
      - BearerAuth: []
  /organizations/tree:
    get:
      tags:
      - AUTH
      summary: 조직도 조회
      operationId: une_auth_005
      description: '권한: ORG_READ


        핵심 요청: tenantId(optional)


        핵심 응답: OrganizationTree


        오류: ORG-2001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-005
      x-permission: ORG_READ
      x-db-tables:
      - organization
      x-error-codes:
      - ORG-2001
      security:
      - BearerAuth: []
  /users:
    get:
      tags:
      - AUTH
      summary: 사용자·담당자 검색
      operationId: une_auth_006
      description: '권한: USER_READ


        핵심 요청: orgId,keyword,status,page


        핵심 응답: Page<UserSummary>


        오류: USER-2101'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-006
      x-permission: USER_READ
      x-db-tables:
      - app_user
      - organization
      x-error-codes:
      - USER-2101
      security:
      - BearerAuth: []
  /roles:
    get:
      tags:
      - AUTH
      summary: 역할·권한 조회
      operationId: une_auth_007
      description: '권한: RBAC_READ


        핵심 요청: scope


        핵심 응답: Role[]


        오류: RBAC-2201'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-AUTH-007
      x-permission: RBAC_READ
      x-db-tables:
      - role
      - permission
      - role_permission
      x-error-codes:
      - RBAC-2201
      security:
      - BearerAuth: []
  /home/summary:
    get:
      tags:
      - HOME
      summary: 통합 홈 요약
      operationId: une_home_001
      description: '권한: AUTHENTICATED


        핵심 요청: -


        핵심 응답: recentWorks,myTasks,health,alerts


        오류: COM-0001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-HOME-001
      x-permission: AUTHENTICATED
      x-db-tables:
      - document
      - situation
      - task
      - provider_health
      x-error-codes:
      - COM-0001
      security:
      - BearerAuth: []
  /notifications:
    get:
      tags:
      - HOME
      summary: 알림 목록
      operationId: une_home_002
      description: '권한: AUTHENTICATED


        핵심 요청: filter,page


        핵심 응답: Page<Notification>


        오류: NOTI-3001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-HOME-002
      x-permission: AUTHENTICATED
      x-db-tables:
      - notification
      x-error-codes:
      - NOTI-3001
      security:
      - BearerAuth: []
  /notifications/{id}/read:
    post:
      tags:
      - HOME
      summary: 알림 읽음
      operationId: une_home_003
      description: '권한: AUTHENTICATED


        핵심 요청: -


        핵심 응답: Notification


        오류: NOTI-3002'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-HOME-003
      x-permission: AUTHENTICATED
      x-db-tables:
      - notification
      x-error-codes:
      - NOTI-3002
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      security:
      - BearerAuth: []
  /notifications/read-all:
    post:
      tags:
      - HOME
      summary: 전체 읽음
      operationId: une_home_004
      description: '권한: AUTHENTICATED


        핵심 요청: filter


        핵심 응답: count


        오류: NOTI-3003'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-HOME-004
      x-permission: AUTHENTICATED
      x-db-tables:
      - notification
      x-error-codes:
      - NOTI-3003
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      security:
      - BearerAuth: []
  /plans:
    post:
      tags:
      - PLAN
      summary: 계획서 Workspace 생성
      operationId: une_plan_001
      description: '권한: PLAN_CREATE


        핵심 요청: title,startMode,hazardType,managementPhase(templateFileId는 CC-140까지 보류
        — ADR-23 D3)


        핵심 응답: Plan


        오류: PLAN-4001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-PLAN-001
      x-permission: PLAN_CREATE
      x-db-tables:
      - plan
      - document
      x-error-codes:
      - PLAN-4001
      - COM-0400
      - COM-0409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreateRequest'
      security:
      - BearerAuth: []
    get:
      tags:
      - PLAN
      summary: 계획서 목록·검색
      operationId: une_plan_002
      description: '권한: PLAN_READ


        핵심 요청: keyword,status,hazardType,page


        핵심 응답: Page<Plan>


        오류: PLAN-4002'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: keyword
        in: query
        required: false
        description: 제목 부분일치 검색어
        schema:
          type: string
          maxLength: 100
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlanStatus'
      - name: hazardType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlanHazardType'
      - name: inTrash
        in: query
        required: false
        description: true이면 휴지통(deleted_at NOT NULL) 목록을 조회한다.
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-PLAN-002
      x-permission: PLAN_READ
      x-db-tables:
      - plan
      - document
      x-error-codes:
      - PLAN-4002
      security:
      - BearerAuth: []
  /plans/{planId}:
    get:
      tags:
      - PLAN
      summary: 계획서 상세
      operationId: une_plan_003
      description: '권한: PLAN_READ


        핵심 요청: planId


        핵심 응답: PlanDetail


        오류: PLAN-4003'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: 현재 versionNo (PATCH의 If-Match 값)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-PLAN-003
      x-permission: PLAN_READ
      x-db-tables:
      - plan
      - document
      x-error-codes:
      - PLAN-4003
      security:
      - BearerAuth: []
    patch:
      tags:
      - PLAN
      summary: 계획서 메타 수정
      operationId: une_plan_004
      description: '권한: PLAN_EDIT


        핵심 요청: If-Match, JSON Merge Patch


        핵심 응답: Plan


        오류: PLAN-409-001


        재시도 안전성은 If-Match 낙관잠금으로 보장(ADR-23 D1 개정)'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: 갱신된 versionNo
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-PLAN-004
      x-permission: PLAN_EDIT
      x-db-tables:
      - plan
      - audit_log
      x-error-codes:
      - PLAN-409-001
      - PLAN-4001
      - PLAN-4003
      - PLAN-412-002
