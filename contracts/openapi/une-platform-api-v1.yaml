          type: object
        topK:
          type: integer
          minimum: 1
          maximum: 50
    SopGenerationRequest:
      type: object
      required:
      - snapshotId
      - evidenceSetId
      - schemaVersion
      properties:
        snapshotId:
          type: string
          format: uuid
        evidenceSetId:
          type: string
          format: uuid
        schemaVersion:
          type: string
          enum:
          - '1.0'
    SopCreateRequest:
      type: object
