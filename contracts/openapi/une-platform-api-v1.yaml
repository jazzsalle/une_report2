      operationId: une_plan_016
      description: '권한: PLAN_GENERATE


        핵심 요청: contextSnapshotId,tocVersionId,targetNodeKeys,protectedBlockIds


        핵심 응답: GenerationJob (jobType=CONTENT)


        오류: T3Q-502-002


        확정 PlanContextSnapshot과 목차 버전을 입력으로 CONTENT 생성 Job을 큐잉한다.
        202는 큐잉 성공만을 뜻하며 본문 산출물은 워커가 만든다. 진행 상황은
        UNE-PLAN-010(상태)과 UNE-PLAN-011(SSE content.block/job.progress)로 관측한다.


        전제조건: contextSnapshotId는 계획서의 현재 확정 스냅샷이어야 하고
        (아니면 400 PLAN-4001, 확정 스냅샷 자체가 없으면 412 PLAN-412-001),
        tocVersionId는 같은 계획서의 확정(CONFIRMED) 목차 버전이어야 한다
        (계획서 불일치·미존재는 404 TOC-404-001, 목차 미확정 등 상태 전제조건
        위반은 412 PLAN-412-002).


        동시성: 같은 계획서에 활성(QUEUED/RUNNING/CANCEL_REQUESTED) 생성 Job이
        있으면 409 PLAN-409-002로 거절한다. 이 조건은 job 타입과 무관하다
        (TOC/CONTENT 어느 쪽이 진행 중이어도 새 생성 Job을 받지 않는다).
        진행 중이라 계획서 상태가 CONTENT_GENERATING인 경우도 412가 아니라 409로
        답한다 — 상태 전제조건보다 활성 Job 판정을 먼저 적용한다.


        재생성 범위: targetNodeKeys를 지정하면 해당 노드 subtree만 재생성하고
        나머지 블록은 보존한다. protectedBlockIds로 지정한 사용자 편집 블록은
        protection_state=USER_LOCKED로 영속 기록되어 이후 모든 재생성에서
        덮어쓰지 않는다 (알 수 없는 blockId는 422 PLAN-422-002).


