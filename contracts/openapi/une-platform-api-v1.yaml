      description: '권한: ADMIN_INTEGRATION


        핵심 요청: testMode


        핵심 응답: ProviderHealth


        오류: PROV-503-010'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-ADMIN-010
      x-permission: ADMIN_INTEGRATION
      x-db-tables:
      - provider_health
      x-error-codes:
      - PROV-503-010
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      security:
      - BearerAuth: []
  /admin/retention-policies:
    get:
      tags:
      - ADMIN
      summary: 보존정책 조회
      operationId: une_admin_011
      description: '권한: ADMIN_SECURITY


        핵심 요청: -


        핵심 응답: RetentionPolicy[]


        오류: RET-9001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-ADMIN-011
      x-permission: ADMIN_SECURITY
      x-db-tables:
      - retention_policy
      x-error-codes:
      - RET-9001
      security:
      - BearerAuth: []
  /admin/retention-policies/{id}:
    patch:
      tags:
      - ADMIN
      summary: 보존정책 변경
      operationId: une_admin_012
      description: '권한: ADMIN_SECURITY


        핵심 요청: If-Match,patch


        핵심 응답: RetentionPolicy


        오류: RET-409-001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-ADMIN-012
      x-permission: ADMIN_SECURITY
      x-db-tables:
      - retention_policy
      - audit_log
      x-error-codes:
      - RET-409-001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    # ADR-23 D1: create/confirm operations of the plan slice require the header so
    # the api_idempotency replay store can return the original result on retry.
    # Missing or malformed key -> COM-0400; same key with a different payload
    # (or still in flight) -> COM-0409.
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]{1,100}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    # SSE 재접속 지점. 값은 마지막으로 수신한 job_event.sequence_no (설계 10 §2 SSE 규칙).
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]{1,18}$'
  schemas:
    Meta:
      type: object
      required:
      - requestId
      - correlationId
      - timestamp
      - schemaVersion
      properties:
        requestId:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        schemaVersion:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      - recoverable
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
          nullable: true
        recoverable:
          type: boolean
        userAction:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    GenericRequest:
      type: object
      additionalProperties: true
    GenericResponse:
      type: object
      additionalProperties: true
    PageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    SsoExchangeRequest:
      type: object
      required:
      - externalToken
      properties:
        externalToken:
          type: string
        returnUrl:
          type: string
          format: uri
    # ADR-22 D4: aligned to the design §2 common response envelope
    # ({success, data, meta}) used by every other success response, the
    # common-error schema, and the mock server.
    TokenResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - accessToken
          - refreshToken
          - expiresIn
          - userContext
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            userContext:
              type: object
        meta:
          type: object
    # CC-110 (ADR-23): the plan slice (UNE-PLAN-001~008) replaces the loose
    # `Plan` placeholder with explicit resource schemas and {success, data, meta}
    # envelopes. The placeholder below is kept only because UNE-PLAN-009+ still
    # reference it; each later work item replaces its own usage.
    # ADR-23 D3: hazard/phase vocabulary is taken from
    # contracts/schemas/plan-context.schema.json (backgroundInfo.disasterType /
    # backgroundInfo.controlPhase) until a code catalog table exists.
    PlanHazardType:
      type: string
      enum:
      - 폭염
      - 태풍/호우
      - 지진
      - 황사
      - 산불
      - 감염병
      - 가축질병
      - 다중밀집건축물붕괴대형사고
      - 정부주요시설
      - 학교시설
    PlanManagementPhase:
      type: string
      enum:
      - 예방
      - 대비
    # 설계 09 §4 계획서 Document 상태모델
    PlanStatus:
      type: string
      enum:
      - DRAFT
      - CONTEXT_READY
      - OUTLINE_GENERATING
      - OUTLINE_REVIEW
      - OUTLINE_CONFIRMED
      - CONTENT_GENERATING
      - EDITING
      - REVIEW_REQUESTED
      - CHANGES_REQUESTED
      - APPROVED
      - FINAL
      - REOPENED
      - ERROR
    PlanStartMode:
      type: string
      enum:
      - BLANK
      - UPLOAD_HWPX
      - RECENT
    PlanResource:
      type: object
      required:
      - planId
      - tenantId
      - title
      - hazardType
      - managementPhase
      - status
      - ownerId
      - versionNo
      - createdAt
      - updatedAt
      properties:
        planId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
        status:
          $ref: '#/components/schemas/PlanStatus'
        documentId:
          type:
          - string
          - 'null'
          format: uuid
        currentContextSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
        currentTocVersionId:
          type:
          - string
          - 'null'
          format: uuid
        startMode:
          $ref: '#/components/schemas/PlanStartMode'
        versionNo:
          type: integer
          description: 낙관적 잠금 버전 (If-Match/ETag 값)
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 휴지통 이동 시각 (null이면 활성)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # ADR-23 D4: 확정된 기준정보는 불변이며 content_hash(정규화 JSON SHA-256)로
    # 동일 내용 재확정을 dedupe한다.
    PlanContextSnapshotResource:
      type: object
      required:
      - contextSnapshotId
      - planId
      - versionNo
      - contextJson
      - contentHash
      - confirmedBy
      - confirmedAt
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        versionNo:
          type: integer
        contextJson:
          $ref: '#/components/schemas/PlanContext'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        supersedesId:
          type:
          - string
          - 'null'
          format: uuid
        confirmedBy:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
    # ADR-23 D2: 계획서당 1행 upsert. 임시저장은 완화 검증이므로 contextJson은
    # 미완성 상태를 허용한다(타입·enum·길이 위반은 PLAN-422-001).
    ContextDraftResource:
      type: object
      required:
      - contextDraftId
      - planId
      - contextJson
      - schemaVersion
      - updatedBy
      - updatedAt
      properties:
        contextDraftId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        contextJson:
          type: object
          additionalProperties: true
        schemaVersion:
          type: string
          maxLength: 20
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
    PlanResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlanResource'
        meta:
          type: object
    PlanDetailResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          allOf:
          - $ref: '#/components/schemas/PlanResource'
          properties:
            currentContextSnapshot:
              anyOf:
              - $ref: '#/components/schemas/PlanContextSnapshotResource'
              - type: 'null'
              description: 현재 확정 Snapshot (없으면 null)
        meta:
          type: object
    PlanPageResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - page
          - size
          - totalElements
          - totalPages
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanResource'
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
        meta:
          type: object
    ContextDraftResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ContextDraftResource'
        meta:
          type: object
    PlanContextSnapshotResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlanContextSnapshotResource'
        meta:
          type: object
    PlanContextSnapshotListResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanContextSnapshotResource'
        meta:
          type: object
    # ADR-23 D3: plan.hazard_type/management_phase는 NOT NULL이므로 생성 요청에
    # 필수로 포함한다(기준선 계약 누락 해소).
    PlanCreateRequest:
      type: object
      required:
      - title
      - startMode
      - hazardType
      - managementPhase
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        startMode:
          $ref: '#/components/schemas/PlanStartMode'
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
        templateFileId:
          type:
          - string
          - 'null'
          format: uuid
          description: 파일 업로드는 CC-140 범위로 보류 — 값이 제공되면 400 PLAN-4001로 거부한다 (ADR-23 D3).
    # JSON Merge Patch 부분집합: 메타 3필드만 허용하고 null(필드 삭제)은 불가.
    # status/owner 변경은 별도 도메인 액션이다 (ADR-23 D5).
    PlanMetaPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
    PlanDeleteRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    PlanContextDraftRequest:
      type: object
      required:
      - context
      properties:
        context:
          type: object
          additionalProperties: true
          description: 완화 검증 대상 기준정보 작업본 (미완성 허용, ADR-23 D2)
        schemaVersion:
          type: string
          maxLength: 20
          default: '1.0'
    PlanContext:
      type: object
      description: '엄격 검증: contracts/schemas/plan-context.schema.json
        (additionalProperties 불가). Snapshot 확정은 전체 스키마 통과 필수,
        draft는 required/minLength/minItems만 유예'
      additionalProperties: true
    # CC-120: UNE-PLAN-009~015 (목차 생성 Job / SSE / 목차 버전) 슬라이스.
    # CC-130에서 UNE-PLAN-016(content-jobs)도 GenerationJobResponse로 옮겼다.
    # 아래 `GenerationJob` placeholder는 아직 후속 항목이 소유한 operation
    # (UNE-DOC-010 AI 편집, UNE-SOP-001, UNE-JNL-007)이 참조하므로 남겨둔다.
    JobStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - CANCEL_REQUESTED
      - COMPLETED
      - FAILED
      - CANCELLED
    GenerationJobResource:
      type: object
      required:
      - jobId
      - jobType
      - aggregateType
      - aggregateId
      - providerCode
      - status
      - progressPct
      - attemptNo
      - correlationId
      - createdAt
      properties:
        jobId:
          type: string
          format: uuid
        jobType:
          type: string
          enum:
          - TOC
          - CONTENT
          - AI_EDIT
          - SOP
        aggregateType:
          type: string
          maxLength: 30
          description: 대상 Aggregate 종류 (설계 10 §6.15 어휘 PLAN/DOCUMENT/SITUATION)
        aggregateId:
          type: string
          format: uuid
        providerCode:
          type: string
          enum:
          - T3Q
          - UNI
          - UNE
        status:
          $ref: '#/components/schemas/JobStatus'
        progressPct:
          type: number
          minimum: 0
          maximum: 100
        attemptNo:
          type: integer
          minimum: 0
          description: 워커 실행 시도 횟수. 생성 시 0이고 워커가 선점할 때마다 +1 한다
            (첫 실행 후 1). UNE-PLAN-013 사용자 재시도는 0으로 리셋한다
            (마이그레이션 0015 generation_job.attempt_no / ADR-25 D9).
        correlationId:
          type: string
          maxLength: 80
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        result:
          type:
          - object
          - 'null'
          description: 완료된 Job의 산출물. 진행 중이거나 실패면 null. TOC Job은
            tocVersionId/tocVersionNo를, CONTENT Job(UNE-PLAN-016)은 contentSummary와
            입력 tocVersionId를 싣는다. Job 타입별 oneOf 분기를 두지 않는 이유는 생성
            타입이 파괴되기 때문이며, 타입별로 실리는 속성만 다르다.
          properties:
            tocVersionId:
              type: string
              format: uuid
            tocVersionNo:
              type: integer
            contentSummary:
              type: object
              description: CONTENT Job 집계. generated+preserved+failed는 이번 job의 대상
                노드 수와 일치한다. 범위 지정 재생성(targetNodeKeys)에서 범위 밖 노드는
                대상이 아니므로 어느 항목에도 집계되지 않는다.
              properties:
                generated:
                  type: integer
                  minimum: 0
                  description: 새로 생성된 블록 수.
                preserved:
                  type: integer
                  minimum: 0
                  description: 보호(protection_state=USER_LOCKED 또는 SYSTEM_LOCKED)로
                    재생성하지 않고 유지한 블록 수.
                failed:
                  type: integer
                  minimum: 0
                  description: 생성에 실패한 노드 수 (content.block outcome=FAILED). legacy
                    경로에서는 항상 0이다 — provider 응답 정합 위반은 job 전체를 FAILED로
                    만들고, 블록 단위 실패는 target-v2 partialRetry(CC-135) 소관이다.
                blocksWithoutEvidence:
                  type: integer
                  minimum: 0
                  description: 근거(EvidenceLink)가 하나도 연결되지 않은 생성 블록 수. 사실값
                    검토 대상 지표다.
                tocVersionId:
                  type: string
                  format: uuid
                  description: 본문 생성의 기준이 된 목차 버전 id.
        createdAt:
          type: string
          format: date-time
    GenerationJobResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/GenerationJobResource'
        meta:
          type: object
    TocNodeResource:
      type: object
      required:
      - nodeKey
      - title
      - level
      - sortOrder
      properties:
        nodeKey:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 500
        level:
          type: integer
          minimum: 1
          maximum: 6
          description: 목차 계층은 1~6단계 (마이그레이션 0015 ck_toc_node_level, SCR-PLAN-006)
        sortOrder:
          type: integer
          minimum: 0
        generationPolicy:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TocNodeResource'
    TocVersionResource:
      type: object
      required:
      - tocVersionId
      - planId
      - versionNo
      - sourceType
      - baseSnapshotId
      - status
      - contentHash
      - createdBy
      - createdAt
      - nodes
      properties:
        tocVersionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        versionNo:
          type: integer
        sourceType:
          type: string
          enum:
          - AI
          - USER
        baseSnapshotId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TocNodeResource'
    TocVersionResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TocVersionResource'
        meta:
          type: object
    TocTreeNodeInput:
      type: object
      required:
      - title
      properties:
        nodeKey:
          type: string
          maxLength: 80
          description: 기존 노드를 승계할 때만 지정한다. 미지정이면 서버가 새로 발급한다.
        title:
          type: string
          minLength: 1
          maxLength: 500
        generationPolicy:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TocTreeNodeInput'
    TocGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        generationOption:
          type: object
          additionalProperties: false
          properties:
            additionalInstruction:
              type: string
              maxLength: 2000
            notes:
              type: string
              maxLength: 2000
    GenerationJobCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    GenerationJobRetryRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        blockIds:
          type: array
          items:
            type: string
            format: uuid
          description: 예약 필드. TOC/CONTENT 어느 Job이든 값이 오면 400 PLAN-4001로 거절한다.
            블록 단위 provider 재시도는 target-v2 partialRetry(CC-135) 소관이며,
            범위 지정 재생성은 UNE-PLAN-016의 targetNodeKeys로 새 job을 생성해야 한다.
    TocVersionSaveRequest:
      type: object
      required:
      - baseVersionId
      - tocTree
      properties:
        baseVersionId:
          type: string
          format: uuid
        tocTree:
          type: array
          minItems: 1
          description: 중첩 깊이는 6단계까지 허용한다 (초과 시 422 PLAN-422-002).
          items:
            $ref: '#/components/schemas/TocTreeNodeInput'
        confirm:
          type: boolean
          default: false
    ContentGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      - tocVersionId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
          description: 계획서의 현재 확정 PlanContextSnapshot id. 다른 값이면 400 PLAN-4001,
            확정 스냅샷이 없으면 412 PLAN-412-001.
        tocVersionId:
          type: string
          format: uuid
          description: 본문 생성의 기준이 되는 확정(CONFIRMED) 목차 버전 id. 계획서에 속하지
            않거나 없으면 404 TOC-404-001, 미확정이면 412 PLAN-412-002.
        targetNodeKeys:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          description: 범위 지정 재생성. 지정하면 해당 노드의 subtree만 재생성하고 나머지 블록은
            보존한다. 미지정이면 목차 전체를 생성한다(빈 배열은 400 PLAN-4001 —
            "전체"는 필드 생략으로 표현한다). 목차 버전에 없는 nodeKey는
            422 PLAN-422-002.
        protectedBlockIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 현재(supersede되지 않은) generated_block id 목록. 지정 시 해당 블록은
            protection_state=USER_LOCKED로 영속 기록되어 이후 모든 재생성에서 보호된다
            (범위 지정 재생성 여부와 무관). 알 수 없는 id는 422 PLAN-422-002.
    HwpImportRequest:
      type: object
      required:
      - fileId
      properties:
        fileId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
          nullable: true
    ChangeSetRequest:
      type: object
      required:
      - baseRevisionId
      - operations
      - clientMutationId
      properties:
        baseRevisionId:
          type: string
          format: uuid
        operations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        clientMutationId:
          type: string
    ExportRequest:
      type: object
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - HWPX
          - PDF
          - DOCX
          - JSON
        revisionId:
          type: string
          format: uuid
          nullable: true
    SituationCreateRequest:
      type: object
      required:
      - mode
      - title
      - hazardType
      properties:
        mode:
          type: string
          enum:
          - LIVE
          - EXERCISE
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
        occurredAt:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          nullable: true
    ProviderQueryRequest:
      type: object
      required:
      - providers
      - query
      properties:
        providers:
          type: array
          items:
            type: string
            enum:
            - KMA
            - MOIS
            - SAFEKOREA
            - NAVER
            - T3Q
        query:
          type: object
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    SituationSnapshotCreateRequest:
      type: object
      required:
      - factIds
      - effectiveAt
      properties:
        factIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        conflictResolutionIds:
          type: array
          items:
            type: string
            format: uuid
        effectiveAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
    KnowledgeDocumentCreateRequest:
      type: object
      required:
      - fileId
      - documentType
      properties:
        fileId:
          type: string
          format: uuid
        documentType:
          type: string
        metadata:
          type: object
    EvidenceSearchRequest:
      type: object
      required:
      - query
      - topK
      properties:
        query:
          type: string
        filters:
          type: object
        topK:
          type: integer
          minimum: 1
          maximum: 50
    SopGenerationRequest:
      type: object
      required:
      - snapshotId
      - evidenceSetId
      - schemaVersion
      properties:
        snapshotId:
          type: string
          format: uuid
        evidenceSetId:
          type: string
          format: uuid
        schemaVersion:
          type: string
          enum:
          - '1.0'
    SopCreateRequest:
      type: object
      required:
      - title
      - hazardType
      properties:
        situationId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        hazardType:
          type: string
    SopGraph:
      type: object
      description: See 03_json-schema/sop-graph.schema.json
      additionalProperties: true
    SopRunCreateRequest:
      type: object
      required:
      - approvedVersionId
      - snapshotId
      - mode
      properties:
        approvedVersionId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        mode:
          type: string
