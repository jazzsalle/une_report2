      summary: ChangeSet 원자 적용
      operationId: une_doc_006
      description: '권한: DOC_EDIT


        핵심 요청: If-Match, baseRevisionId, origin, operations, clientMutationId


        핵심 응답: ChangeSetResult(새 Revision + Diff + 역연산)


        오류: DOC-409-001, DOC-422-004, COM-0409, COM-0428


        이중 가드: If-Match(head revision_no)와 body.baseRevisionId가 모두 필요하다.
        둘이 서로 다른 Revision을 가리키면 요청 자체가 자기모순이므로 422 DOC-422-004로
        끝난다 — 재조회로 고쳐지지 않는 오류를 409로 답하면 클라이언트가 무한히 재시도한다.
        둘이 일치하지만 head가 이미 움직였으면 409 DOC-409-001이며, 응답에 현재 ETag 헤더와
        meta.conflict(currentRevisionId/currentRevisionNo/headIrHash)를 함께 싣는다.


        원자성: change_set + change_operation N + document_revision + document 포인터 +
        audit_log가 한 트랜잭션이다. 연산 하나라도 실패하면 리비전은 생기지 않는다(설계 07
        §1.9 on error rollback + no partial document mutation).


        dryRun: 검증과 Diff까지만 하고 아무 행도 쓰지 않는다(US-PLAN-017 AC-01).
        ETag는 그대로 head의 값이 나간다.


        멱등: clientMutationId가 앵커다(uk_change_set_mutation). 같은 값 + 같은 내용은
        원래 결과를 replayed=true로 되돌려 주고, 같은 값 + 다른 내용은 409 COM-0409다.
        재전송 응답의 diff는 비어 있다 — 문서 본문 미리보기를 재생산하려고 저장해 두지 않는다.
        **거절(REJECTED)된 요청의 재전송은 200이 아니라 다시 422다**: 200 + applied=false를
        주면 오프라인 큐가 성공으로 처리해 사용자의 편집이 조용히 사라진다.


        Undo/Redo: operations를 싣지 않고 undoesChangeSetId로 되돌릴 ChangeSet만 지목한다.
        서버가 저장해 둔 역연산을 적용하므로 요청 표면에 IR 조각이 들어올 자리가 없다.
        대상 이후 같은 노드를 건드린 ChangeSet이 있으면 422 DOC-422-004이며 violations에
        영향 노드 ID가 실린다(US-PLAN-017 E-03).


        상태: document.status가 EDITING이 아니면 422 DOC-422-004다(재조회로 고쳐지지 않는다).'
