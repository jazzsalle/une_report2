components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    # ADR-23 D1: create/confirm operations of the plan slice require the header so
    # the api_idempotency replay store can return the original result on retry.
    # Missing or malformed key -> COM-0400; same key with a different payload
    # (or still in flight) -> COM-0409.
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: '^[A-Za-z0-9._:-]{1,100}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    # CC-150: 문서 편집 오퍼레이션(UNE-DOC-006/008/009)은 If-Match가 필수다.
    # 값은 document_revision.revision_no의 강한 엔티티 태그다. 약한 태그(W/"3")는
    # 거부한다 — RFC 7232는 If-Match에 강한 비교만 허용한다. 부재는 428 COM-0428,
    # 형식 오류는 400 COM-0400, 불일치는 409 DOC-409-00x다.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"?[0-9]{1,9}"?$'
    # SSE 재접속 지점. 값은 마지막으로 수신한 job_event.sequence_no (설계 10 §2 SSE 규칙).
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]{1,18}$'
  schemas:
    Meta:
      type: object
      required:
      - requestId
      - correlationId
      - timestamp
      - schemaVersion
      properties:
        requestId:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        schemaVersion:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      - recoverable
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
          nullable: true
        recoverable:
          type: boolean
        userAction:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
    GenericRequest:
      type: object
      additionalProperties: true
    GenericResponse:
      type: object
      additionalProperties: true
    PageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    SsoExchangeRequest:
      type: object
      required:
      - externalToken
      properties:
        externalToken:
          type: string
        returnUrl:
          type: string
          format: uri
    # ADR-22 D4: aligned to the design §2 common response envelope
    # ({success, data, meta}) used by every other success response, the
    # common-error schema, and the mock server.
    TokenResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - accessToken
          - refreshToken
          - expiresIn
          - userContext
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            userContext:
              type: object
        meta:
          type: object
    # CC-110 (ADR-23): the plan slice (UNE-PLAN-001~008) replaces the loose
    # `Plan` placeholder with explicit resource schemas and {success, data, meta}
    # envelopes. The placeholder below is kept only because UNE-PLAN-009+ still
    # reference it; each later work item replaces its own usage.
    # ADR-23 D3: hazard/phase vocabulary is taken from
    # contracts/schemas/plan-context.schema.json (backgroundInfo.disasterType /
    # backgroundInfo.controlPhase) until a code catalog table exists.
    PlanHazardType:
      type: string
      enum:
      - 폭염
      - 태풍/호우
      - 지진
      - 황사
      - 산불
      - 감염병
      - 가축질병
      - 다중밀집건축물붕괴대형사고
      - 정부주요시설
      - 학교시설
    PlanManagementPhase:
      type: string
      enum:
      - 예방
      - 대비
    # 설계 09 §4 계획서 Document 상태모델
    PlanStatus:
      type: string
      enum:
      - DRAFT
      - CONTEXT_READY
      - OUTLINE_GENERATING
      - OUTLINE_REVIEW
      - OUTLINE_CONFIRMED
      - CONTENT_GENERATING
      - EDITING
      - REVIEW_REQUESTED
      - CHANGES_REQUESTED
      - APPROVED
      - FINAL
      - REOPENED
      - ERROR
    PlanStartMode:
      type: string
      enum:
      - BLANK
      - UPLOAD_HWPX
      - RECENT
    PlanResource:
      type: object
      required:
      - planId
      - tenantId
      - title
      - hazardType
      - managementPhase
      - status
      - ownerId
      - versionNo
      - createdAt
      - updatedAt
      properties:
        planId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
        status:
          $ref: '#/components/schemas/PlanStatus'
        documentId:
          type:
          - string
          - 'null'
          format: uuid
        currentContextSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
        currentTocVersionId:
          type:
          - string
          - 'null'
          format: uuid
        startMode:
          $ref: '#/components/schemas/PlanStartMode'
        versionNo:
          type: integer
          description: 낙관적 잠금 버전 (If-Match/ETag 값)
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 휴지통 이동 시각 (null이면 활성)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # ADR-23 D4: 확정된 기준정보는 불변이며 content_hash(정규화 JSON SHA-256)로
    # 동일 내용 재확정을 dedupe한다.
    PlanContextSnapshotResource:
      type: object
      required:
      - contextSnapshotId
      - planId
      - versionNo
      - contextJson
      - contentHash
      - confirmedBy
      - confirmedAt
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        versionNo:
          type: integer
        contextJson:
          $ref: '#/components/schemas/PlanContext'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        supersedesId:
          type:
          - string
          - 'null'
          format: uuid
        confirmedBy:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
    # ADR-23 D2: 계획서당 1행 upsert. 임시저장은 완화 검증이므로 contextJson은
    # 미완성 상태를 허용한다(타입·enum·길이 위반은 PLAN-422-001).
    ContextDraftResource:
      type: object
      required:
      - contextDraftId
      - planId
      - contextJson
      - schemaVersion
      - updatedBy
      - updatedAt
      properties:
        contextDraftId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        contextJson:
          type: object
          additionalProperties: true
        schemaVersion:
          type: string
          maxLength: 20
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
    PlanResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlanResource'
        meta:
          type: object
    PlanDetailResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          allOf:
          - $ref: '#/components/schemas/PlanResource'
          properties:
            currentContextSnapshot:
              anyOf:
              - $ref: '#/components/schemas/PlanContextSnapshotResource'
              - type: 'null'
              description: 현재 확정 Snapshot (없으면 null)
        meta:
          type: object
    PlanPageResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - page
          - size
          - totalElements
          - totalPages
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanResource'
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
        meta:
          type: object
    ContextDraftResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ContextDraftResource'
        meta:
          type: object
    PlanContextSnapshotResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlanContextSnapshotResource'
        meta:
          type: object
    PlanContextSnapshotListResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanContextSnapshotResource'
        meta:
          type: object
    # ADR-23 D3: plan.hazard_type/management_phase는 NOT NULL이므로 생성 요청에
    # 필수로 포함한다(기준선 계약 누락 해소).
    PlanCreateRequest:
      type: object
      required:
      - title
      - startMode
      - hazardType
      - managementPhase
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        startMode:
          $ref: '#/components/schemas/PlanStartMode'
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
        templateFileId:
          type:
          - string
          - 'null'
          format: uuid
          description: 파일 업로드는 CC-140 범위로 보류 — 값이 제공되면 400 PLAN-4001로 거부한다 (ADR-23 D3).
    # JSON Merge Patch 부분집합: 메타 3필드만 허용하고 null(필드 삭제)은 불가.
    # status/owner 변경은 별도 도메인 액션이다 (ADR-23 D5).
    PlanMetaPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        hazardType:
          $ref: '#/components/schemas/PlanHazardType'
        managementPhase:
          $ref: '#/components/schemas/PlanManagementPhase'
    PlanDeleteRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    PlanContextDraftRequest:
      type: object
      required:
      - context
      properties:
        context:
          type: object
          additionalProperties: true
          description: 완화 검증 대상 기준정보 작업본 (미완성 허용, ADR-23 D2)
        schemaVersion:
          type: string
          maxLength: 20
          default: '1.0'
    PlanContext:
      type: object
      description: '엄격 검증: contracts/schemas/plan-context.schema.json
        (additionalProperties 불가). Snapshot 확정은 전체 스키마 통과 필수,
        draft는 required/minLength/minItems만 유예'
      additionalProperties: true
    # CC-120: UNE-PLAN-009~015 (목차 생성 Job / SSE / 목차 버전) 슬라이스.
    # CC-130에서 UNE-PLAN-016(content-jobs)도 GenerationJobResponse로 옮겼다.
    # 아래 `GenerationJob` placeholder는 아직 후속 항목이 소유한 operation
    # (UNE-DOC-010 AI 편집, UNE-SOP-001, UNE-JNL-007)이 참조하므로 남겨둔다.
    JobStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - CANCEL_REQUESTED
      - COMPLETED
      - FAILED
      - CANCELLED
    GenerationJobResource:
      type: object
      required:
      - jobId
      - jobType
      - aggregateType
      - aggregateId
      - providerCode
      - status
      - progressPct
      - attemptNo
      - correlationId
      - createdAt
      properties:
        jobId:
          type: string
          format: uuid
        jobType:
          type: string
          enum:
          - TOC
          - CONTENT
          - AI_EDIT
          - SOP
        aggregateType:
          type: string
          maxLength: 30
          description: 대상 Aggregate 종류 (설계 10 §6.15 어휘 PLAN/DOCUMENT/SITUATION)
        aggregateId:
          type: string
          format: uuid
        providerCode:
          type: string
          enum:
          - T3Q
          - UNI
          - UNE
        status:
          $ref: '#/components/schemas/JobStatus'
        progressPct:
          type: number
          minimum: 0
          maximum: 100
        attemptNo:
          type: integer
          minimum: 0
          description: 워커 실행 시도 횟수. 생성 시 0이고 워커가 선점할 때마다 +1 한다
            (첫 실행 후 1). UNE-PLAN-013 사용자 재시도는 0으로 리셋한다
            (마이그레이션 0015 generation_job.attempt_no / ADR-25 D9).
        correlationId:
          type: string
          maxLength: 80
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        result:
          type:
          - object
          - 'null'
          description: 완료된 Job의 산출물. 진행 중이거나 실패면 null. TOC Job은
            tocVersionId/tocVersionNo를, CONTENT Job(UNE-PLAN-016)은 contentSummary와
            입력 tocVersionId를 싣는다. Job 타입별 oneOf 분기를 두지 않는 이유는 생성
            타입이 파괴되기 때문이며, 타입별로 실리는 속성만 다르다.
          properties:
            tocVersionId:
              type: string
              format: uuid
            tocVersionNo:
              type: integer
            contentSummary:
              type: object
              description: CONTENT Job 집계. generated+preserved+failed는 이번 job의 대상
                노드 수와 일치한다. 범위 지정 재생성(targetNodeKeys)에서 범위 밖 노드는
                대상이 아니므로 어느 항목에도 집계되지 않는다.
              properties:
                generated:
                  type: integer
                  minimum: 0
                  description: 새로 생성된 블록 수.
                preserved:
                  type: integer
                  minimum: 0
                  description: 보호(protection_state=USER_LOCKED 또는 SYSTEM_LOCKED)로
                    재생성하지 않고 유지한 블록 수.
                failed:
                  type: integer
                  minimum: 0
                  description: 생성에 실패한 노드 수 (content.block outcome=FAILED). legacy
                    경로에서는 항상 0이다 — provider 응답 정합 위반은 job 전체를 FAILED로
                    만들고, 블록 단위 실패는 target-v2 partialRetry(CC-135) 소관이다.
                blocksWithoutEvidence:
                  type: integer
                  minimum: 0
                  description: 근거(EvidenceLink)가 하나도 연결되지 않은 생성 블록 수. 사실값
                    검토 대상 지표다.
                tocVersionId:
                  type: string
                  format: uuid
                  description: 본문 생성의 기준이 된 목차 버전 id.
        createdAt:
          type: string
          format: date-time
    GenerationJobResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/GenerationJobResource'
        meta:
          type: object
    TocNodeResource:
      type: object
      required:
      - nodeKey
      - title
      - level
      - sortOrder
      properties:
        nodeKey:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 500
        level:
          type: integer
          minimum: 1
          maximum: 6
          description: 목차 계층은 1~6단계 (마이그레이션 0015 ck_toc_node_level, SCR-PLAN-006)
        sortOrder:
          type: integer
          minimum: 0
        generationPolicy:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TocNodeResource'
    TocVersionResource:
      type: object
      required:
      - tocVersionId
      - planId
      - versionNo
      - sourceType
      - baseSnapshotId
      - status
      - contentHash
      - createdBy
      - createdAt
      - nodes
      properties:
        tocVersionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        versionNo:
          type: integer
        sourceType:
          type: string
          enum:
          - AI
          - USER
        baseSnapshotId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TocNodeResource'
    TocVersionResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TocVersionResource'
        meta:
          type: object
    TocTreeNodeInput:
      type: object
      required:
      - title
      properties:
        nodeKey:
          type: string
          maxLength: 80
          description: 기존 노드를 승계할 때만 지정한다. 미지정이면 서버가 새로 발급한다.
        title:
          type: string
          minLength: 1
          maxLength: 500
        generationPolicy:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TocTreeNodeInput'
    TocGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
        generationOption:
          type: object
          additionalProperties: false
          properties:
            additionalInstruction:
              type: string
              maxLength: 2000
            notes:
              type: string
              maxLength: 2000
    GenerationJobCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    GenerationJobRetryRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        blockIds:
          type: array
          items:
            type: string
            format: uuid
          description: 예약 필드. TOC/CONTENT 어느 Job이든 값이 오면 400 PLAN-4001로 거절한다.
            블록 단위 provider 재시도는 target-v2 partialRetry(CC-135) 소관이며,
            범위 지정 재생성은 UNE-PLAN-016의 targetNodeKeys로 새 job을 생성해야 한다.
    TocVersionSaveRequest:
      type: object
      required:
      - baseVersionId
      - tocTree
      properties:
        baseVersionId:
          type: string
          format: uuid
        tocTree:
          type: array
          minItems: 1
          description: 중첩 깊이는 6단계까지 허용한다 (초과 시 422 PLAN-422-002).
          items:
            $ref: '#/components/schemas/TocTreeNodeInput'
        confirm:
          type: boolean
          default: false
    ContentGenerationRequest:
      type: object
      required:
      - contextSnapshotId
      - tocVersionId
      properties:
        contextSnapshotId:
          type: string
          format: uuid
          description: 계획서의 현재 확정 PlanContextSnapshot id. 다른 값이면 400 PLAN-4001,
            확정 스냅샷이 없으면 412 PLAN-412-001.
        tocVersionId:
          type: string
          format: uuid
          description: 본문 생성의 기준이 되는 확정(CONFIRMED) 목차 버전 id. 계획서에 속하지
            않거나 없으면 404 TOC-404-001, 미확정이면 412 PLAN-412-002.
        targetNodeKeys:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          description: 범위 지정 재생성. 지정하면 해당 노드의 subtree만 재생성하고 나머지 블록은
            보존한다. 미지정이면 목차 전체를 생성한다(빈 배열은 400 PLAN-4001 —
            "전체"는 필드 생략으로 표현한다). 목차 버전에 없는 nodeKey는
            422 PLAN-422-002.
        protectedBlockIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 현재(supersede되지 않은) generated_block id 목록. 지정 시 해당 블록은
            protection_state=USER_LOCKED로 영속 기록되어 이후 모든 재생성에서 보호된다
            (범위 지정 재생성 여부와 무관). 알 수 없는 id는 422 PLAN-422-002.
    # ===== UNE-DOC-001~004: 3단 업로드와 HWPX 반입 (CC-170, ADR-32) =============
    # `storageKey`는 어느 응답에도 넣지 않는다. 테넌트 경로가 드러나면 저장소
    # 레이아웃이 공개 계약의 일부가 되고, 클라이언트가 API를 우회해 객체를
    # 직접 가리키기 시작한다. 바이트로 가는 길은 발급받은 티켓뿐이다.
    FileUploadPurpose:
      type: string
      enum:
      - HWPX_IMPORT
      - KNOWLEDGE_DOCUMENT
      - ATTACHMENT
      description: |-
        용도. 허용 MIME·크기 상한이 여기서 갈린다. CC-170이 실제로 처리하는 것은
        HWPX_IMPORT 하나이며 나머지는 각 항목(CC-220 등)에서 열린다 — 지금 보내면
        422 FILE-422-001이다. 어휘를 미리 두는 이유는 용도별 상한이 나중에 생기는
        분기가 아니라 처음부터 있어야 하는 축이기 때문이다.
    FileUploadState:
      type: string
      enum:
      - PENDING
      - VERIFIED
      - ABORTED
      description: |-
        사전등록(PENDING) → UNE-DOC-002 검증 성공(VERIFIED) 또는 실패(ABORTED).
        전송 완료를 별도 상태로 두지 않는다 — 검증하지 않은 "올라옴"은 이후 어떤
        결정의 근거도 되지 못하므로 도달 가능한 상태를 늘리기만 한다.
    FileScanStatus:
      type: string
      enum:
      - PENDING
      - CLEAN
      - INFECTED
      description: |-
        악성코드 검사 상태. **AV 스캐너가 없으므로 현재 구현은 항상 PENDING이다**
        (OB-15). 검증을 통과한 파일도 "검사되지 않음"이 사실이며, 여기를 CLEAN으로
        올리면 감사 기록이 하지 않은 검사를 했다고 말한다.
    FileObjectResource:
      type: object
      required:
      - fileId
      - originalName
      - mimeType
      - sizeBytes
      - sha256
      - uploadState
      - scanStatus
      - createdBy
      - createdAt
      properties:
        fileId:
          type: string
          format: uuid
        originalName:
          type: string
          maxLength: 500
        mimeType:
          type: string
          maxLength: 150
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: PENDING에서는 클라이언트의 **선언값**, VERIFIED에서는 저장 바이트에서 재계산한 값이다.
        uploadState:
          $ref: '#/components/schemas/FileUploadState'
        scanStatus:
          $ref: '#/components/schemas/FileScanStatus'
        verifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    FileUploadTicket:
      type: object
      required:
      - url
      - method
      - headers
      - expiresAt
      - maxSizeBytes
      - driver
      properties:
        url:
          type: string
          description: 바이트를 그대로 PUT할 절대 URL. 서명이나 티켓이 쿼리에 실린다.
        method:
          type: string
          enum:
          - PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: 전송 시 그대로 붙여야 하는 헤더. 서명 대상이므로 임의로 더하거나 빼면 실패한다.
        expiresAt:
          type: string
          format: date-time
        maxSizeBytes:
          type: integer
          format: int64
        driver:
          type: string
          enum:
          - PRESIGNED_S3
          - API_DIRECT
          description: |-
            진단·증거용이다. **클라이언트는 이 값으로 분기하지 않는다** — 그래야
            로컬(인메모리)과 MinIO/S3가 같은 화면 코드로 동작한다.
    FileRegistrationResource:
      type: object
      required:
      - file
      - upload
      properties:
        file:
          $ref: '#/components/schemas/FileObjectResource'
        upload:
          $ref: '#/components/schemas/FileUploadTicket'
    FileRegisterRequest:
      type: object
      additionalProperties: false
      required:
      - fileName
      - sizeBytes
      - mimeType
      - sha256
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 500
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        mimeType:
          type: string
          minLength: 1
          maxLength: 150
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        purpose:
          $ref: '#/components/schemas/FileUploadPurpose'
    FileCompleteRequest:
      type: object
      additionalProperties: false
      properties:
        etag:
          type: string
          maxLength: 200
          description: |-
            전송 계층이 돌려준 ETag. **참고 기록일 뿐 무결성 근거가 아니다** —
            멀티파트 업로드의 ETag는 MD5가 아니고 드라이버마다 다르다. 근거는
            서버가 저장 바이트에서 다시 계산한 SHA-256이다.
    FileRegistrationResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/FileRegistrationResource'
        meta:
          $ref: '#/components/schemas/Meta'
    FileObjectResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/FileObjectResource'
        meta:
          $ref: '#/components/schemas/Meta'
    # 설계 07 §1.5~§1.7 TemplateProfile의 **요약**이다. 전체 형태의 정본은
    # contracts/schemas/template-profile.schema.json이며 화면·감사가 반복해서
    # 보는 값만 여기서 1급으로 꺼낸다.
    DocumentAnalysisSummary:
      type: object
      required:
      - templateProfileId
      - profileVersion
      - verdict
      - confidence
      - objectCounts
      - prototypeCount
      - unsupportedObjectCount
      - warnings
      - analysisHash
      properties:
        templateProfileId:
          type: string
          format: uuid
        profileVersion:
          type: integer
          minimum: 1
        verdict:
          type: string
          enum:
          - AUTO
          - CONFIRM
          - LIMITED
          - REJECT
          description: |-
            문서 단위 판정(ADR v1.1 §8.6 G15-1, 롤업 규칙은 ADR-29 D2).
            `template_profile.analysis_status`에 그대로 저장된다 — ADR-31 D12가
            이 컬럼을 판정 축으로 확정했으므로 변환하지 않는다.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        objectCounts:
          type: object
          additionalProperties: false
          required:
          - NATIVE_EDIT
          - PRESERVE_ONLY
          - FLATTEN_EXPORT_ONLY
          - REJECT
          properties:
            NATIVE_EDIT:
              type: integer
              minimum: 0
            PRESERVE_ONLY:
              type: integer
              minimum: 0
            FLATTEN_EXPORT_ONLY:
              type: integer
              minimum: 0
            REJECT:
              type: integer
              minimum: 0
        prototypeCount:
          type: integer
          minimum: 0
        unsupportedObjectCount:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
        analysisHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        elapsedMs:
          type: integer
          minimum: 0
          description: 분석 소요 시간. 성능 기준선(ADR G15-5) 관측점이다.
    ImportedDocumentResource:
      type: object
      required:
      - documentId
      - title
      - documentType
      - status
      - sourceFileId
      - revisionId
      - revisionNo
      - irHash
      - analysis
      properties:
        documentId:
          type: string
          format: uuid
        planId:
          type:
          - string
          - 'null'
          format: uuid
        title:
          type: string
          maxLength: 300
        documentType:
          type: string
          enum:
          - PLAN
          - JOURNAL
        status:
          type: string
          enum:
          - EDITING
          - REVIEW
          - APPROVED
        sourceFileId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        irHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        analysis:
          $ref: '#/components/schemas/DocumentAnalysisSummary'
    HwpImportResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ImportedDocumentResource'
        meta:
          $ref: '#/components/schemas/Meta'
    DocumentAnalysisResource:
      type: object
      required:
      - documentId
      - analysis
      - unsupportedObjects
      - profile
      - createdAt
      properties:
        documentId:
          type: string
          format: uuid
        analysis:
          $ref: '#/components/schemas/DocumentAnalysisSummary'
        unsupportedObjects:
          type: array
          description: NATIVE_EDIT가 아닌 객체의 분류 결과. 어떤 객체가 저장을 차단하는지의 근거다(ADR-29 D4, ADR-31 D7).
          items:
            type: object
            additionalProperties: true
            required:
            - objectClass
            - elementName
            properties:
              objectClass:
                type: string
                enum:
                - PRESERVE_ONLY
                - FLATTEN_EXPORT_ONLY
                - REJECT
              elementName:
                type: string
              locator:
                type: string
              reason:
                type: string
        profile:
          type: object
          additionalProperties: true
          description: |-
            TemplateProfile 전문. 정본 스키마는
            `contracts/schemas/template-profile.schema.json`이며 여기서는 통과시킨다.
        createdAt:
          type: string
          format: date-time
    DocumentAnalysisResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/DocumentAnalysisResource'
        meta:
          $ref: '#/components/schemas/Meta'
    HwpImportRequest:
      type: object
      additionalProperties: false
      required:
      - fileId
      properties:
        fileId:
          type: string
          format: uuid
          description: UNE-DOC-002를 통과한(uploadState=VERIFIED) 파일이어야 한다.
        planId:
          type: string
          format: uuid
          nullable: true
          description: 주면 plan.document_id에 이 문서가 기록된다(ADR-32 D9). 이미 문서를 가진 계획서는 409, 다른 테넌트·삭제된 계획서는 404다.
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: 생략하면 원본 파일명을 쓴다.
    # 전체 형태는 contracts/schemas/change-set.schema.json이 정본이다(SelectionEnvelope
    # 5종 · 8종 연산 · materialize 소스 변형). 여기에는 OpenAPI 소비자가 필요로 하는
    # 최소 형태만 두고, 연산 내부는 그 스키마를 참조한다 — 같은 어휘를 두 벌로 적으면
    # 반드시 갈라진다(packages/domain의 CHANGE_OPERATION_TYPES가 런타임 정본).
    ChangeSetRequest:
      type: object
      required:
      - baseRevisionId
      - origin
      - clientMutationId
      description: |-
        일반 편집은 `operations`가 필수다. **Undo/Redo는 반대로 `operations`를 싣지
        않는다** — `undoesChangeSetId`로 되돌릴 ChangeSet만 지목하면 서버가 저장해 둔
        역연산을 쓴다(ADR-30 D6 보정). 역연산은 원본 블록 IR을 통째로 나르므로, 요청
        표면에서 받으면 클라이언트가 origin:'SOURCE'·위조 앵커·locked 노드를 문서에
        직접 심을 수 있다.
      allOf:
      - if:
          required:
          - undoesChangeSetId
        then:
          properties:
            origin:
              enum:
              - UNDO
              - REDO
          not:
            required:
            - operations
        else:
          required:
          - operations
      properties:
        baseRevisionId:
          type: string
          format: uuid
          description: If-Match가 가리키는 Revision과 같아야 한다(다르면 422 DOC-422-004).
        origin:
          $ref: '#/components/schemas/ChangeSetOrigin'
        operations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ChangeOperation'
        clientMutationId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,100}$'
          description: 문서 범위 멱등 앵커(uk_change_set_mutation).
        dryRun:
          type: boolean
          default: false
          description: 검증·Diff만 수행하고 리비전을 만들지 않는다.
        undoesChangeSetId:
          type: string
          format: uuid
          description: |-
            되돌릴 ChangeSet(change_set.undoes_change_set_id). 이 값을 실으면 origin은
            UNDO 또는 REDO여야 하고 operations를 실을 수 없다. 대상 이후 같은 노드를
            건드린 ChangeSet이 있으면 422 DOC-422-004(UNDO_CONFLICT)다.
        checkpointLabel:
          type: string
          maxLength: 100
        changeSummary:
          type: string
          maxLength: 2000
    ChangeSetOrigin:
      type: string
      enum:
      - USER
      - AI
      - AUTOSAVE
      - UNDO
      - REDO
      - RESTORE
      - MATERIALIZE
    ChangeOperationType:
      type: string
      description: 설계 07 §1.9가 고정한 8종. ADR 없이 늘어나지 않는다(ck_change_operation_type).
      enum:
      - INSERT_BLOCKS
      - REPLACE_RANGE
      - DELETE_RANGE
      - SPLIT_PARAGRAPH
      - MERGE_PARAGRAPHS
      - MOVE_BLOCK
      - APPLY_STYLE_ROLE
      - TABLE_PATCH
    TextPosition:
      type: object
      required:
      - paragraphId
      - offset
      properties:
        paragraphId:
          type: string
          minLength: 1
        offset:
          type: integer
          minimum: 0
          description: 문단 run 텍스트를 이은 문자열에 대한 UTF-16 코드 단위 인덱스(§1.8).
    SelectionEnvelope:
      type: object
      description: 화면좌표와 원시 XML 앵커를 담는 필드가 없다(§1.8-4). 종류별 필수 항목은
        contracts/schemas/change-set.schema.json이 oneOf로 닫는다.
      required:
      - kind
      - baseRevisionId
      properties:
        kind:
          type: string
          enum:
          - CURSOR
          - TEXT_RANGE
          - BLOCK
          - SECTION
          - TABLE_CELL
        baseRevisionId:
          type: string
          format: uuid
        at:
          $ref: '#/components/schemas/TextPosition'
        start:
          $ref: '#/components/schemas/TextPosition'
        end:
          $ref: '#/components/schemas/TextPosition'
        blockIds:
          type: array
          items:
            type: string
        sectionId:
          type: string
        tableId:
          type: string
        cellId:
          type: string
    BlockAnchor:
      type: object
      required:
      - relation
      - ref
      properties:
        relation:
          type: string
          enum:
          - BEFORE
          - AFTER
          - FIRST_CHILD
          - LAST_CHILD
        ref:
          type: string
          description: 기준 노드의 안정 ID(원시 XML 앵커가 아니다).
    InsertSource:
      type: object
      description: INSERT_BLOCKS의 블록 출처. GENERATED_BLOCKS가 materialize 경로이며
        서버가 3중 방어(현재 목차버전 일치, superseded_at IS NULL, 보호 블록 제외)를 건다.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - INLINE
          - PROTOTYPE
          - GENERATED_BLOCKS
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        prototypeId:
          type: string
        count:
          type: integer
          minimum: 1
        planId:
          type: string
          format: uuid
        tocVersionId:
          type: string
          format: uuid
    ChangeOperation:
      type: object
      required:
      - type
      - order
      properties:
        type:
          $ref: '#/components/schemas/ChangeOperationType'
        order:
          type: integer
          minimum: 0
          description: ChangeSet 안에서 유일해야 한다(uk_change_operation_order).
        selection:
          $ref: '#/components/schemas/SelectionEnvelope'
        anchor:
          $ref: '#/components/schemas/BlockAnchor'
        source:
          $ref: '#/components/schemas/InsertSource'
        payload:
          type: object
          additionalProperties: true
    DiffEntry:
      type: object
      required:
      - kind
      - nodeId
      properties:
        kind:
          type: string
          enum:
          - ADDED
          - REMOVED
          - MODIFIED
          - MOVED
        nodeId:
          type: string
        preview:
          type: string
          description: 짧은 텍스트 미리보기. 본문이므로 로그·목록에는 싣지 않는다.
    NodeAlias:
      type: object
      required:
      - from
      - to
      - offsetDelta
      properties:
        from:
          type: string
        to:
          type: string
        offsetDelta:
          type: integer
          description: MERGE는 오른쪽 문단의 모든 오프셋을 왼쪽 길이만큼 민다. 이 값이
            없으면 재조회가 노드는 맞히고 문자 위치는 틀린다.
    MaterializeReport:
      type: object
      required:
      - planId
      - tocVersionId
      - candidateBlocks
      - insertedBlocks
      - excluded
      properties:
        planId:
          type: string
          format: uuid
        tocVersionId:
          type: string
          format: uuid
        candidateBlocks:
          type: integer
        insertedBlocks:
          type: integer
        excluded:
          type: array
          description: 제외된 블록과 사유. 조용히 빠지면 사용자는 문서가 왜 비었는지 모른다.
          items:
            type: object
            required:
            - blockId
            - nodeKey
            - reason
            properties:
              blockId:
                type: string
                format: uuid
              nodeKey:
                type: string
              reason:
                type: string
    ChangeSetResult:
      type: object
      required:
      - changeSetId
      - documentId
      - baseRevisionId
      - dryRun
      - applied
      - replayed
      - newRevisionId
      - newRevisionNo
      - irHash
      - diff
      - inverseOperations
      - aliases
      - aliasRemovals
      - warnings
      - materialize
      properties:
        changeSetId:
          type: string
          format: uuid
          nullable: true
          description: dryRun이면 null(아무 행도 쓰지 않았다).
        documentId:
          type: string
          format: uuid
        baseRevisionId:
          type: string
          format: uuid
        dryRun:
          type: boolean
        applied:
          type: boolean
        replayed:
          type: boolean
          description: 같은 clientMutationId 재전송으로 원래 결과를 돌려준 경우 true.
        newRevisionId:
          type: string
          format: uuid
          nullable: true
        newRevisionNo:
          type: integer
          nullable: true
        irHash:
          type: string
        diff:
          type: array
          items:
            $ref: '#/components/schemas/DiffEntry'
        inverseOperations:
          type: array
          description: Undo가 재유도가 아니라 자료 조회가 되도록 저장된 역연산(ADR-30 D6).
          items:
            $ref: '#/components/schemas/ChangeOperation'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/NodeAlias'
        aliasRemovals:
          type: array
          description: 이번 ChangeSet이 무효화한 alias(MERGE 되돌림으로 되살아난 문단).
          items:
            $ref: '#/components/schemas/NodeAlias'
        warnings:
          type: array
          items:
            type: string
        materialize:
          oneOf:
          - $ref: '#/components/schemas/MaterializeReport'
          - type: 'null'
    ChangeSetResultResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ChangeSetResult'
        meta:
          $ref: '#/components/schemas/Meta'
    DocumentIrResource:
      type: object
      required:
      - documentId
      - revisionId
      - revisionNo
      - irHash
      - origin
      - checkpointLabel
      - headRevisionId
      - headRevisionNo
      - irVersion
      - liftedFromV1
      - ir
      - createdBy
      - createdAt
      properties:
        documentId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
        irHash:
          type: string
        origin:
          $ref: '#/components/schemas/RevisionOrigin'
        checkpointLabel:
          type: string
          nullable: true
        headRevisionId:
          type: string
          format: uuid
        headRevisionNo:
          type: integer
        irVersion:
          type: string
          enum:
          - '1'
          - '2'
        liftedFromV1:
          type: boolean
          description: 저장된 ir_json이 v1이라 읽기 시 v2로 승격했는가(ADR-30 D3).
        ir:
          type: object
          description: contracts/schemas/document-ir.schema.json이 정본이다.
          additionalProperties: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    DocumentIrResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/DocumentIrResource'
        meta:
          $ref: '#/components/schemas/Meta'
    RevisionOrigin:
      type: string
      description: 리비전이 어떤 기제로 만들어졌는가(ck_document_revision_origin).
        ChangeSet의 출처(누가 요청했나)와 축이 다르다 — USER/AI 편집은 둘 다 CHANGESET이다.
        PROJECTION은 확정 판·사실원장에서 접은 상황일지 첫 판이다(CC-300, 0043).
      enum:
      - IMPORT
      - MATERIALIZE
      - PROJECTION
      - CHANGESET
      - AUTOSAVE
      - UNDO
      - REDO
      - RESTORE
    RevisionResource:
      type: object
      required:
      - revisionId
      - documentId
      - revisionNo
      - parentRevisionId
      - irHash
      - changeSummary
      - origin
      - checkpointLabel
      - isHead
      - createdBy
      - createdAt
      properties:
        revisionId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        parentRevisionId:
          type: string
          format: uuid
          nullable: true
        irHash:
          type: string
        changeSummary:
          type: string
          nullable: true
        origin:
          $ref: '#/components/schemas/RevisionOrigin'
        checkpointLabel:
          type: string
          nullable: true
          description: 자동/수동 checkpoint 라벨. 어휘가 정본에서 닫혀 있지 않아 enum이 아니다.
        isHead:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    RevisionPageResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - page
          - size
          - totalElements
          - totalPages
          - headRevisionId
          - headRevisionNo
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RevisionResource'
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
            headRevisionId:
              type: string
              format: uuid
              nullable: true
            headRevisionNo:
              type: integer
              nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
    RevisionRestoreRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        checkpointLabel:
          type: string
          maxLength: 100
    RevisionRestoreResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - revision
          - changeSetId
          - restoredFromRevisionId
          - restoredFromRevisionNo
          properties:
            revision:
              $ref: '#/components/schemas/RevisionResource'
            changeSetId:
              type: string
              format: uuid
            restoredFromRevisionId:
              type: string
              format: uuid
            restoredFromRevisionNo:
              type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    AutosaveRequest:
      type: object
      required:
      - baseRevisionId
      - delta
      - clientMutationId
      properties:
        baseRevisionId:
          type: string
          format: uuid
        delta:
          type: object
          required:
          - operations
          properties:
            operations:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ChangeOperation'
        clientMutationId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,100}$'
        seq:
          type: integer
          minimum: 0
          description: 클라이언트 큐 순번. 생략하면 서버가 문서별 다음 값을 쓴다.
            하한이 0인 이유는 0-based/1-based를 정하는 정본이 없기 때문이다(0019 §6).
    AutosaveReceipt:
      type: object
      required:
      - autosaveId
      - documentId
      - clientMutationId
      - seq
      - status
      - baseRevisionId
      - resultRevisionId
      - resultRevisionNo
      - irHash
      - replayed
      - receivedAt
      properties:
        autosaveId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        clientMutationId:
          type: string
        seq:
          type: string
          description: bigint이므로 문자열로 나간다(정밀도 보존).
        status:
          type: string
          enum:
          - ACCEPTED
          - CONFLICT
          - SUPERSEDED
        baseRevisionId:
          type: string
          format: uuid
        resultRevisionId:
          type: string
          format: uuid
          nullable: true
        resultRevisionNo:
          type: integer
          nullable: true
        irHash:
          type: string
          nullable: true
        replayed:
          type: boolean
        receivedAt:
          type: string
          format: date-time
    AutosaveReceiptResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AutosaveReceipt'
        meta:
          $ref: '#/components/schemas/Meta'
    RevisionConflictEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
        meta:
          # allOf를 쓰되 어느 브랜치에도 additionalProperties:false를 두지 않는다.
          # 2020-12에서 그 조합은 형제 브랜치의 property를 보지 못해 모든 인스턴스를
          # 무효로 만든다(ADR-24 D4). meta는 원래 열린 객체이므로 제약이 필요 없다.
          allOf:
          - $ref: '#/components/schemas/Meta'
          - type: object
            required:
            - conflict
            properties:
              conflict:
                description: 복구 정보. 이것이 없는 409는 클라이언트가 쓸 수 없다 —
                  최신 Revision을 다시 조회할 좌표가 응답 안에 있어야 한다.
                type: object
                required:
                - currentRevisionId
                - currentRevisionNo
                - headIrHash
                properties:
                  currentRevisionId:
                    type: string
                    format: uuid
                  currentRevisionNo:
                    type: integer
                  headIrHash:
                    type: string
    # CC-160/ADR-31: enum에 있던 JSON을 제거했다. 설계 10 §6의 export_job.format
    # 어휘는 HWPX/PDF/DOCX이고, 정본 우선순위상 설계(3)가 OpenAPI(4)보다 앞선다.
    # PDF/DOCX는 어휘에는 있으나 변환기가 없어 서비스가 422로 거부한다 —
    # 계약에서 지우지 않는 이유는 DB 어휘와 어긋나게 만들지 않기 위해서다.
    ExportRequest:
      type: object
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - HWPX
          - PDF
          - DOCX
        revisionId:
          type: string
          format: uuid
          nullable: true
        # ADR-31 D14: 저장 모드(설계 07 §1.10)는 CC-160이 SAVE_AS 하나만
        # 산출한다. 받아서 버리는 필드를 두면 클라이언트가 SAVE_REVISION을
        # 보내고 조용히 SAVE_AS로 처리되므로, 지금은 계약에서 닫고 요청에
        # 오면 EXPORT-422-001로 거부한다. 모드를 실제로 지원하는 시점에
        # export_job.save_mode와 함께 연다.
    # CC-200/ADR-33 D17: 이 스키마는 세 곳에서 구현과 어긋나 있었다 —
    # ① 클라이언트가 실제로 쓰는 `locationText`가 없었다(응답 `Situation`은
    #    그 이름을 쓴다), ② `additionalProperties`가 열려 있어 계약이 허용하는
    #    요청을 구현이 400으로 막았다, ③ 이 문서는 3.1인데 `nullable: true`는
    #    3.0 문법이라 2020-12에서 무시된다 — `occurredAt: null`이 스키마
    #    위반인데 구현은 허용했다. 셋을 한 번에 닫는다.
    SituationCreateRequest:
      type: object
      required:
      - mode
      - title
      - hazardType
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/SituationMode'
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
          maxLength: 50
        occurredAt:
          type:
          - string
          - 'null'
          format: date-time
        locationText:
          type:
          - string
          - 'null'
          maxLength: 500
        location:
          type:
          - string
          - 'null'
          maxLength: 500
          deprecated: true
          description: >-
            설계 10 SIT 표의 요청 요약이 쓴 이름. `locationText`와 같은 컬럼
            (`situation.location_text`)이며 둘 다 오면 `locationText`가 이긴다.
            신규 클라이언트는 `locationText`를 쓸 것.
    ProviderQueryRequest:
      type: object
      required:
      - providers
      - query
      additionalProperties: false
      properties:
        providers:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - KMA
            - MOIS
            - SAFEKOREA
            - NAVER
            - T3Q
        query:
          type: object
          description: >-
            Provider별 해석이 다른 조회조건. 도메인은 들여다보지 않고 어댑터에
            전달만 한다(예: `adminCode`).
        categories:
          type: array
          description: 조회할 Fact 범주(설계 01 §20.5). 생략·빈 배열이면 제한 없음.
          items:
            $ref: '#/components/schemas/SituationFactType'
        featureFlags:
          type: object
          description: >-
            보조 Provider 활성화(설계 10 SIT-005 "핵심 요청: providers,query,
            featureFlags"). 기본값은 전부 false다 — SafeKorea/Naver는 법적·운영
            승인 전(OB-05)이고 T3Q 상황 API는 승인된 계약이 없다(OB-02).
            켜도 어댑터가 없으면 NOT_CONTRACTED로 답하지 성공한 척하지 않는다.
          properties:
            safekorea:
              type: boolean
            naver:
              type: boolean
            t3q:
              type: boolean
        requestReason:
          type:
          - string
          - 'null'
          maxLength: 500
        from:
          type:
          - string
          - 'null'
          format: date-time
        to:
          type:
          - string
          - 'null'
          format: date-time
    # UNE-SIT-004. GenericRequest(무엇이든 통과)를 전용 스키마로 바꾼다.
    # 상태는 여기서 바꾸지 않는다 — 상태 전이는 명시적 도메인 경로를 지난다
    # (.claude/rules/architecture.md).
    SituationPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
          maxLength: 50
        occurredAt:
          type:
          - string
          - 'null'
          format: date-time
        locationText:
          type:
          - string
          - 'null'
          maxLength: 500
    # UNE-SIT-007 수동 Fact 등록. 설계 10의 "핵심 요청: factType,key,value,
    # source,observedAt"을 그대로 옮겼다.
    SituationFactCreateRequest:
      type: object
      required:
      - factType
      - factKey
      - value
      additionalProperties: false
      properties:
        factType:
          $ref: '#/components/schemas/SituationFactType'
        factKey:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,99}$'
        value: {}
        unit:
          type:
          - string
          - 'null'
          maxLength: 30
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 명시적 오프셋이 필요하다. 오프셋이 없으면 422로 거부한다.
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        source:
          type: object
          description: >-
            사용자 입력의 출처. providerCode는 MANUAL로 고정되고 sourceType은
            USER다 — 사용자가 공식 Provider를 사칭할 수 없다.
          properties:
            sourceName:
              type: string
              maxLength: 300
            sourceUrl:
              type:
              - string
              - 'null'
    # UNE-SIT-008 후보 Fact 보정. 원천 Fact는 불변이므로(설계 06 §7.1 주요
    # 데이터 "원천 Fact 불변") 보정은 값·단위·관측시각·신뢰도에 한한다.
    # factType/factKey를 바꾸면 다른 사실이 되지 보정이 아니다.
    SituationFactPatchRequest:
      type: object
      required:
      - reason
      minProperties: 2
      additionalProperties: false
      properties:
        value: {}
        unit:
          type:
          - string
          - 'null'
          maxLength: 30
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            보정 사유. **필수다** — CC-210부터 보정은 파생 Fact를 만들고
            (설계 06 US-SIT-007 #3) 파생은 actor·사유 없이 만들 수 없다
            (0025 §2 ck_situation_fact_derivation_shape).
    # CC-210/ADR-34 D6: `conflictResolutionIds`를 뺐다. 해소는 UNE-SIT-011이
    # 이미 저장하고 확정은 **OPEN 충돌의 유무**만 본다 — 받아서 버리면
    # 클라이언트가 보낸 값이 조용히 무시되므로 계약에서도 닫는다.
    SituationSnapshotCreateRequest:
      type: object
      required:
      - factIds
      - effectiveAt
      - expectedSnapshotId
      additionalProperties: false
      properties:
        expectedSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
          description: >-
            요청자가 보고 있던 **직전 확정 판**. 첫 확정이면 `null`을 명시한다.
            현재 `situation.current_snapshot_id`와 다르면 409 `SIT-409-004`다 —
            그 사이의 확정을 보지 못했다는 뜻이므로 최신 판을 검토한 뒤 다시
            확정해야 한다(설계 06 US-SIT-008 E-01 REVISION_CONFLICT, ADR-34 D17).
            **생략할 수 없다** — 생략을 허용하면 가드가 우회된다.
        factIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        effectiveAt:
          type: string
          format: date-time
        reason:
          type:
          - string
          - 'null'
          maxLength: 1000
    DeduplicateRequest:
      type: object
      additionalProperties: false
      properties:
        strategy:
          $ref: '#/components/schemas/DuplicateStrategy'
        threshold:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
          description: 지금 두 전략은 쓰지 않지만 값을 버리지 않고 그대로 기록한다.
        timeWindowMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: KEY_TIME_WINDOW의 창(분). 기본 60.
    ConflictResolveRequest:
      type: object
      required:
      - selectedFactId
      - reason
      additionalProperties: false
      properties:
        selectedFactId:
          type: string
          format: uuid
          description: 이 충돌의 후보 중 하나여야 한다. 그 밖은 422다.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 설계 06 US-SIT-007 완료조건("모든 선택에 actor/time/source 추적").
    KnowledgeDocumentCreateRequest:
      type: object
      required:
      - fileId
      - documentType
      additionalProperties: false
      properties:
        fileId:
          type: string
          format: uuid
          description: UNE-DOC-002 업로드 검증을 통과한 file_object. 검증 전 파일은 KNOW-422-001.
        documentType:
          type: string
          enum: [MANUAL, TRAINING_PLAN, EVALUATION_GUIDE, MESSAGE_LIST, MISSION_CARD]
        retentionScope:
          type: string
          enum: [THIS_INCIDENT, PROJECT, ORG_KB]
          default: THIS_INCIDENT
          description: >-
            보존범위(설계 06 US-SIT-009). ORG_KB는 등록 시점에 지정할 수 없다 —
            5단계가 기관 KB 자동승격을 금지하고 A-02가 별도 승인 워크플로를 요구한다.
            지정하면 KNOW-422-002.
        force:
          type: boolean
          default: false
          description: >-
            같은 해시의 자료가 이미 있어도 새로 등록한다(US-SIT-009 A-01).
            false이면 중복 시 KNOW-409-001로 기존 자료를 알려주고 사용자가 고른다.
        metadata:
          type: object
          additionalProperties: true
    KnowledgeDocumentResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/KnowledgeDocument'
        meta:
          type: object
    KnowledgeDocumentRetryRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 재시도 사유. 감사 기록의 핵심이므로 필수다.
    KnowledgeDocument:
      type: object
      description: >-
        지식문서. **상태가 두 축이다** — `status`는 UNE가 아는 사실(파일을 검증했고
        UNI에 보냈다), `uniStatus`는 UNI가 알려준 사실(파싱·색인·참조생성이 어디까지
        갔다)이다. 설계 06이 US-SIT-009와 US-SIT-010에 서로 다른 상태전이를 적었고,
        한 컬럼에 합치면 UNI가 응답하지 않을 때 무엇이 참인지 말할 수 없다.
      required:
      - knowledgeDocumentId
      - fileId
      - documentType
      - retentionScope
      - status
      - uniStatus
      - evidenceEligible
      - searchable
      - attemptCount
      - createdBy
      - createdAt
      - updatedAt
      properties:
        knowledgeDocumentId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
          nullable: true
        fileId:
          type: string
          format: uuid
        documentType:
          type: string
          enum: [MANUAL, TRAINING_PLAN, EVALUATION_GUIDE, MESSAGE_LIST, MISSION_CARD]
        retentionScope:
          type: string
          enum: [THIS_INCIDENT, PROJECT, ORG_KB]
        status:
          type: string
          enum: [PENDING_UPLOAD, UPLOADING, REGISTERED, FAILED, CANCELLED]
          description: UNE 등록 축 (설계 06 US-SIT-009 상태전이).
        uniStatus:
          type: string
          enum: [QUEUED, PARSING, INDEXING, REFERENCE_GENERATING, READY, ERROR]
          nullable: true
          description: >-
            UNI 처리 축 (설계 08 §1.9 어휘). **null은 "아직 모른다"이지 "처리되지
            않았다"가 아니다** — UNI가 doc_id를 돌려주기 전까지 null이다.
        uniObservedAt:
          type: string
          format: date-time
          nullable: true
          description: uniStatus를 마지막으로 관측한 시각. 이 API는 UNI를 호출하지 않는다.
        providerDocumentId:
          type: string
          nullable: true
          description: UNI doc_id. REGISTERED이면 반드시 있다.
        evidenceEligible:
          type: boolean
          description: >-
            SOP 근거로 쓸 수 있는가. status=REGISTERED이고 uniStatus=READY일 때만 참이다
            (US-SIT-010 완료조건 "READY 아닌 자료가 Evidence에 포함된 건 0").
        searchable:
          type: boolean
          description: >-
            참조요약 없이도 검색 가능한가 (US-SIT-010 A-01 READY_WITHOUT_REFERENCE).
            REFERENCE_GENERATING에서도 참이며 evidenceEligible과 갈린다.
        sourceSha256:
          type: string
          nullable: true
        attemptCount:
          type: integer
          minimum: 0
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: object
          nullable: true
          additionalProperties: true
        reference:
          type: object
          nullable: true
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EvidenceSearchRequest:
      type: object
      required:
      - snapshotId
      - query
      additionalProperties: false
      properties:
        snapshotId:
          type: string
          format: uuid
          description: >-
            근거를 모을 기준 판. **요청이 명시한다** — 생략을 허용하면 서버가
            "지금 최신"으로 채우게 되고 사용자가 본 판과 달라질 수 있다.
            EvidenceSet은 동결되므로 그 어긋남이 그대로 굳는다(ADR-34 D17과 같은 이유).
            현재 판이 아니면 409 EVID-409-002.
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            검색어. 서버가 개인정보를 줄인 뒤 UNI로 보내고 줄인 값을 저장한다
            (US-SIT-011 1단계). 완전한 익명화는 아니다(ADR-37 수용 한계).
        filters:
          type: object
          additionalProperties: true
        topK:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
          description: 설계 06 US-SIT-011 2단계의 기본값 8.
    EvidenceLockRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 동결은 되돌릴 수 없으므로 사유가 감사의 핵심이다.
    EvidenceItem:
      type: object
      required:
      - evidenceItemId
      - knowledgeDocumentId
      - rankNo
      - quote
      - citationKey
      - isSelected
      properties:
        evidenceItemId:
          type: string
          format: uuid
        knowledgeDocumentId:
          type: string
          format: uuid
          description: 우리가 올린 문서만 가리킨다. UNI가 모르는 문서를 주면 버린다(US-SIT-011 E-02).
        providerChunkId:
          type: string
          nullable: true
        rankNo:
          type: integer
          minimum: 1
        score:
          type: number
          nullable: true
          description: >-
            UNI가 준 점수. **척도가 미확인이라 정규화하지 않는다**(OB-13).
            동결 해시에도 넣지 않는다 — 재현되지 않는 값이면 내용이 같은 두
            EvidenceSet의 해시가 달라진다.
        quote:
          type: string
          minLength: 1
        sourceLocator:
          type: object
          additionalProperties: true
        citationKey:
          type: string
        isSelected:
          type: boolean
          description: 제외한 후보도 행은 남는다(US-SIT-011 4단계). 제외에는 사유가 필요하다.
        excludedReason:
          type: string
          nullable: true
    EvidenceSet:
      type: object
      description: >-
        생성 시점에 동결되는 근거 묶음. 상태는 DRAFT/FROZEN 둘뿐이다 —
        US-SIT-011이 말하는 SEARCHING·RESULTS_READY 등은 **화면이 지금 무엇을
        하는가**이지 저장할 사실이 아니다(ADR-37 D1). FROZEN 이후에는 집합도
        항목도 바뀌지 않는다(0031 트리거).
      required:
      - evidenceSetId
      - situationId
      - snapshotId
      - query
      - topK
      - status
      - contentHash
      - rejectedChunkCount
      - items
      - createdBy
      - createdAt
      - updatedAt
      properties:
        evidenceSetId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        query:
          type: string
        filters:
          type: object
          additionalProperties: true
        topK:
          type: integer
        status:
          type: string
          enum: [DRAFT, FROZEN]
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 동결 대상의 내용 해시. 점수·동결자·시각은 넣지 않는다.
        frozenAt:
          type: string
          format: date-time
          nullable: true
        frozenBy:
          type: string
          format: uuid
          nullable: true
        freezeReason:
          type: string
          nullable: true
        rejectedChunkCount:
          type: integer
          minimum: 0
          description: >-
            UNI가 돌려줬으나 우리 문서가 아니어서 버린 청크 수. 조용히 버리면
            결과가 적은 이유를 설명할 수 없다(US-SIT-011 E-02).
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EvidenceSetResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EvidenceSet'
        meta:
          type: object
    SourceLocator:
      type: object
      required:
      - evidenceItemId
      - knowledgeDocumentId
      - fileName
      - citationKey
      - quote
      properties:
        evidenceItemId:
          type: string
          format: uuid
        knowledgeDocumentId:
          type: string
          format: uuid
        providerDocumentId:
          type: string
        fileName:
          type: string
        providerChunkId:
          type: string
          nullable: true
        citationKey:
          type: string
        quote:
          type: string
        locator:
          type: object
          additionalProperties: true
    SourceLocatorResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SourceLocator'
        meta:
          type: object
    SopGenerationRequest:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - evidenceSetId
      - schemaVersion
      properties:
        snapshotId:
          type: string
          format: uuid
          description: 확정 SituationSnapshot. 상황의 현재 판이어야 한다(아니면 SOP-409-002).
        evidenceSetId:
          type: string
          format: uuid
          description: 동결(FROZEN) EvidenceSet. 같은 상황·같은 판의 것이어야 한다.
        schemaVersion:
          type: string
          description: 'SOP 그래프 스키마 버전. UNI SOP 매퍼 버전(sop_version.schema_version)과
            다른 값이다 — 이쪽은 클라이언트가 원하는 그래프 모양이고 저쪽은 UNI
            응답을 어느 규칙으로 옮겼는지다.'
          enum:
          - '1.0'
    SopPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sop'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    Sop:
      type: object
      additionalProperties: false
      required:
      - sopId
      - title
      - hazardType
      - status
      - createdAt
      properties:
        sopId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
        status:
          type: string
          description: RETIRED는 폐기 경로가 생길 때 연다(0035 §1, 도달 가능한 상태만).
          enum:
          - DRAFT
          - IN_REVIEW
          - APPROVED
        currentVersionId:
          type: string
          format: uuid
          nullable: true
        currentVersionNo:
          type: integer
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    SopVersion:
      type: object
      additionalProperties: false
      required:
      - sopVersionId
      - sopId
      - versionNo
      - status
      - graphHash
      - schemaVersion
      - createdAt
      properties:
        sopVersionId:
          type: string
          format: uuid
        sopId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          type: string
          description: LOCKED는 승인이 만든다. 그 뒤로 그래프까지 불변이다(0035 §3).
          enum:
          - DRAFT
          - LOCKED
        graphHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        schemaVersion:
          type: string
          description: 매퍼 버전. 사람이 만든 버전은 편집기 버전이다.
        sourceSnapshotId:
          type: string
          format: uuid
          nullable: true
        sourceEvidenceSetId:
          type: string
          format: uuid
          nullable: true
        graphViolations:
          type: array
          nullable: true
          items:
            type: string
        adapterId:
          type: string
          nullable: true
        generatedByMock:
          type: boolean
          nullable: true
          description: true면 mock 산출물이다 — provider 지원의 증거가 아니다.
        approvedBy:
          type: string
          format: uuid
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    SopGraphNode:
      type: object
      additionalProperties: false
      required:
      - nodeKey
      - nodeType
      - title
      properties:
        nodeKey:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]{1,79}$
        nodeType:
          type: string
          enum:
          - START
          - ACTION
          - DECISION
          - NOTE
          - END
        title:
          type: string
          maxLength: 300
        tasks:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              instruction:
                type: string
              assigneeHint:
                type: string
                nullable: true
        decisionExpression:
          type: string
          nullable: true
        sourceRefs:
          type: array
          description: UNE knowledge_document_id 목록이다(provider id가 아니다).
          items:
            type: string
            format: uuid
        providerNodeKey:
          type: string
          nullable: true
          description: provider가 준 원래 키. 정규화하지 않았으면 nodeKey와 같다.
        mappingWarnings:
          type: array
          nullable: true
          items:
            type: string
        position:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - x
          - y
          properties:
            x:
              type: number
            y:
              type: number
    SopGraphEdge:
      type: object
      additionalProperties: false
      required:
      - fromNodeKey
      - toNodeKey
      properties:
        fromNodeKey:
          type: string
        toNodeKey:
          type: string
        conditionExpr:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        priority:
          type: integer
          minimum: 0
    SopGraphResource:
      type: object
      additionalProperties: false
      required:
      - sop
      - version
      - nodes
      - edges
      properties:
        sop:
          $ref: '#/components/schemas/Sop'
        version:
          $ref: '#/components/schemas/SopVersion'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SopGraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SopGraphEdge'
    SopVersionSaveRequest:
      type: object
      additionalProperties: false
      required:
      - baseVersionId
      - nodes
      - edges
      properties:
        baseVersionId:
          type: string
          format: uuid
          description: |
            무엇을 고쳐서 만든 버전인가. SOP의 현재 버전과 다르면 409
            (SOP-409-001) — 그 사이 누군가 저장했다는 뜻이므로 덮어쓰지 않는다.
        nodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SopGraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SopGraphEdge'
    SopValidationIssue:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
        nodeKey:
          type: string
          nullable: true
          description: 그래프 전체 문제면 null이다.
        message:
          type: string
    SopValidationReport:
      type: object
      additionalProperties: false
      required:
      - sopVersionId
      - status
      - errors
      - warnings
      - validatorVersion
      - validatedAt
      properties:
        sopVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PASS
          - FAIL
        errors:
          type: array
          description: |
            절차를 실행할 수 없게 만드는 것. 구조 위반 전부와 MISSING_TASK가
            여기 온다 — 임무 없는 실행 노드는 무엇을 할지가 없다.
          items:
            $ref: '#/components/schemas/SopValidationIssue'
        warnings:
          type: array
          description: |
            승인을 막지 않지만 화면에 보여야 하는 것(담당 미지정, 근거 없음,
            범위 밖 근거 등).
          items:
            $ref: '#/components/schemas/SopValidationIssue'
        validatorVersion:
          type: string
        validatedAt:
          type: string
          format: date-time
    SopValidateRequest:
      type: object
      additionalProperties: false
      properties:
        versionId:
          type: string
          format: uuid
          nullable: true
          description: 생략하면 SOP의 현재 버전을 검증한다.
    SopSubmitReviewRequest:
      type: object
      additionalProperties: false
      required:
      - versionId
      - reviewers
      properties:
        versionId:
          type: string
          format: uuid
        reviewers:
          type: array
          minItems: 1
          description: |
            알림 대상이다. 승인 게이트는 SOP_APPROVE 권한이지 이 목록이 아니다
            (검토자별 개별 응답은 그 흐름이 생길 때 연다 — ADR-39).
          items:
            type: string
            format: uuid
        message:
          type: string
          nullable: true
          maxLength: 2000
    SopApproveRequest:
      type: object
      additionalProperties: false
      required:
      - versionId
      properties:
        versionId:
          type: string
          format: uuid
        comment:
          type: string
          nullable: true
          maxLength: 2000
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
      - reviewRequestId
      - sopId
      - sopVersionId
      - status
      - reviewers
      - requestedAt
      properties:
        reviewRequestId:
          type: string
          format: uuid
        sopId:
          type: string
          format: uuid
        sopVersionId:
          type: string
          format: uuid
        status:
          type: string
          description: 반려·철회는 그 엔드포인트가 생길 때 연다(0035 §6).
          enum:
          - REQUESTED
          - APPROVED
        reviewers:
          type: array
          items:
            type: string
            format: uuid
        message:
          type: string
          nullable: true
        requestedBy:
          type: string
          format: uuid
          nullable: true
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    SopCreateRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - hazardType
      properties:
        situationId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        hazardType:
          type: string
    SopGraph:
      type: object
      description: See 03_json-schema/sop-graph.schema.json
      additionalProperties: true
    SopRunCreateRequest:
      type: object
      required:
      - approvedVersionId
      - snapshotId
      - mode
      properties:
        approvedVersionId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - LIVE
          - EXERCISE
          - DRY_RUN
        startPolicy:
          type: string
          enum:
          - AUTO
          - MANUAL
    DispatchRecipient:
      type: object
      additionalProperties: false
      required:
      - recipientId
      - channel
      - deliveryStatus
      - simulated
      properties:
        recipientId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        organizationId:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          enum:
          - SYSTEM
          - SMS
          - EMAIL
          - PUSH
        deliveryStatus:
          type: string
          description: |
            DELIVERED는 수신영수증을 주는 실제 채널이 붙을 때 열린다(OB-06).
            시뮬레이션 채널은 "받았다"(SENT)까지만 말한다.
          enum:
          - PENDING
          - SENT
          - FAILED
        simulated:
          type: boolean
          description: |
            true면 이 채널은 **실제로 나가지 않는다**(OB-06). 화면이 "전파됐다"로
            읽으면 안 된다.
    Dispatch:
      type: object
      additionalProperties: false
      required:
      - dispatchId
      - situationId
      - messageType
      - messageBody
      - status
      - createdAt
      - recipients
      properties:
        dispatchId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        situationId:
          type: string
          format: uuid
        messageType:
          type: string
          description: |
            TASK는 **임무 지시 전파**이고 그것만 임무를 SENT로 만든다.
            TASK_NOTICE는 수행 알림(수행불가·반려·재배정)이라 같은 임무를
            가리키지만 임무 상태를 건드리지 않는다(0039).
          enum:
          - SITUATION
          - TASK
          - TASK_NOTICE
          - ESCALATION
        messageBody:
          type: string
        status:
          type: string
          description: |
            수신자 상태의 합이다. 아직 진행 중인 수신자가 있으면 SENDING이고,
            끝난 것들이 갈리면 PARTIAL이다 — 절반이 받았는데 FAILED로 보이면
            운영자가 전부 다시 보낸다.
          enum:
          - PENDING
          - SENDING
          - SENT
          - PARTIAL
          - FAILED
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/DispatchRecipient'
    DispatchAttempt:
      type: object
      additionalProperties: false
      required:
      - channel
      - attemptNo
      - resultStatus
      properties:
        recipientId:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
        attemptNo:
          type: integer
          minimum: 1
        resultStatus:
          type: string
          enum:
          - SUCCESS
          - RETRY
          - FAIL
        providerMessageId:
          type: string
          nullable: true
        simulated:
          type: boolean
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorCode:
          type: string
          nullable: true
    DispatchStatus:
      allOf:
      - $ref: '#/components/schemas/Dispatch'
      - type: object
        required:
        - attempts
        properties:
          attempts:
            type: array
            description: |
              발송 시도 이력. `channel_delivery` 테이블을 만들지 않은 이유가
              여기 있다 — 시도별 상세는 outbox_attempt가, 수신자별 결과는
              dispatch_recipient가 이미 담는다(ADR-41 D6).
            items:
              $ref: '#/components/schemas/DispatchAttempt'
    TaskDispatchRequest:
      type: object
      additionalProperties: false
      required:
      - channels
      - recipients
      properties:
        channels:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - SYSTEM
            - SMS
            - EMAIL
            - PUSH
        recipients:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            properties:
              userId:
                type: string
                format: uuid
                nullable: true
              organizationId:
                type: string
                format: uuid
                nullable: true
        messageTemplate:
          type: string
          nullable: true
          maxLength: 4000
          description: 생략하면 임무 제목과 지시문으로 본문을 만든다.
    DispatchRetryRequest:
      type: object
      additionalProperties: false
      properties:
        recipientIds:
          type: array
          nullable: true
          description: |
            생략하면 이 전파의 dead letter 전부를 되살린다. **성공한 줄은 절대
            건드리지 않는다** — 다시 보내면 같은 지시를 두 번 받는다.
          items:
            type: string
            format: uuid
    TaskAcknowledgeRequest:
      type: object
      additionalProperties: false
      description: UNE-TASK-004 수신확인.
      properties:
        receivedAt:
          type: string
          format: date-time
          description: 현장에서 실제로 받은 시각. 오프라인이었다면 서버 도착 시각과 다르다.
        deviceInfo:
          type: object
          additionalProperties: false
          nullable: true
          description: |
            **모델·OS 수준까지만** 받는다. 기기 식별자를 받으면 개인 위치추적
            자료가 되고 그것을 요구한 근거가 없다.
          properties:
            platform:
              type: string
              maxLength: 40
              nullable: true
            osVersion:
              type: string
              maxLength: 40
              nullable: true
            appVersion:
              type: string
              maxLength: 40
              nullable: true
    TaskStartRequest:
      type: object
      additionalProperties: false
      description: UNE-TASK-005 착수.
      properties:
        startedAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 2000
          nullable: true
    TaskProgressRequest:
      type: object
      additionalProperties: false
      required:
      - progress
      description: |
        UNE-TASK-006 진행보고. **상태를 바꾸지 않는다** - 진행보고는 몇 번이든
        올 수 있고 그때마다 상태가 바뀌면 이력이 의미를 잃는다.
      properties:
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: |
            뒤로 가는 진행률을 막지 않는다 - 현장이 상황을 다시 보고 낮춰 잡는
            일이 실제로 있고, 그것을 막으면 사람이 거짓 숫자를 남긴다.
        note:
          type: string
          maxLength: 2000
          nullable: true
        attachmentIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    TaskCompleteRequest:
      type: object
      additionalProperties: false
      description: |
        UNE-TASK-007 완료 보고. outcome이 UNABLE이면 수행불가 보고다(설계 09
        SCR-TASK-003의 두 번째 버튼) - 엔드포인트를 늘리지 않고 결과를 가른다.
      properties:
        outcome:
          type: string
          default: DONE
          enum:
          - DONE
          - UNABLE
        completedAt:
          type: string
          format: date-time
        result:
          type: string
          maxLength: 4000
          description: |
            무엇을 했는가. SOP가 완료조건을 적지 않았어도 기본으로 요구한다 -
            빈 완료보고는 상황일지에서 빈 칸이 된다.
        checklist:
          type: array
          description: 충족했다고 표시한 완료조건 key.
          items:
            type: string
        unableReasonCode:
          type: string
          nullable: true
          description: outcome=UNABLE일 때 필수. 자유서술만 받으면 훈련 평가가 집계할 수 없다.
          enum:
          - SAFETY
          - RESOURCE
          - ACCESS
          - UNCLEAR
          - OTHER
    TaskApproveCompletionRequest:
      type: object
      additionalProperties: false
      description: UNE-TASK-008 완료 승인. 마지막 임무면 실행도 여기서 끝난다.
      properties:
        comment:
          type: string
          maxLength: 2000
          nullable: true
    TaskRejectCompletionRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      description: |
        UNE-TASK-009 완료 반려. 임무는 IN_PROGRESS로 돌아간다 - REJECTED라는
        상태를 두지 않는 이유는 그것이 어떤 순간에도 관측되지 않기 때문이다.
      properties:
        reason:
          type: string
          maxLength: 2000
          description: 사유 없이 반려하면 담당자가 무엇을 고쳐야 하는지 모른다.
    TaskReassignRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      description: |
        UNE-TASK-010 재배정. 임무는 **새 담당자의 SENT**가 된다 - 진행 중이던
        상태를 물려주면 받지도 않은 사람이 착수해 있는 임무가 생긴다.
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
        assigneeOrgId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 2000
    TaskEscalateRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      - targetIds
      description: UNE-TASK-011 Escalation. 상태를 바꾸지 않고 위로 알린다.
      properties:
        level:
          type: string
          default: L1
          enum:
          - L1
          - L2
          - L3
        reason:
          type: string
          maxLength: 2000
        targetIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
    TaskAttachmentRequest:
      type: object
      additionalProperties: false
      required:
      - fileId
      description: |
        UNE-TASK-012 현장 파일 등록. 업로드는 파일 API가 하고 여기서는 이미
        올라간 파일을 임무에 건다 - 악성코드 검사를 통과한 것만 걸린다.
      properties:
        fileId:
          type: string
          format: uuid
        category:
          type: string
          default: PHOTO
          enum:
          - PHOTO
          - DOC
          - VIDEO
          - OTHER
        caption:
          type: string
          maxLength: 500
          nullable: true
        geo:
          type: object
          additionalProperties: false
          nullable: true
          description: |
            위치. 필수가 아니다 - 위치권한을 거부한 기기에서도 보고할 수 있어야
            한다. **임의 JSON을 받지 않는다**: 개인 위치정보이므로 형태를 좁히고
            소수점 5자리(약 1m)로 깎는다.
          required:
          - lat
          - lon
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lon:
              type: number
              minimum: -180
              maximum: 180
        capturedAt:
          type: string
          format: date-time
          nullable: true
          description: 미래 시각은 거부한다(설계 09 TASK-5205).
    TaskEvent:
      type: object
      additionalProperties: false
      required:
      - taskEventId
      - taskId
      - eventType
      - eventTime
      - payload
      - taskStatus
      description: |
        임무 이벤트. **append-only다** - 틀렸으면 정정 이벤트를 더한다.

        `taskStatus`는 **그 이벤트가 남긴** 상태다(현재 상태가 아니다). 기록
        시점에 페이로드에 함께 굳히므로 과거 이벤트도 자기 시점의 값을 말한다.
      properties:
        taskEventId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - ACKNOWLEDGED
          - STARTED
          - PROGRESS_REPORTED
          - COMPLETION_SUBMITTED
          - UNABLE_REPORTED
          - COMPLETION_APPROVED
          - COMPLETION_REJECTED
          - REASSIGNED
          - ESCALATED
          - ATTACHMENT_ADDED
        eventTime:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
          nullable: true
        payload:
          type: object
          additionalProperties: true
        taskStatus:
          $ref: '#/components/schemas/TaskStatus'
    TaskAttachment:
      type: object
      additionalProperties: false
      required:
      - taskAttachmentId
      - taskId
      - fileId
      - category
      - uploadedBy
      - originalName
      - mimeType
      - sizeBytes
      properties:
        taskAttachmentId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - PHOTO
          - DOC
          - VIDEO
          - OTHER
        caption:
          type: string
          nullable: true
        geo:
          type: object
          additionalProperties: false
          nullable: true
          required:
          - lat
          - lon
          properties:
            lat:
              type: number
            lon:
              type: number
        capturedAt:
          type: string
          format: date-time
          nullable: true
        uploadedBy:
          type: string
          format: uuid
        originalName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
    TaskAssignment:
      type: object
      additionalProperties: false
      required:
      - taskAssignmentId
      - assignedAt
      - source
      description: |
        담당 이력. **append-only다** - 배정 구간의 끝은 다음 행의 assignedAt이
        말한다. released_at 같은 컬럼을 두면 이력 행을 나중에 고쳐야 하고,
        고칠 수 있는 이력은 이력이 아니다.
      properties:
        taskAssignmentId:
          type: string
          format: uuid
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
        assigneeOrgId:
          type: string
          format: uuid
          nullable: true
        assignedBy:
          type: string
          format: uuid
          nullable: true
        assignedAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - DISPATCH
          - REASSIGN
        reason:
          type: string
          nullable: true
    TaskCompletionPolicy:
      type: object
      additionalProperties: false
      required:
      - checklist
      - minAttachments
      - requireResult
      description: |
        완료조건. SOP 노드의 config에서 **임무 생성 시점에 굳는다** - 승인된
        버전은 불변이므로 이 사본은 시간이 지나도 같은 것을 말한다.
      properties:
        checklist:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - label
            - requiresEvidence
            properties:
              key:
                type: string
              label:
                type: string
              requiresEvidence:
                type: boolean
        minAttachments:
          type: integer
          description: |
            기본 0이다. 사진을 찍을 수 없는 임무가 실제로 있고(전화 통보, 방송
            요청), 못 지킬 조건을 기본값으로 걸면 현장이 아무 사진이나 올려
            조건을 우회한다.
        requireResult:
          type: boolean
          description: 기본 true. SOP가 조건을 적지 않은 것은 조건 없음이 아니라 대개 아직 적지 못한 것이다.
    TaskDetail:
      type: object
      additionalProperties: false
      required:
      - task
      - runStatus
      - runMode
      - completionPolicy
      - events
      - attachments
      - assignments
      properties:
        task:
          $ref: '#/components/schemas/Task'
        runStatus:
          type: string
        runMode:
          type: string
        completionPolicy:
          $ref: '#/components/schemas/TaskCompletionPolicy'
        events:
          type: array
          items:
            $ref: '#/components/schemas/TaskEvent'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TaskAttachment'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignment'
    TaskPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    Plan:
      type: object
      additionalProperties: true
    GenerationJob:
      type: object
      additionalProperties: true
    # ── CC-200/ADR-33: 상황 계열 자리표시자를 실형태로 채운다 ──────────────
    # `additionalProperties: true`는 어떤 응답이든 통과시키므로 예제 게이트가
    # 아무것도 검증하지 못한다. CC-160/ADR-31이 ExportJobResource에서 같은
    # 문제를 닫았고 그 주석이 아래 남아 있다. `SituationSnapshot`은 확정 경로를
    # 쥔 CC-210이 채운다 — 여기서 형태를 추측하면 CC-210의 결정을 미리 자른다.
    SituationMode:
      type: string
      description: 설계 06 §7.1 / 0023 ck_situation_mode
      enum:
      - LIVE
      - EXERCISE
    SituationStatus:
      type: string
      description: 설계 06 §7.1 Incident 상태 흐름 / 0023 ck_situation_status
      enum:
      - DRAFT
      - REGISTERED
      - CONTEXT_CONFIRMED
      - SOP_READY
      - RUNNING
      - PAUSED
      - CLOSING
      - CLOSED
    SituationContextState:
      type: string
      description: >-
        설계 06 §7.1 SituationContext 상태. **컬럼이 아니라 파생값**이다
        (0023 §8). 동기 수집에서 PROVIDER_QUERYING은 관측되지 않으므로
        CC-200의 응답에는 나타나지 않는다(ADR-33 D2).
      enum:
      - DRAFT
      - PROVIDER_QUERYING
      - CANDIDATE_REVIEW
      - CONFLICT_OPEN
      - USER_CONFIRMED
    SituationFactType:
      type: string
      description: 설계 01 §20.5 "필수 Fact 범주"
      enum:
      - WEATHER_OBSERVATION
      - WEATHER_FORECAST
      - WEATHER_WARNING
      - DISASTER_MESSAGE
      - FIELD_REPORT
      - USER_ASSERTED
    SituationFactStatus:
      type: string
      description: >-
        0023 + **0025**의 ck_situation_fact_status. `SUPERSEDED`는 보정이 파생
        Fact를 만들면서 원본이 내려가는 자리다(ADR-34 D3). 마이그레이션만
        넓히고 여기를 두면 삼중 대조가 갈라진다.
      enum:
      - CANDIDATE
      - CONFIRMED
      - REJECTED
      - SUPERSEDED
    ProviderCode:
      type: string
      description: situation-fact.schema.json source.providerCode enum과 같은 일곱 값
      enum:
      - KMA
      - MOIS
      - SAFEKOREA
      - NAVER
      - MANUAL
      - T3Q
      - UNI
    Situation:
      type: object
      additionalProperties: false
      required:
      - situationId
      - tenantId
      - mode
      - title
      - hazardType
      - status
      - versionNo
      - createdBy
      - createdAt
      - updatedAt
      properties:
        situationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SituationMode'
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
          maxLength: 50
          description: 재난유형. 정본은 plan-context.schema.json의 enum이다(ADR-23 D3).
        status:
          $ref: '#/components/schemas/SituationStatus'
        occurredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 발생시각. 미정이면 null (설계 06 US-SIT-003 A-01).
        locationText:
          type:
          - string
          - 'null'
          maxLength: 500
        currentSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
          description: 확정 SituationSnapshot. CC-200에서는 항상 null (확정은 CC-210).
        versionNo:
          type: integer
          minimum: 1
          description: 낙관적 잠금 버전 (If-Match/ETag 값)
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SituationDetail:
      type: object
      additionalProperties: false
      required:
      - situationId
      - tenantId
      - mode
      - title
      - hazardType
      - status
      - versionNo
      - createdBy
      - createdAt
      - updatedAt
      - contextState
      - candidateFactCount
      - openConflictCount
      properties:
        situationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SituationMode'
        title:
          type: string
          maxLength: 300
        hazardType:
          type: string
          maxLength: 50
        status:
          $ref: '#/components/schemas/SituationStatus'
        occurredAt:
          type:
          - string
          - 'null'
          format: date-time
        locationText:
          type:
          - string
          - 'null'
          maxLength: 500
        currentSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contextState:
          $ref: '#/components/schemas/SituationContextState'
        candidateFactCount:
          type: integer
          minimum: 0
          description: status=CANDIDATE인 Fact 수. contextState의 근거값이다.
        # 둘 다 contextState의 근거이므로 둘 다 필수다. 하나만 required로
        # 두면 화면이 파생 상태를 재계산할 수 없다(QA 리뷰 R-6).
        openConflictCount:
          type: integer
          minimum: 0
          description: OPEN 충돌 수. CC-200에서는 항상 0 (충돌 계산은 CC-210).
    # 출처. situation-fact.schema.json의 `source` 객체와 같은 자리이며
    # fact_source 행에서 투영한다.
    SituationFactSource:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - providerCode
      - sourceType
      - sourceName
      - collectedAt
      properties:
        sourceId:
          type: string
          format: uuid
        providerCode:
          $ref: '#/components/schemas/ProviderCode'
        sourceType:
          type: string
          enum:
          - API
          - WEB
          - FILE
          - USER
        sourceName:
          type: string
          maxLength: 300
        sourceUrl:
          type:
          - string
          - 'null'
        collectedAt:
          type: string
          format: date-time
          description: fact_source.retrieved_at (조회시각)
    # 정규화 근거(설계 06 US-SIT-006 #1 "변환버전 기록"). 원문값·원문단위를
    # 함께 실어 A-01(단위 변환 불가 → 원문 유지)이 화면에서 구분된다.
    FactNormalization:
      type: object
      additionalProperties: false
      required:
      - version
      - outcome
      properties:
        version:
          type: string
        outcome:
          type: string
          enum:
          - NORMALIZED
          - ORIGINAL_KEPT
        originalValue: {}
        originalUnit:
          type:
          - string
          - 'null'
        notes:
          type: array
          items:
            type: object
            required:
            - reason
            - detail
            properties:
              reason:
                type: string
              detail:
                type: string
    SituationFact:
      type: object
      additionalProperties: false
      required:
      - factId
      - situationId
      - factType
      - factKey
      - value
      - source
      - collectedAt
      - status
      - originalFactId
      - versionNo
      - updatedAt
      properties:
        factId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        factType:
          $ref: '#/components/schemas/SituationFactType'
        factKey:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,99}$'
          description: 표준 Key. 패턴은 situation-fact.schema.json과 같다.
        value: {}
        unit:
          type:
          - string
          - 'null'
          maxLength: 30
        source:
          $ref: '#/components/schemas/SituationFactSource'
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        collectedAt:
          type: string
          format: date-time
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        status:
          $ref: '#/components/schemas/SituationFactStatus'
        normalization:
          $ref: '#/components/schemas/FactNormalization'
        originalFactId:
          type:
          - string
          - 'null'
          format: uuid
          description: >-
            파생 원본(0025 §2). 원천이면 null이다. 보정은 제자리 수정이 아니라
            파생 생성이므로 화면이 계보를 그릴 수 있어야 한다(ADR-34 D3).
        derivedReason:
          type:
          - string
          - 'null'
          maxLength: 500
        versionNo:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    # 한 Provider의 수집 결과 한 행(provider_job). 동기 수집이라 태어날 때
    # 이미 종결돼 있고 QUEUED/RUNNING이 없다(0023 §4, ADR-33 D2).
    ProviderJob:
      type: object
      additionalProperties: false
      required:
      - providerJobId
      - batchId
      - providerCode
      - status
      - resultCount
      - createdAt
      - finishedAt
      properties:
        providerJobId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        situationId:
          type:
          - string
          - 'null'
          format: uuid
        providerCode:
          $ref: '#/components/schemas/ProviderCode'
        status:
          type: string
          description: >-
            0028(CC-220)이 QUEUED/RUNNING을 열었다 — 0023 §4가 "비동기로 옮길 때
            함께 온다"고 예고한 값이다. 상황 수집(CC-200)은 여전히 동기라 종결
            상태로만 태어나고, 미종결 두 값은 UNI 지식문서 전송 경로가 쓴다.
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - PARTIAL
          - FAILED
        resultCount:
          type: integer
          minimum: 0
          description: 정규화를 통과해 후보 Fact가 된 항목 수
        error:
          type:
          - object
          - 'null'
          description: >-
            실패·부분실패의 근거. 0023 ck_provider_job_outcome_shape가
            상태와의 상관을 강제한다: SUCCEEDED면 null, PARTIAL이면 non-null이고
            resultCount>0, FAILED면 non-null이고 resultCount=0.
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
              - TIMEOUT
              - UNAUTHORIZED
              - RATE_LIMITED
              - UPSTREAM_ERROR
              - PARSER_CHANGED
              - NO_DATA
              - DISABLED
              - NOT_CONTRACTED
              - NORMALIZATION_REJECTED
            message:
              type: string
            retriable:
              type: boolean
            rejectedCount:
              type: integer
              minimum: 0
              description: 정규화에서 탈락한 항목 수 (PARTIAL의 근거)
            reasons:
              type: array
              description: >-
                탈락 사유의 중복 제거 목록(도메인 NormalizationReason). 탈락
                항목의 원문 자체는 provider_result에 통째로 있다.
              items:
                type: string
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            미종결(QUEUED/RUNNING)이면 null이다. 종결 상태에는 0028의
            ck_provider_job_outcome_shape가 값을 강제한다 — 불변식이 컬럼
            NOT NULL에서 상관식으로 옮겨갔을 뿐 약해지지 않는다.
    # UNE-SIT-005의 응답. 요청 하나가 Provider 수마다 행을 만들고 batchId가
    # 그 행들을 묶는다(0023 §4).
    ProviderQueryJob:
      type: object
      additionalProperties: false
      required:
      - batchId
      - situationId
      - jobs
      - factsCreated
      properties:
        batchId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ProviderJob'
        factsCreated:
          type: integer
          minimum: 0
          description: 이 요청이 만든 후보 Fact 수 (모든 Provider 합계)
    # 응답 봉투. 다른 성공 응답과 같은 {success, data, meta} 형태다(설계 §2).
    SituationResponse:
