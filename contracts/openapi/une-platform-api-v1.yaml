        핵심 요청: If-Match, reason, checkpointLabel


        핵심 응답: 새 head DocumentRevision


        오류: DOC-409-002, DOC-404-001, COM-0428


        US-PLAN-020 AC-01: 복원은 과거 revision을 변경하지 않고 새 head revision을 생성한다.
        이 오퍼레이션에는 어떤 UPDATE document_revision도 없다 — 과거 리비전의 ir_json을
        읽어서 새 행으로 넣고, 함께 남기는 change_set(origin=RESTORE)이 계보를 기록한다.


        change_operation 행은 만들지 않는다: 복원은 8종 연산 어휘로 표현되는 편집이 아니라
        이 시점의 문서로 되돌린다는 한 번의 사실이며, 어휘에 없는 연산을 지어내면 역연산
        생성기가 전수 분기에서 실패한다.


        If-Match는 현재 head의 revision_no다. 불일치는 409 DOC-409-002이며 현재 ETag와
        meta.conflict를 함께 싣는다. 이미 head인 Revision을 복원 대상으로 지정하면
        422 DOC-422-004다(같은 내용의 리비전을 하나 더 만드는 것은 이력 오염이다).'
