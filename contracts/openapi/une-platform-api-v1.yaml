      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SituationFact'
        meta:
          type: object
    SituationFactPageResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - page
          - size
          - totalElements
          - totalPages
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SituationFact'
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
        meta:
          type: object
    ProviderQueryJobResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ProviderQueryJob'
        meta:
          type: object
    DeduplicateResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - groups
          - conflicts
          - conflictsOpened
          - conflictsObsoleted
          additionalProperties: false
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/DuplicateGroup'
            conflicts:
              type: array
              description: 계산 후의 OPEN 충돌 전부(이번에 새로 연 것만이 아니다).
              items:
                $ref: '#/components/schemas/FactConflict'
            conflictsOpened:
              type: integer
              minimum: 0
              description: 이번 계산이 **새로** 연 충돌 수. 기존 OPEN은 세지 않는다.
            conflictsObsoleted:
              type: integer
              minimum: 0
              description: >-
                이번 계산에 더 이상 나타나지 않아 OBSOLETE로 닫힌 충돌 수.
                보정으로 값이 같아진 경우가 대표적이다.
        meta:
          type: object
    FactConflictListResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/FactConflict'
        meta:
          type: object
    ConflictResolutionResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ConflictResolution'
        meta:
          type: object
    SituationSnapshotResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SituationSnapshot'
        meta:
          type: object
    SituationSnapshotListResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
          - items
          - diff
          additionalProperties: false
          properties:
            items:
              type: array
              description: 최신 버전부터.
              items:
                $ref: '#/components/schemas/SituationSnapshot'
            diff:
              description: compareTo가 없으면 null.
              anyOf:
              - $ref: '#/components/schemas/SnapshotDiff'
              - type: 'null'
        meta:
          type: object
    ProviderJobResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ProviderJob'
        meta:
          type: object
    # ── CC-210/ADR-34: 마지막 상황 자리표시자를 채운다 ─────────────────────
    # CC-200이 "확정 경로를 쥔 CC-210이 채운다"며 의도적으로 남긴 자리다.
    # `contracts/schemas/situation-snapshot.schema.json`과 같은 형태이며,
    # `facts[]`는 확정 시점의 **사본**이다(설계 06 A-02: 확정 후 자동변경 금지).
    SituationSnapshot:
      type: object
      required:
      - snapshotId
      - situationId
      - versionNo
      - effectiveAt
      - facts
      - contentHash
      - confirmedBy
      - confirmedAt
      additionalProperties: false
      properties:
        snapshotId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
          description: 상황 안에서 유일하다(0025 §6). 재확정은 새 snapshotId + v+1.
        effectiveAt:
          type: string
          format: date-time
        facts:
          type: array
          minItems: 1
          description: >-
            확정 시점의 Fact 사본. 참조가 아니라 사본인 이유는 설계 06 A-02다 —
            확정 후 원천이 바뀌어도 Snapshot은 움직이지 않아야 한다.
          items:
            $ref: '#/components/schemas/SnapshotFact'
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >-
            정규화 JSON의 SHA-256. 사실과 effectiveAt만 들어가고 확정자·시각·
            사유·버전은 빠진다 — 그래야 "내용이 같은가"를 물을 수 있다.
        supersedesSnapshotId:
          type:
          - string
          - 'null'
          format: uuid
        confirmedBy:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
    SnapshotFact:
      type: object
      required:
      - factId
      - factType
      - factKey
      - value
      - source
      - collectedAt
      - status
      additionalProperties: false
      properties:
        factId:
          type: string
          format: uuid
        factType:
          $ref: '#/components/schemas/SituationFactType'
        factKey:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,99}$'
        value: {}
        unit:
          type:
          - string
          - 'null'
          maxLength: 30
        source:
          type: object
          required:
          - providerCode
          - sourceName
          - collectedAt
          additionalProperties: false
          properties:
            providerCode:
              $ref: '#/components/schemas/ProviderCode'
            sourceName:
              type: string
            sourceUrl:
              type:
              - string
              - 'null'
            collectedAt:
              type: string
              format: date-time
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        collectedAt:
          type: string
          format: date-time
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        status:
          type: string
          description: 확정 시점의 상태를 박는다. 사본은 이후 UPDATE를 따라가지 않는다.
          enum:
          - CONFIRMED
    DuplicateGroup:
      type: object
      required:
      - groupId
      - situationId
      - factType
      - factKey
      - groupKey
      - strategy
      - memberFactIds
      - memberCount
      - computedAt
      additionalProperties: false
      properties:
        groupId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        factType:
          $ref: '#/components/schemas/SituationFactType'
        factKey:
          type: string
        groupKey:
          type: string
          description: >-
            전략이 만든 그룹화 키(범주+Key+시간창). 같은 상황 안에서
            유일하다(0025 §1). **범주가 들어간다** — 빼면 범주가 다른 동명
            Key가 한 그룹이 되어 허위 충돌이 열린다(ADR-34 D5 따름정리).
        strategy:
          $ref: '#/components/schemas/DuplicateStrategy'
        threshold:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        memberFactIds:
          type: array
          minItems: 2
          description: 묶인 Fact. **원천은 각각 유지된다**(설계 06 US-SIT-006 #3).
          items:
            type: string
            format: uuid
        memberCount:
          type: integer
          minimum: 2
        computedAt:
          type: string
          format: date-time
    DuplicateStrategy:
      type: string
      description: 0025 §1 ck_fact_duplicate_group_strategy와 같은 어휘
      enum:
      - KEY_TIME_WINDOW
      - KEY_ONLY
    FactConflict:
      type: object
      required:
      - conflictId
      - situationId
      - groupKey
      - factKey
      - conflictType
      - status
      - candidateFactIds
      - detectedAt
      additionalProperties: false
      properties:
        conflictId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        factKey:
          type: string
        conflictType:
          type: string
          description: >-
            VALUE(값이 다름) / TIME(값은 같고 시각이 다름) / SOURCE.
            **값도 시각도 같으면 충돌이 아니라 중복이다**(설계 06 US-SIT-006 #3).
          enum:
          - VALUE
          - TIME
          - SOURCE
        status:
          type: string
          description: >-
            `OBSOLETE`는 재계산이 "더 이상 존재하지 않는 충돌"을 닫은 것이다 —
            보정으로 값이 같아졌는데 OPEN으로 두면 확정이 영구 차단되고,
            RESOLVED로 적으면 하지 않은 선택을 기록하게 된다(ADR-34 D6).
          enum:
          - OPEN
          - RESOLVED
          - OBSOLETE
        groupKey:
          type:
          - string
          - 'null'
          description: 충돌의 단위는 그룹의 단위와 같다(0025 §4).
        candidateFactIds:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid
        detectedAt:
          type: string
          format: date-time
    ConflictResolution:
      type: object
      required:
      - resolutionId
      - conflictId
      - factKey
      - selectedFactId
      - reason
      - resolvedBy
      - resolvedAt
      additionalProperties: false
      properties:
        resolutionId:
          type: string
          format: uuid
        conflictId:
          type: string
          format: uuid
        factKey:
          type: string
        selectedFactId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 1000
        resolvedBy:
          type: string
          format: uuid
        resolvedAt:
          type: string
          format: date-time
    SnapshotDiff:
      type: object
      required:
      - fromSnapshotId
      - toSnapshotId
      - added
      - removed
      - changed
      - unchanged
      - entries
      additionalProperties: false
      properties:
        fromSnapshotId:
          type: string
          format: uuid
        toSnapshotId:
          type: string
          format: uuid
        added:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        entries:
          type: array
          items:
            type: object
            required:
            - factKey
            - kind
            additionalProperties: false
            properties:
              factKey:
                type: string
              kind:
                type: string
                enum:
                - ADDED
                - REMOVED
                - CHANGED
                - UNCHANGED
              from:
                $ref: '#/components/schemas/SnapshotDiffSide'
              to:
                $ref: '#/components/schemas/SnapshotDiffSide'
    SnapshotDiffSide:
      type:
      - object
      - 'null'
      required:
      - factId
      additionalProperties: false
      properties:
        factId:
          type: string
          format: uuid
        value: {}
        unit:
          type:
          - string
          - 'null'
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
    SopRun:
      type: object
      additionalProperties: false
      required:
      - runId
      - sopVersionId
      - situationId
      - snapshotId
      - mode
      - status
      - startedAt
      properties:
        runId:
          type: string
          format: uuid
        sopVersionId:
          type: string
          format: uuid
          description: 승인(LOCKED)된 버전만 실행한다.
        situationId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        mode:
          type: string
          description: |
            DRY_RUN은 상황 상태를 바꾸지 않고 전파도 내보내지 않는다 — 모의
            때문에 대시보드·일지가 "대응 중"으로 보이면 안 된다.
          enum:
          - LIVE
          - EXERCISE
          - DRY_RUN
        status:
          type: string
          description: |
            CC-280이 COMPLETED를 열었다 - 마지막 임무가 승인되면 실행이 스스로
            끝난다(사람이 누르는 것이 아니다). FAILED는 여전히 그 값을 만드는
            경로가 없어 넣지 않는다.
          enum:
          - READY
          - RUNNING
          - PAUSED
          - COMPLETED
          - TERMINATED
        startedBy:
          type: string
          format: uuid
          nullable: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        correlationId:
          type: string
    ExecutionEvent:
      type: object
      additionalProperties: false
      required:
      - eventId
      - situationId
      - aggregateType
      - aggregateId
      - eventType
      - occurredAt
      - recordedAt
      - payload
      - eventHash
      description: |
        사실원장 한 줄. **append-only다** - 원본은 어떤 경로로도 바뀌지 않고
        정정은 `correctsEventId`를 가진 새 이벤트다.
      properties:
        eventId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        aggregateType:
          type: string
          enum:
          - TASK
          - SOP_RUN
          - DISPATCH
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
          description: 업무시각. `at` 질의가 해석하는 축이다.
        recordedAt:
          type: string
          format: date-time
          description: 기록시각. 늦은 보고면 occurredAt과 다르다.
        actorId:
          type: string
          format: uuid
          nullable: true
          description: 시스템이 남긴 이벤트는 비어 있다(릴레이의 TASK_SENT 등).
        payload:
          type: object
          additionalProperties: true
        correctsEventId:
          type: string
          format: uuid
          nullable: true
          description: |
            정정 대상 **원본**. 정정 이벤트만 갖고, 정정을 다시 가리킬 수 없다
            (star 구조 - 사슬이면 "지금 사실"에 답하려고 재귀를 따라가야 한다).
        correlationId:
          type: string
        eventHash:
          type: string
          pattern: ^[0-9a-f]{64}$
    ExecutionEventTimelineItem:
      type: object
      additionalProperties: false
      description: |
        타임라인 한 줄. ExecutionEvent에 표시 하나를 더한 것이다.

        **allOf로 쓰지 않는다.** 2020-12에서 allOf의 각 브랜치는 독립 평가되므로
        (a) 어느 브랜치에 additionalProperties:false를 두면 형제 브랜치의
        property를 보지 못하고, (b) 닫힌 기반 스키마를 참조하면 더한 property를
        그 기반이 거부한다. 둘 다 **모든 인스턴스를 무효로 만든다**(ADR-24 D4).
        그래서 닫힌 객체 하나로 펼친다.
      required:
      - eventId
      - situationId
      - aggregateType
      - aggregateId
      - eventType
      - occurredAt
      - recordedAt
      - payload
      - eventHash
      properties:
        eventId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        aggregateType:
          type: string
          enum:
          - TASK
          - SOP_RUN
          - DISPATCH
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
          description: 업무시각. `at` 질의가 해석하는 축이다.
        recordedAt:
          type: string
          format: date-time
          description: 기록시각. 늦은 보고면 occurredAt과 다르다.
        actorId:
          type: string
          format: uuid
          nullable: true
          description: 시스템이 남긴 이벤트는 비어 있다(릴레이의 TASK_SENT 등).
        payload:
          type: object
          additionalProperties: true
        correctsEventId:
          type: string
          format: uuid
          nullable: true
          description: |
            정정 대상 **원본**. 정정 이벤트만 갖고, 정정을 다시 가리킬 수 없다
            (star 구조 - 사슬이면 "지금 사실"에 답하려고 재귀를 따라가야 한다).
        correlationId:
          type: string
        eventHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        correctedBy:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: |
            이 원본을 정정한 이벤트. **원본을 감추지 않는다** - 타임라인은
            원본을 그대로 보이고 표시만 단다(설계 09 REG-05). 한 쪽 안에서
            찾지 못하면 null이므로 정본은 상세(UNE-JNL-003)다.
    ExecutionEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionEventTimelineItem'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    ExecutionEventDetail:
      type: object
      additionalProperties: false
      required:
      - event
      - corrections
      - effectivePayload
      - correctable
      description: |
        원본과 정정 lineage를 함께 낸다(설계 09 REG-05). 원본을 숨기는 표현은
        두지 않는다 - 감사 관점에서 "무엇이 있었고 무엇으로 고쳤는가"가 둘 다
        보여야 한다.
      properties:
        event:
          $ref: '#/components/schemas/ExecutionEvent'
        corrections:
          type: array
          description: 이 원본을 정정한 것들. **가장 나중 것이 유효본이다.**
          items:
            $ref: '#/components/schemas/ExecutionEvent'
        effectivePayload:
          type: object
          additionalProperties: true
          description: 지금 사실. 정정이 없으면 원본 payload와 같다.
        correctsEvent:
          anyOf:
          - $ref: '#/components/schemas/ExecutionEvent'
          - type: 'null'
        correctable:
          type: boolean
          description: |
            화면이 "정정" 버튼을 보일지 판단한다. 편의이지 통제가 아니다 -
            서버가 다시 검사한다.
    ExecutionCorrectionRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      - replacementFields
      description: |
        UNE-JNL-004. **원본을 고치지 않는다.** `replacementFields`는 부분
        패치이고, 서버가 유효 payload와 병합해 완성본을 새 이벤트에 저장한다 -
        읽는 쪽이 매번 체인을 재생하지 않아도 되게.

        **사람이 보고한 사실만 정정할 수 있다.** 상태 전이나 전파 결과 같은
        시스템 관측 이벤트는 "시스템이 그때 그렇게 했다"는 기록이라 그 자체로
        참이고, 잘못이면 새 조치(재전파·반려·재배정)로 바로잡는다.
      properties:
        reason:
          type: string
          maxLength: 2000
          description: 사유 없는 정정은 감사에서 "누군가 값을 바꿨다"로만 남는다.
        replacementFields:
          type: object
          additionalProperties: true
          maxProperties: 30
          description: |
            바꿀 값만. `status`·`runId`·`taskId` 같은 시스템 참조는 바꿀 수
            없다 - 특히 `status`를 허용하면 "과거 이력에 현재 상태가 붙던"
            CC-280의 결함을 정정 경로로 다시 들여오는 셈이다.
    DashboardKpi:
      type: object
      additionalProperties: false
      required:
      - total
      - notDispatched
      - awaitingAck
      - inProgress
      - completed
      - unable
      - cancelled
      - overdue
      description: |
        설계 09 SCR-BOARD-001 REG-01(전체/진행/완료/지연/실패/미수신).
        **임무 행을 세지 않고 이벤트를 접어 만든다** - 그래야 `at` 질문에
        답할 수 있다.
      properties:
        total:
          type: integer
        notDispatched:
          type: integer
          description: 아직 전파되지 않음.
        awaitingAck:
          type: integer
          description: 전파됐으나 수신확인 없음(설계의 "미수신").
        inProgress:
          type: integer
        completed:
          type: integer
        unable:
          type: integer
          description: 수행불가로 보고됨(설계의 "실패").
        cancelled:
          type: integer
        overdue:
          type: integer
          description: 기한을 넘겼고 아직 끝나지 않음.
    DashboardTask:
      type: object
      additionalProperties: false
      required:
      - taskId
      - runId
      - nodeKey
      - title
      - status
      - statusEventId
      - progressPct
      - overdue
      properties:
        taskId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        nodeKey:
          type: string
        title:
          type: string
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
        assigneeOrgId:
          type: string
          format: uuid
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        progressPct:
          anyOf:
          - type: number
          - type: 'null'
          description: |
            **이벤트에서 복원한** 그 시점의 진행률. 임무 행의 현재 값이 아니다 -
            그것을 쓰면 과거 판이 오늘의 진행률을 보여 준다. null이면 아직
            보고되지 않았다.
        status:
          allOf:
          - $ref: '#/components/schemas/TaskStatus'
          description: '**이벤트에서 복원한** 그 시점의 상태 (임무 행의 현재 값이 아니다).'
        statusEventId:
          type: string
          format: uuid
          description: |
            그 상태를 만든 이벤트. **KPI에서 사실원장으로 내려가는 길**이다
            (설계 06 drill-down) - 이것이 없으면 "미수신 3건"에서 그 셋의 근거로
            갈 방법이 없다.
        overdue:
          type: boolean
    DashboardView:
      type: object
      additionalProperties: false
      required:
      - situationId
      - title
      - mode
      - status
      - at
      - stale
      - staleAfterMs
      - kpi
      - tasks
      - runs
      - recentEvents
      - provenance
      description: |
        전자상황판. `at`을 주면 **그 시점의 판**을 낸다 - 이벤트를 재생해
        복원하므로 "그때 지휘소가 무엇을 보고 있었는가"에 답할 수 있다.
      properties:
        situationId:
          type: string
          format: uuid
        title:
          type: string
        mode:
          type: string
        status:
          type: string
        at:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
          description: |
            마지막 이벤트가 오래됐다. 조용한 것일 수도, 갱신이 끊긴 것일 수도
            있다 - 화면이 둘을 구분하지 못하면 끊긴 화면을 믿는다(설계 09 STALE).
        staleAfterMs:
          type: integer
        kpi:
          $ref: '#/components/schemas/DashboardKpi'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTask'
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - runId
            - mode
            - status
            - startedAt
            properties:
              runId:
                type: string
                format: uuid
              mode:
                type: string
              status:
                type: string
              startedAt:
                type: string
                format: date-time
        snapshot:
          type: object
          additionalProperties: false
          nullable: true
          required:
          - snapshotId
          - versionNo
          - effectiveAt
          - factCount
          properties:
            snapshotId:
              type: string
              format: uuid
            versionNo:
              type: integer
            effectiveAt:
              type: string
              format: date-time
            factCount:
              type: integer
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionEventTimelineItem'
        provenance:
          type: object
          additionalProperties: false
          required:
          - eventCount
          - truncated
          - timeAxis
          - taskRowFields
          - tasksWithoutEvents
          - divergences
          description: |
            **이 집계가 무엇을 근거로 했는가.** 숫자만 주면 화면이 그것을 완전한
            사실로 읽는다. 기한처럼 이벤트가 모르는 값이 섞여 있다는 것, 재생이
            잘렸다는 것, 이벤트와 임무 행이 어긋난다는 것을 응답이 스스로 밝힌다.
          properties:
            eventCount:
              type: integer
            truncated:
              type: boolean
              description: 재생 상한에 걸려 잘렸다. 이 판은 불완전하다.
            timeAxis:
              type: string
              enum:
              - occurredAt
            taskRowFields:
              type: array
              description: |
                이벤트가 아니라 임무 행의 **현재** 값에서 온 항목. 그 변경이
                이벤트로 남지 않아 과거 시점 조회에도 현재 값이 쓰인다.
              items:
                type: string
            tasksWithoutEvents:
              type: integer
              description: 이벤트가 아직 말하지 않은 임무 수. 0이 아니면 이벤트가 빠졌을 수 있다.
            divergences:
              type: array
              description: |
                재생 결과와 임무 행이 어긋난 임무. **비어 있지 않으면 어딘가에서
                상태가 사실원장 밖으로 움직였다** - 이 항목이 세 번 찾은 결함의
                형태다. 과거 시점 조회에서는 재지 않는다(당연히 다르다).
              items:
                type: object
                additionalProperties: false
                required:
                - taskId
                - replayed
                - stored
                properties:
                  taskId:
                    type: string
                    format: uuid
                  replayed:
                    anyOf:
                    - type: string
                    - type: 'null'
                  stored:
                    type: string
    ClosedSituationNote:
      type: object
      additionalProperties: false
      description: |
        **SIT-412-011** — 종료된 훈련에 새 사실을 기록하려 했다.

        0045 §5의 가드가 `execution_event` INSERT를 거부하면 필터가 이 코드로 옮긴다
        (`api-error.filter.ts`). 트리거의 42501을 그대로 두면 `COM-0001 / 500 / 서버 오류`가
        되어 사용자는 왜 막혔는지 모르고, 그것이 정상 동작이라는 사실도 모른다.

        임무 전이(UNE-TASK-*)·실행 제어(UNE-SOP-*)·전파(UNE-TASK-003) 등 사실원장에 쓰는
        모든 연산에서 날 수 있다. 잘못된 기록은 정정(UNE-JNL-004)으로만 바로잡는다.
      properties:
        code:
          type: string
          enum:
          - SIT-412-011
    CloseBlockerKind:
      type: string
      description: |
        무엇이 종료를 막는가. 값을 만드는 코드가 있는 다섯만 있다(0045 §1의 원칙).
      enum:
      - ACTIVE_RUN
      - OPEN_TASK
      - PENDING_DISPATCH
      - CANDIDATE_FACT
      - OPEN_CONFLICT
      - UNAPPROVED_JOURNAL
    CloseBlocker:
      type: object
      additionalProperties: false
      required:
      - kind
      - refId
      - label
      - detail
      - waivable
      properties:
        kind:
          $ref: '#/components/schemas/CloseBlockerKind'
        refId:
          type: string
          format: uuid
          description: 막고 있는 것(임무·실행·사실·충돌·일지)의 식별자. 처분은 이 값으로 붙인다.
        label:
          type: string
        detail:
          type: string
          description: 사람이 "왜 막혔는지"를 읽을 문장. 빈 412는 사용자가 이유를 모른다.
        waivable:
          type: boolean
          description: |
            사유를 적고 그대로 둘 수 있는가. **큐에 남은 전파(PENDING_DISPATCH)는 그럴 수
            없다** - 닫으면 릴레이가 그것을 보내려 할 때 사실원장이 거부하고(0045 §5) 그
            지시는 dead letter로 죽는다. 사유를 적는다고 살아나지 않으므로 먼저 정리해야
            한다(ADR-45 D3).
    ClosurePreview:
      type: object
      additionalProperties: false
      required:
      - situationId
      - status
      - blockers
      - closable
      description: |
        US-SIT-035 1단계 "시스템이 미결항목을 요약한다". 닫아 보기 전에 읽을 수 있어야
        사용자가 실패를 눌러 배우지 않는다.
      properties:
        situationId:
          type: string
          format: uuid
        status:
          type: string
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CloseBlocker'
        closable:
          type: boolean
    CloseDisposition:
      type: string
      description: |
        미결 처분. **WAIVED 하나다.** 설계는 완료/취소/이관/예외를 적지만 앞의 셋을
        만드는 연산은 각 도메인의 엔드포인트에 있다. 여기서 같은 일을 하면 상태가
        자기 상태기계 밖에서 바뀌고 그 전이는 사실원장에 제대로 남지 않는다(ADR-45 D3).
      enum:
      - WAIVED
    SituationCloseRequest:
      type: object
      additionalProperties: false
      required:
      - dispositions
      description: |
        UNE-JNL-012. 미결이 남아 있으면 **각 항목에 처분과 사유**가 있어야 닫힌다
        (US-SIT-035 인수기준 "종료시 미결항목·사유 누락 0").
      properties:
        resultSummary:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
        dispositions:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
            - refId
            - disposition
            - reason
            properties:
              refId:
                type: string
                format: uuid
              disposition:
                $ref: '#/components/schemas/CloseDisposition'
              reason:
                type: string
                minLength: 2
                maxLength: 500
                description: 사유 없는 처분은 처분이 아니다. 종료 사건에 그대로 실린다.
    SituationClosed:
      type: object
      additionalProperties: false
      required:
      - situationId
      - status
      - closedAt
      - closureEventId
      - baselineHash
      - waivedCount
      properties:
        situationId:
          type: string
          format: uuid
        status:
          type: string
        closedAt:
          type: string
          format: date-time
        closureEventId:
          type: string
          format: uuid
          description: SITUATION_CLOSED 사실원장 이벤트. 처분·사유가 그 payload에 있다.
        baselineHash:
          type: string
          description: |
            무엇을 최종으로 삼고 닫았는가. 확정 판·이벤트 수·마지막 이벤트·일지 해시·
            실행 상태를 한 값으로 굳힌 것이다. 뒤에 정정이 붙어도 이 값은 그대로다.
        waivedCount:
          type: integer
    EvaluationScore:
      type: object
      additionalProperties: false
      required:
      - scoreId
      - criterionCode
      - scoreValue
      - weightValue
      - evidenceEventIds
      properties:
        scoreId:
          type: string
          format: uuid
        criterionCode:
          type: string
          maxLength: 60
        scoreValue:
          type: number
        weightValue:
          type: number
          minimum: 0
        comment:
          anyOf:
          - type: string
          - type: 'null'
        evidenceEventIds:
          type: array
          description: |
            이 결론의 근거. **이 훈련의 사실원장에 있는 이벤트여야 한다** - 없는 것이나
            남의 훈련 것을 실으면 422다. 비어 있어도 막지 않지만 보고서가 센다
            (정성평가는 이벤트로 뒷받침되지 않을 수 있다, US-SIT-036 A-01).
          items:
            type: string
            format: uuid
    ImprovementAction:
      type: object
      additionalProperties: false
      required:
      - actionId
      - actionText
      - status
      properties:
        actionId:
          type: string
          format: uuid
        actionText:
          type: string
        ownerUserId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        dueAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        status:
          type: string
          description: OPEN만. 종결 경로(담당자 완료보고·승인)가 이 항목에 없다(0045 §1).
          enum:
          - OPEN
        targetType:
          anyOf:
          - type: string
            enum:
            - PLAN
            - SOP
            - SYSTEM
          - type: 'null'
          description: |
            환류 대상. **포인터일 뿐이다** - 개선조치는 대상 SOP·계획서를 바꾸지 않는다
            (US-SIT-036 6단계 "자동변경 금지"). PLAN/SOP는 실재하는 대상을 가리켜야 하고
            SYSTEM은 가리킬 행이 없다.
        targetId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
    EvaluationStatus:
      type: string
      description: |
        OPEN(작성 중)/CONFIRMED(확정·동결). 설계 06의 다섯 상태 중 전이를 만드는 연산이
        있는 둘만 있다 - NOT_STARTED는 행이 없는 것이고, COLLECTING/REVIEW를 가르는
        연산이 없으며, ACTION_TRACKING은 개선조치 상태의 집계다(0045 §1).
      enum:
      - OPEN
      - CONFIRMED
    Evaluation:
      type: object
      additionalProperties: false
      required:
      - evaluationId
      - situationId
      - status
      - evaluationType
      - metrics
      - metricsStale
      - createdBy
      - createdAt
      - scores
      - improvements
      properties:
        evaluationId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        evaluationType:
          type: string
          enum:
          - EXERCISE
          description: 사용성 평가(USABILITY)를 만드는 경로가 이 항목에 없다(0045 §1).
        overallScore:
          anyOf:
          - type: number
          - type: 'null'
          description: 가중 평균. 가중치 합이 0이면 null이다 - 0점과 "평가하지 않았다"는 다르다.
        summary:
          anyOf:
          - type: string
          - type: 'null'
        metrics:
          type: object
          additionalProperties: true
          description: |
            산출 시점에 **고정한** KPI. 산출기는 CC-290의 computeKpi 하나다(ADR-43 D1) -
            평가가 자기 계산기를 가지면 대시보드와 숫자가 갈라진다. 분모가 0인 비율은
            0%가 아니라 null이다(US-SIT-036 E-01 "KPI 분모 0 → N/A").
        metricsStale:
          type: boolean
          description: |
            고정한 값이 지금 사실원장과 어긋나는가(정정이 붙었는가). **자동으로 다시
            계산하지 않는다** - 조회할 때마다 숫자가 조용히 달라지면 무엇을 확정한
            것인지 말할 수 없다(ADR-44 D6과 같은 판단).
        confirmedBy:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        confirmedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationScore'
        improvements:
          type: array
          items:
            $ref: '#/components/schemas/ImprovementAction'
    EvaluationRequest:
      type: object
      additionalProperties: false
      required:
      - scores
      description: |
        UNE-JNL-013. 선행조건은 **종료된 훈련**이다(US-SIT-036) - 기준선이 움직이는 채로
        평가하면 그 평가서가 무엇을 근거로 삼았는지 나중에 말할 수 없다.
      properties:
        summary:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
        scores:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - criterionCode
            - scoreValue
            - weightValue
            properties:
              criterionCode:
                type: string
                maxLength: 60
              scoreValue:
                type: number
              weightValue:
                type: number
                minimum: 0
              comment:
                anyOf:
                - type: string
                  maxLength: 2000
                - type: 'null'
              evidenceEventIds:
                type: array
                maxItems: 50
                items:
                  type: string
                  format: uuid
    ImprovementRequest:
      type: object
      additionalProperties: false
      required:
      - actions
      description: UNE-JNL-014. 개선조치는 대상을 가리키기만 하고 바꾸지 않는다.
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - actionText
            properties:
              actionText:
                type: string
                minLength: 1
                maxLength: 2000
              ownerUserId:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              dueAt:
                anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              targetType:
                anyOf:
                - type: string
                  enum:
                  - PLAN
                  - SOP
                  - SYSTEM
                - type: 'null'
              targetId:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
    SatisfactionSection:
      type: object
      additionalProperties: false
      required:
      - status
      - reason
      - responseCount
      description: |
        만족도. **수집 경로가 없다** - 설계 §3.9의 API 넷 어디에도 설문을 제출하는 연산이
        없고 survey_response는 §6에 테이블 정의조차 없다. 그래서 부재를 **1급 값으로**
        적는다: 빈 배열이나 null로 두면 "설문을 했는데 응답이 0건"과 구분되지 않아
        보고서를 읽는 사람이 만족도가 낮다고 읽는다(ADR-45 D6).
      properties:
        status:
          type: string
          enum:
          - NOT_COLLECTED
        reason:
          type: string
        responseCount:
          type: integer
    EvaluationReport:
      type: object
      additionalProperties: false
      required:
      - evaluation
      - satisfaction
      - criteriaWithoutEvidence
      - improvementsByTarget
      - generatedAt
      properties:
        evaluation:
          $ref: '#/components/schemas/Evaluation'
        satisfaction:
          $ref: '#/components/schemas/SatisfactionSection'
        criteriaWithoutEvidence:
          type: array
          description: 근거 없이 매긴 지표. 막지 않되 보고서가 말한다.
          items:
            type: string
        improvementsByTarget:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - targetType
            - count
            properties:
              targetType:
                type: string
              count:
                type: integer
        generatedAt:
          type: string
          format: date-time
    JournalStatus:
      type: string
      description: |
        설계 09 Journal 상태표는 여섯을 적지만 CONFIGURING·PROJECTING은 도달하지
        않는다 - **투영이 동기이기 때문이다**(저장소 안의 데이터를 접는 계산이라
        바깥을 기다리지 않는다). 값을 만드는 코드가 없는 채로 어휘만 남기지 않는다.
      enum:
      - DRAFT
      - REVIEW
      - CHANGES_REQUESTED
      - APPROVED
    JournalSection:
      type: string
      description: |
        섹션 key. 문서 IR의 문단 ID 규약 `{sectionKey}::FACT` / `::NARRATIVE`로 사실칸과
        문서 문단을 잇는다 - 그 연결이 없으면 편집이 종이에 닿지 않는다. (`document_block`
        테이블에는 아직 아무도 쓰지 않는다 - ADR-30 수용 한계, 0044 §2 정정.)
      enum:
      - OVERVIEW
      - SITUATION_FACTS
      - RESPONSE_TIMELINE
      - TASK_SUMMARY
      - UNRESOLVED
    FactContradiction:
      type: object
      additionalProperties: false
      required:
      - field
      - factValue
      - narrativeValue
      - excerpt
      description: |
        서술이 사실을 반박한 자리. **대조 방향이 핵심이다** - 한국어 자유
        텍스트에서 수치를 열린 집합으로 뽑지 않고, 사실칸에서 결정론적으로 뽑은
        닫힌 집합을 서술에서 역탐색한다. 서술이 값을 빠뜨린 것은 모순이 아니다.
      properties:
        field:
          type: string
        factValue:
          type: number
        narrativeValue:
          type: number
        excerpt:
          type: string
          description: 서술에서 그 값을 발견한 자리. 화면이 그 부분을 짚어 준다.
    JournalFactCell:
      type: object
      additionalProperties: false
      required:
      - sectionKey
      - title
      - sortOrder
      - factPayload
      - factRows
      - lockedFields
      - sourceEventIds
      - narrativeSource
      - contradictions
      properties:
        sectionKey:
          $ref: '#/components/schemas/JournalSection'
        title:
          type: string
        sortOrder:
          type: integer
        factPayload:
          type: object
          additionalProperties: true
          description: |
            **여기 있는 값이 권위다.** SituationSnapshot과 Execution Log에서
            투영됐고 API 어느 경로로도 바뀌지 않는다. 사실이 틀렸다면 원 도메인
            에서 정정 이벤트를 남긴다(UNE-JNL-004).
        factRows:
          type: array
          description: 사람이 읽을 표시행. **문서 문단과 같은 함수에서 나온다** - 화면이
            자기 라벨 표를 따로 들면 종이에 나간 것과 화면이 갈라진다. 내부 식별자
            (snapshotId, entries 같은 원시 배열)는 여기서 빠진다.
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - value
            properties:
              label:
                type: string
              value:
                type: string
        lockedFields:
          type: array
          items:
            type: string
        sourceEventIds:
          type: array
          description: 이 사실을 만든 이벤트. drill-down의 시작점(설계 09 REG-05).
          items:
            type: string
            format: uuid
        narrativeText:
          anyOf:
          - type: string
          - type: 'null'
        narrativeSource:
          type: string
          description: |
            PROJECTED(투영이 만든 문장)/AI(제안을 수락)/USER(사람이 씀).
            **USER는 재투영이 덮지 않는다** - 비협상 규칙 "user-edited blocks are
            protected from regeneration".
          enum:
          - PROJECTED
          - AI
          - USER
        narrativeUpdatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        narrativeUpdatedBy:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        contradictions:
          type: array
          description: |
            지금 서술이 사실을 반박하는가. **사람 편집에는 경고로만 쓴다** -
            오탐으로 편집을 막으면 사람이 우회로를 찾는다. AI 제안에는 거절이다.
          items:
            $ref: '#/components/schemas/FactContradiction'
    JournalResource:
      type: object
      additionalProperties: false
      required:
      - journalId
      - situationId
      - snapshotId
      - documentId
      - periodStart
      - periodEnd
      - status
      - projectionHash
      - createdBy
      - createdAt
      - drifted
      - currentProjectionHash
      properties:
        journalId:
          type: string
          format: uuid
        situationId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
          description: 확정된 상황 판. 미확정 후보로는 일지를 만들 수 없다.
        documentId:
          type: string
          format: uuid
          description: |
            **일지는 문서다.** 리비전·변경집합·Export는 CC-150/CC-160의 것을
            그대로 쓴다 - 병렬 스택을 세우면 편집·Diff·Undo를 두 벌 유지해야 한다.
        currentRevisionId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/JournalStatus'
        projectionHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 만들 때 접은 사실의 해시. **서술은 넣지 않는다** - 문장을 다듬을 때마다 바뀌면 신호가 무의미해진다.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        drifted:
          type: boolean
          description: |
            만든 뒤 바깥의 사실이 움직였다. **자동으로 갱신하지 않는다** -
            검토·승인 중인 문서가 소리 없이 변하면 "검토자가 본 것"과 "승인된 것"이
            갈라진다. 사람이 사실 갱신을 눌러야 반영된다.
        currentProjectionHash:
          type: string
          pattern: ^[0-9a-f]{64}$
    JournalDetail:
      type: object
      additionalProperties: false
      required:
      - journal
      - cells
      - approvals
      properties:
        journal:
          $ref: '#/components/schemas/JournalResource'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/JournalFactCell'
        approvals:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - journalApprovalId
            - revisionId
            - decision
            - decidedBy
            - decidedAt
            - projectionHash
            properties:
              journalApprovalId:
                type: string
                format: uuid
              revisionId:
                type: string
                format: uuid
              decision:
                type: string
                enum:
                - APPROVED
                - CHANGES_REQUESTED
              decidedBy:
                type: string
                format: uuid
              decidedAt:
                type: string
                format: date-time
              comment:
                anyOf:
                - type: string
                - type: 'null'
              projectionHash:
                type: string
                description: 승인한 순간의 사실 해시. 그 뒤 사실이 바뀌면 이 값으로 드러난다.
        openReview:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - journalReviewRequestId
            - revisionId
            - requestedBy
            - requestedAt
            - reviewerIds
            properties:
              journalReviewRequestId:
                type: string
                format: uuid
              revisionId:
                type: string
                format: uuid
              requestedBy:
                type: string
                format: uuid
              requestedAt:
                type: string
                format: date-time
              message:
                anyOf:
                - type: string
                - type: 'null'
              reviewerIds:
                type: array
                items:
                  type: string
                  format: uuid
          - type: 'null'
    JournalProjectionRequest:
      type: object
      additionalProperties: false
      required:
      - templateFileId
      - from
      - to
      description: UNE-JNL-005. 확정된 상황 판과 기간을 정해 사실을 접는다. 일지는 반입된
        HWPX 양식 사본 위에 만들어진다(US-SIT-030 3단계, US-SIT-034 4단계).
      properties:
        snapshotId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 생략하면 가장 최근 확정 판이다.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        templateFileId:
          type: string
          format: uuid
          description: 검증된(uploadState=VERIFIED) HWPX 양식 file_object. 이 바이트에서
            일지 전용 문서 사본을 만들고 revision 1로 삼는다. 원본이 있어야 CC-160 보존
            Export가 성립하므로 **선택 항목이 아니다**. 투영 내용은 양식의 표 칸을 채우는
            것이 아니라 절 표제 뒤에 부기된다(ADR-44 수용 한계 2).
        eventTypes:
          type: array
          description: 이 종류만 담는다. 비면 전부.
          items:
            type: string
            maxLength: 50
    JournalAiDraftRequest:
      type: object
      additionalProperties: false
      description: |
        UNE-JNL-007. **AI에는 fail-closed다** - 제안이 사실을 반박하면 반영하지
        않는다. 거절 비용은 "운영자가 그 문장을 직접 쓴다"뿐이고, 통과 비용은 틀린
        숫자가 승인된 일지에 남는 것이다.
      properties:
        sections:
          type: array
          description: 비면 전부.
          items:
            $ref: '#/components/schemas/JournalSection'
        styleRules:
          type: object
          additionalProperties: true
          description: 어투·길이 같은 표현 규칙. 사실에는 영향을 주지 않는다.
    NarrativeProposal:
      type: object
      additionalProperties: false
      required:
      - journalId
      - sectionKey
      - currentNarrative
      - proposedNarrative
      - simulated
      - adapterId
      - contradictions
      - accepted
      properties:
        journalId:
          type: string
          format: uuid
        sectionKey:
          $ref: '#/components/schemas/JournalSection'
        currentNarrative:
          type: string
        proposedNarrative:
          type: string
        simulated:
          type: boolean
          description: |
            **시뮬레이션임을 숨기지 않는다.** T3Q의 두 계약 어느 쪽에도 일지 서술
            연산이 없어(OB-03) 지금 붙은 것은 규칙 기반 어댑터 하나다. mock 성공을
            T3Q 지원으로 보고하지 않는다.
        adapterId:
          type: string
        contradictions:
          type: array
          items:
            $ref: '#/components/schemas/FactContradiction'
        accepted:
          type: boolean
          description: 반영됐는가. 사실을 반박하거나 사람이 쓴 문장이면 false다.
    JournalEditRequest:
      type: object
      additionalProperties: false
      required:
      - operations
      description: |
        UNE-JNL-008. **서술만 바꾼다** - 사실칸에 닿는 필드는 거절한다. 서술이
        사실을 반박하면 응답의 contradictions에 실리되 막지 않는다.
      properties:
        baseRevisionId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        operations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - sectionKey
            - narrativeText
            properties:
              sectionKey:
                $ref: '#/components/schemas/JournalSection'
              narrativeText:
                type: string
                maxLength: 8000
    JournalReviewRequest:
      type: object
      additionalProperties: false
      required:
      - reviewers
      properties:
        reviewers:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
        message:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
    JournalApproveRequest:
      type: object
      additionalProperties: false
      description: |
        UNE-JNL-010. 설계 10은 승인 하나를 적지만 검토는 반려로도 끝난다(설계 09
        Journal 상태표의 CHANGES_REQUESTED). 엔드포인트를 늘리지 않고 decision이
        가른다.
      properties:
        decision:
          type: string
          default: APPROVED
          enum:
          - APPROVED
          - CHANGES_REQUESTED
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          description: 반려는 사유가 필수다 - 없으면 작성자가 무엇을 고쳐야 하는지 모른다.
        revisionId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
    JournalExportRequest:
      type: object
      additionalProperties: false
      description: |
        UNE-JNL-011. **CC-160 경로에 위임한다** - HWPX 보존 직렬화와 Track A
        검증이 거기 있고, 일지만의 두 번째 Export 경로를 만들면 그 검증을 우회할
        수 있게 된다.

        여기서 더하는 선행조건은 둘이다: **승인된 일지만** 나가고(US-SIT-034
        3~4단계), 나가는 것은 **승인된 판**이다. 판을 클라이언트가 고를 수 없다 -
        고르게 하면 승인 전 판이나 투영 이전의 빈 양식을 승인된 일지로 내보낼 수
        있다(ADR-44 D10).

        드리프트는 여기서 막지 않는다. 승인된 일지는 그 시점의 기록이고, 살아
        있는 상황에서는 승인 직후부터 사실이 계속 움직인다 - 여기서 막으면 승인된
        일지를 영영 내보낼 수 없다. 낡음을 막는 자리는 검토요청(JNL-009)이다.
      properties:
        format:
          type: string
          default: HWPX
    TaskStatus:
      type: string
      description: |
        CC-280이 수행 상태를 열었다. 설계 09의 Task 상태표는 열하나를 적지만
        셋은 **관측되지 않아** 넣지 않는다: DELIVERED(수신영수증을 주는 실제
        채널이 없다 - OB-06), REJECTED(반려하는 순간 IN_PROGRESS가 된다),
        REASSIGNED(재배정하면 새 담당자의 SENT가 된다). 뒤의 둘은 상태가
        아니라 전이이고 TaskEvent가 들고 있다.
      enum:
      - CREATED
      - SENT
      - ACKNOWLEDGED
      - IN_PROGRESS
      - COMPLETION_SUBMITTED
      - COMPLETED
      - UNABLE_REPORTED
      - CANCELLED
    Task:
      type: object
      additionalProperties: false
      required:
      - taskId
      - runId
      - situationId
      - nodeKey
      - title
      - status
      - createdAt
      properties:
        taskId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        nodeKey:
          type: string
        title:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/TaskStatus'
        situationId:
          type: string
          format: uuid
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
        assigneeOrgId:
          type: string
          format: uuid
          nullable: true
        assigneeHint:
          type: string
          nullable: true
          description: 노드가 적어 둔 담당 문구. 실제 배정은 CC-280이다.
        dueAt:
          type: string
          format: date-time
          nullable: true
        progressPct:
          type: number
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            수행 차례가 된 시각. null이면 선행 임무가 남아 있다 — "만들어진
            임무"와 "지금 해야 하는 임무"는 다르다.
        instructions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    SopRunDetail:
      type: object
      additionalProperties: false
      required:
      - run
      - tasks
      - activeNodeKeys
      properties:
        run:
          $ref: '#/components/schemas/SopRun'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        activeNodeKeys:
          type: array
          description: |
            지금 수행할 차례인 노드. **저장하지 않고 계산한다** — 커서를 두면
            그래프·임무 상태와 어긋날 수 있고 어느 쪽이 참인지 말할 수 없다.
          items:
            type: string
    SopSimulationRequest:
      type: object
      additionalProperties: false
      required:
      - versionId
      - snapshotId
      properties:
        versionId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        scenario:
          type: string
          nullable: true
          maxLength: 2000
    SopRunControlRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 2000
    SopRunTerminateRequest:
      type: object
      additionalProperties: false
      required:
      - confirmCode
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 2000
        confirmCode:
          type: string
          description: |
            실행 id의 앞 8자. 되돌릴 수 없는 조작이라 사용자가 화면에서 읽어
            옮겨야 하고, 그 확인 자체가 "무엇을 끄는가"의 확인이 된다.
    Journal:
      type: object
      additionalProperties: true
    # CC-160/ADR-31: 자리표시자(additionalProperties: true)를 실제 형태로 채운다.
    # 비어 있으면 어떤 응답이든 계약을 통과하므로 예제 게이트(ADR-24)가
    # 아무것도 검증하지 못한다.
    ExportJobResource:
      type: object
      required:
      - exportId
      - documentId
      - revisionId
      - format
      - status
      - requestedBy
      - createdAt
      properties:
        exportId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        format:
          type: string
          enum:
          - HWPX
          - PDF
          - DOCX
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
        outputFileId:
          type:
          - string
          - 'null'
          format: uuid
          description: COMPLETED에서만 채워진다 (0020 ck_export_job_terminal_shape)
        validationReportId:
          type:
          - string
          - 'null'
          format: uuid
        validation:
          anyOf:
          - $ref: '#/components/schemas/ValidationReportSummary'
          - type: 'null'
          description: Track A 요약. UNE-DOC-013에서만 채워진다.
        requestedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    # 설계 07 §1.11 검증계층표. 실행하지 않은 계층은 사유와 함께 남긴다 —
    # 침묵하면 "검사해서 통과"와 구분되지 않는다.
    ValidationReportSummary:
      type: object
      required:
      - validationReportId
      - track
      - status
      - checks
      - notRunLayers
      properties:
        validationReportId:
          type: string
          format: uuid
        track:
          type: string
          enum:
          - A_AUTO
          - B_HANCOM
        status:
          type: string
          enum:
          - PASS
          - LIMITED
          - FAIL
        checks:
          type: array
          items:
            type: object
            required:
            - code
            - outcome
            - detail
            properties:
              # Track A 검사(RTA-*)와 저장 실패 코드(HWPX-11xx, STORAGE-*)가
              # 같은 배열에 들어온다 — 실패한 Export도 UNE-DOC-013으로 사유를
              # 보여줘야 하고, 그 자리는 이 보고서뿐이다(ADR-31 D5/D15).
              code:
                type: string
                pattern: '^(RTA-[A-Z]{3}-\d{3}|HWPX-\d{4}|STORAGE-[A-Z_]+|EXPORT-[A-Z]+)$'
              # 계층은 Track A 검사에만 있다. 저장소 장애를 PACKAGE로 적으면
              # 인프라 사고가 패키지 검증 실패로 감사에 남는다(리뷰 M-4).
              layer:
                type: string
                enum:
                - PACKAGE
                - REFERENCE
                - SEMANTIC
                - STYLE
                - VISUAL
                - HANCOM
                - EDIT
              outcome:
                type: string
                enum:
                - PASS
                - WARN
                - FAIL
                - NOT_RUN
              detail:
                type: string
              locator:
                type: string
        notRunLayers:
          type: array
          items:
            type: object
            required:
            - layer
            - reason
            properties:
              layer:
                type: string
                enum:
                - VISUAL
                - HANCOM
                - EDIT
              reason:
                type: string
        outputSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sourceSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ExportJobResponse:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ExportJobResource'
        meta:
          type: object
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Gone:
      description: Gone — 자원이 있었으나 더 이상 존재하지 않는다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: Precondition Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: Precondition Required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    # CC-150: 편집 충돌(DOC-409-001/002/003)은 복구 정보를 함께 낸다. error는
    # common-error.schema.json에서 additionalProperties:false이므로 손대지 않고,
    # 열려 있는 meta에 conflict를 싣는다. ETag 헤더도 함께 나간다.
    RevisionConflict:
      description: Conflict (문서 Revision 충돌)
      headers:
        ETag:
          description: 현재 head revision_no
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionConflictEnvelope'
    ProviderError:
      description: Provider Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
security:
- BearerAuth: []
