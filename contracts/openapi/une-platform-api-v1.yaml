  /plans/{planId}/content-jobs:
    post:
      tags:
      - PLAN
      summary: T3Q RPT-002 본문 생성 Job
      operationId: une_plan_016
      description: '권한: PLAN_GENERATE


        핵심 요청: contextSnapshotId,tocVersionId,targetNodeKeys,protectedBlockIds


        핵심 응답: GenerationJob (jobType=CONTENT)


        오류: T3Q-502-002


        확정 PlanContextSnapshot과 목차 버전을 입력으로 CONTENT 생성 Job을 큐잉한다.
        202는 큐잉 성공만을 뜻하며 본문 산출물은 워커가 만든다. 진행 상황은
        UNE-PLAN-010(상태)과 UNE-PLAN-011(SSE content.block/job.progress)로 관측한다.


        전제조건: contextSnapshotId는 계획서의 현재 확정 스냅샷이어야 하고
        (아니면 400 PLAN-4001, 확정 스냅샷 자체가 없으면 412 PLAN-412-001),
        tocVersionId는 같은 계획서의 확정(CONFIRMED) 목차 버전이어야 한다
        (계획서 불일치·미존재는 404 TOC-404-001, 목차 미확정 등 상태 전제조건
        위반은 412 PLAN-412-002).


        동시성: 같은 계획서에 활성(QUEUED/RUNNING/CANCEL_REQUESTED) 생성 Job이
        있으면 409 PLAN-409-002로 거절한다. 이 조건은 job 타입과 무관하다
        (TOC/CONTENT 어느 쪽이 진행 중이어도 새 생성 Job을 받지 않는다).
        진행 중이라 계획서 상태가 CONTENT_GENERATING인 경우도 412가 아니라 409로
        답한다 — 상태 전제조건보다 활성 Job 판정을 먼저 적용한다.


        재생성 범위: targetNodeKeys를 지정하면 해당 노드 subtree만 재생성하고
        나머지 블록은 보존한다. protectedBlockIds로 지정한 사용자 편집 블록은
        protection_state=USER_LOCKED로 영속 기록되어 이후 모든 재생성에서
        덮어쓰지 않는다 (알 수 없는 blockId는 422 PLAN-422-002).


        Idempotency-Key는 필수다 (누락 428 COM-0428, 같은 키 다른 본문 409 COM-0409).
        T3Q-502-002(provider 오류)는 워커 실행 구간에서만 발생하므로 이 요청의
        응답 코드가 아니라 job_event/error에 기록된다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobResponse'
              examples:
                queuedContentJob:
                  summary: CONTENT job 큐잉 직후 (status=QUEUED, attemptNo=0, result=null)
                  value:
                    success: true
                    data:
                      jobId: 6b2f0a54-9a1d-4c3e-8f77-0b5d2c1a9e40
                      jobType: CONTENT
                      aggregateType: PLAN
                      aggregateId: 018f4b6c-2b3a-4b7e-9f1e-0a2b3c4d5e6f
                      providerCode: T3Q
                      status: QUEUED
                      progressPct: 0
                      attemptNo: 0
                      correlationId: corr_9f1e0a2b3c4d
                      startedAt: null
                      finishedAt: null
                      error: null
                      result: null
                      createdAt: '2026-08-01T09:15:00Z'
                    meta:
                      requestId: req_7c1d9e2f0a3b
                      correlationId: corr_9f1e0a2b3c4d
                      timestamp: '2026-08-01T09:15:00Z'
                      schemaVersion: '1.0'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-PLAN-016
      x-permission: PLAN_GENERATE
      x-db-tables:
      - generation_job
      - job_event
      - generated_block
      - plan
      - plan_context_snapshot
      - toc_version
      - audit_log
      x-error-codes:
      # T3Q-502-002는 워커 provider 호출 구간의 기록 전용 코드다 (202 이후 job_event).
      - T3Q-502-002
      - PLAN-412-001
      - PLAN-412-002
      - PLAN-409-002
      - PLAN-4001
      # 계획서 미존재/타 테넌트는 404 PLAN-4003 (UNE-PLAN-009와 동일).
      - PLAN-4003
