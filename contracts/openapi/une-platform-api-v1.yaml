  /plan-jobs/{jobId}/events:
    get:
      tags:
      - PLAN
      summary: 생성 Job SSE
      operationId: une_plan_011
      description: '권한: PLAN_READ


        핵심 요청: Last-Event-ID


        핵심 응답: SSE<JobEvent>


        오류: JOB-503-001'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: 'text/event-stream. 공개 이벤트 어휘: job.queued, job.started,
            job.progress, toc.section, content.block, job.completed, job.failed,
            job.cancel_requested, job.cancelled, job.retry_requested.


            각 이벤트 프레임은 id(= job_event.sequence_no), event, data를 포함한다.
            Provider 원문 이벤트는 노출하지 않고 화면용 DTO로 투영한다 (설계 10 §2).


            toc.section은 TOC Job(UNE-PLAN-009), content.block은 CONTENT
            Job(UNE-PLAN-016) 전용이다. content.block payload:
            {nodeKey, blockId, outcome(GENERATED|PRESERVED|FAILED), sortOrder,
            outlineLevel, contentHash, citationCount, reason?}. GENERATED는 새 블록의
            id/해시를, PRESERVED는 유지된 기존 블록의 id/해시를 싣고, FAILED는
            blockId·contentHash가 null이다(행이 만들어지지 않는다). reason은 outcome이
            PRESERVED일 때 그 블록의 protection_state 값(USER_LOCKED 또는
            SYSTEM_LOCKED)이고, FAILED일 때는 실패 사유 코드다.


            content.block은 이번 job의 "대상" 노드에 대해서만 발행한다. 범위 지정
            재생성(targetNodeKeys)에서 범위 밖 노드는 손대지 않으므로 프레임을
            발행하지 않고 contentSummary에도 집계되지 않는다.


            legacy 경로에서는 outcome=FAILED 프레임이 발생하지 않는다: provider
            응답이 목차와 정합하지 않으면 job 전체가 FAILED로 끝난다. 블록 단위
            실패/재시도는 target-v2 partialRetry(CC-135) 소관이다.


            job.progress payload: {completed, total, pct}. CC-130부터 CONTENT Job이
            발행을 시작하며, 블록 10개 또는 10%p 진행마다 스로틀한다(마지막 블록은
            항상 발행). TOC Job의 job.progress는 기존과 같이 단계 전환 시점에만
            발행한다.


            heartbeat는 15초 주기로 전송한다. heartbeat 프레임의 id는 마지막으로
            전달한 sequence_no를 반복하므로 Last-Event-ID 재개 지점을 이동시키지
            않는다.


            재접속 시 Last-Event-ID에 마지막으로 수신한 sequence_no를 보내면 그
            다음 순번부터 재전송한다.


            스트림 최대 수명은 30분이며 서버가 종료한 뒤에는 클라이언트가
            Last-Event-ID로 재접속한다 (설계 10 §5 "총시간 정책"이 값을 정하지
            않아 CC-120에서 정한 잠정 운영값).'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
