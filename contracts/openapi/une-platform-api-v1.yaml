        평가서가 무엇을 근거로 삼았는지 나중에 말할 수 없다(EVAL-412-001).

        지표는 CC-290의 computeKpi로 산출해 **그 시점에 고정**하고, 무엇을 보고 냈는지
        (이벤트 수·마지막 이벤트·스트림 해시)를 함께 적는다. 근거로 단 이벤트가 이 훈련의
        사실원장에 없으면 422다 - 허공을 가리키는 근거는 근거가 없는 것보다 나쁘다.

