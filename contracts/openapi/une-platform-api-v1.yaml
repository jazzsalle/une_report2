  /files/{fileId}/complete:
    post:
      tags:
      - DOC
      summary: 업로드 완료·검사
      operationId: une_doc_002
      description: '권한: FILE_UPLOAD


        핵심 요청: etag


        핵심 응답: FileObject


        오류: FILE-422-002


        3단 업로드의 3단이며 **검증 지점**이다. 서버는 저장된 객체를 읽어
        (1) 크기, (2) SHA-256 재계산값, (3) **내용 기반 형식**을 사전등록 선언과
        대조한다. 하나라도 어긋나면 422 FILE-422-002이고 행은
        `uploadState=ABORTED`로 끝난다 — 이후 어떤 경로도 이 파일을 쓸 수 없다.


        형식 판정은 확장자·`Content-Type`을 신뢰하지 않는다(`.claude/rules/security.md`).
        HWPX는 ZIP 매직과 `mimetype` 엔트리(`application/hwp+zip`)를 실제 바이트에서
        확인한다. `etag`는 전송 계층이 준 값이며 **참고**로만 기록한다: 멀티파트
        업로드의 ETag는 MD5가 아니고, 드라이버마다 다르므로 이것을 무결성 근거로
        쓸 수 없다. 근거는 우리가 다시 계산한 SHA-256이다.


        `scanStatus`는 이 단계에서도 PENDING이다. AV 스캐너는 아직 없다(OB-15) —
        상태를 CLEAN으로 올리면 검사하지 않은 파일이 감사에서 검사된 것으로 보인다.
        `malware_scan` 테이블도 만들지 않았으므로 x-db-tables에 적지 않는다(ADR-32).


        멱등: 같은 파일에 대한 재확정은 이미 VERIFIED인 행을 그대로 돌려준다.
        ABORTED 행의 재확정은 다시 422다(재조회로 고쳐지지 않는다).'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
