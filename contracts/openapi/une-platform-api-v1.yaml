                      originalName: 간략 보고 양식.hwpx
                      mimeType: application/hwp+zip
                      sizeBytes: 33940
                      sha256: 9f2c1d3e4f5a6b708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8
                      uploadState: VERIFIED
                      scanStatus: PENDING
                      verifiedAt: '2026-08-05T01:11:30Z'
                      createdBy: 5d2a7b91-3c4e-4f60-8a1b-2c3d4e5f6071
                      createdAt: '2026-08-05T01:10:00Z'
                    meta:
                      requestId: req_8b9c0d1e2f3a4b5c
                      correlationId: corr_1a2b3c4d5e6f7081
                      timestamp: '2026-08-05T01:11:30Z'
                      schemaVersion: '1.0'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ProviderError'
      x-une-api-id: UNE-DOC-002
      x-permission: FILE_UPLOAD
      x-db-tables:
      - file_object
      x-error-codes:
      - FILE-422-002
      - COM-0409
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileCompleteRequest'
            examples:
              withEtag:
                summary: 전송 계층 ETag를 참고값으로 함께 보고
                value:
                  etag: '"3f8a1c2d4e5b6f708192a3b4c5d6e7f8"'
