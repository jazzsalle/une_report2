      summary: 파일 사전등록·업로드 URL 발급
      operationId: une_doc_001
      description: '권한: FILE_UPLOAD


        핵심 요청: fileName,size,mimeType,sha256


        핵심 응답: FileObject+uploadUrl


        오류: FILE-422-001


        3단 업로드(설계 10 §2 "사전등록→직접 업로드→완료확정")의 1단이다. 서버는
        `file_object` 행을 `uploadState=PENDING`으로 만들고 **바이트가 놓일 자리**와
        그 자리에 쓸 티켓만 돌려준다. 바이트는 이 API를 지나가지 않는다.


        선언값은 아직 사실이 아니다. `sha256`·`sizeBytes`는 클라이언트의 주장이며
        UNE-DOC-002가 **저장된 바이트에서 다시 계산해** 대조한다. 그래서 저장 키에는
        선언 해시를 쓰지 않고 `fileId`로 격리한다(ADR-32) — 검증되지 않은 바이트가
        내용 주소 키를 차지하면 "키가 곧 내용"이라는 전제가 깨진다.


        `upload.driver`는 진단·증거용이다. 클라이언트는 `url`/`method`/`headers`만
        쓰고 driver로 분기하지 않는다. presign이 불가능한 드라이버(로컬·테스트의
        인메모리 저장소)에서는 API 자신의 전송 라우트를 가리킨다.


        멱등: Idempotency-Key. 같은 키 재전송은 **처음 발급한 응답을 그대로**
        돌려준다(공통 멱등 저장소의 재생). 티켓에는 만료가 있으므로, 만료 뒤에
        재시도하려면 **새 멱등 키로 다시 등록**해야 한다 — 앞의 행은 PENDING으로
        남고 정리 대상이 된다.'
