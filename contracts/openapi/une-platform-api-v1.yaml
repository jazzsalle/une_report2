        만들면 상태 폴링·리스·재시도를 관리할 대상이 하나 늘어나는 대신 사용자가
        기다리는 시간은 같다. 이 결정과 되돌릴 조건(대용량에서 목표 초과)은
        ADR-32에 적었다. 응답의 `analysis`가 곧 결과이며 UNE-DOC-004로 다시 읽는다.


        전제: `fileId`는 UNE-DOC-002를 통과한(`uploadState=VERIFIED`) 파일이어야
        한다. PENDING/ABORTED면 422 HWPX-422-001이다 — 검증되지 않은 바이트를
        문서로 만들면 그 뒤의 모든 무결성 주장이 근거를 잃는다.


        `planId`를 주면 **`plan.document_id`**에 이 문서가 기록된다. 그 컬럼은
        0003부터 있었으나 쓰는 코드가 없어 항상 NULL이었다(CC-170이 채운다).
        역방향 링크(`document.plan_id`)는 만들지 않는다 — 같은 관계에 진실을 둘
