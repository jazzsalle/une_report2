openapi: 3.1.0
info:
  title: UNE Request Specification for T3Q Plan Generation API v2
  version: 1.0.1-request
  description: >-
    Target contract requested by UNE. This is not evidence of T3Q implementation.
    UNE must keep LegacyT3qPlanAdapter for current RPT-001/002 and use
    TargetV2T3qPlanAdapter with mocks until the provider contract is accepted.


    1.0.1-request: 필드 수준 요청 내용 변경 없음 — 스키마 합성 결함(allOf+additionalProperties)의
    편집상 수정 (ADR-24).


    편집 로그: 2026-08-02 CC-125 — 예제 2건 추가(cancelGenerationJob 요청,
    getGenerationJob COMPLETED 응답), 스키마·필드 무변경, 버전 미상향 (ADR-26 D10).


    2026-08-02 CC-135 — 응답측 예제 확충(semanticEdit/evidence/validate/cancel/getJob/SSE/multipart)
    + 면제 2건 종결, capabilities 예제 mock 동기, 스키마·필드 무변경, 버전 미상향 (ADR-24 R2 / ADR-26 D10).
servers:
  - url: https://plf.mois-disaster.t3q.ai
    description: Candidate host from current v0.8.5 specification; final binding is OPEN.
tags:
  - name: PlanGeneration
  - name: GenerationJob
  - name: SemanticEdit
