# UNE local development dependencies (CC-002).
# Run from this directory so docker compose picks up infrastructure/.env:
#   cp .env.example .env   # then set passwords
#   docker compose up -d
# No secrets in this file; credentials come from infrastructure/.env only.

name: une-local

services:
  postgres:
    # Debian(glibc) image to match the managed-Postgres demo host family;
    # alpine/musl initdb collation differs and breaks local/demo query parity.
    image: postgres:16.9-bookworm
    container_name: une-postgres
    environment:
      POSTGRES_USER: ${UNE_DB_USER:-une}
      POSTGRES_PASSWORD: ${UNE_DB_PASSWORD:?set UNE_DB_PASSWORD in infrastructure/.env}
      POSTGRES_DB: ${UNE_DB_NAME:-une}
      # Applied only on first initdb; changing this requires a volume reset.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=ko-KR --data-checksums'
      # Non-superuser application role created by initdb/01-app-role.sh;
      # runtime services must connect as this role so RLS is enforced.
      UNE_DB_APP_USER: ${UNE_DB_APP_USER:-une_app}
      UNE_DB_APP_PASSWORD: ${UNE_DB_APP_PASSWORD:?set UNE_DB_APP_PASSWORD in infrastructure/.env}
      # Worker's own LOGIN role (OB-17), created by initdb/02-worker-role.sh.
      # Memberships in une_worker/une_retention come from migration 0050 —
      # those roles do not exist yet at initdb time. Granting them to
      # UNE_DB_APP_USER instead would let the API runtime inherit the
      # retention role's cross-tenant policy membership (ADR-35 D2/D4).
      UNE_DB_WORKER_USER: ${UNE_DB_WORKER_USER:-une_worker_app}
      UNE_DB_WORKER_PASSWORD: ${UNE_DB_WORKER_PASSWORD:?set UNE_DB_WORKER_PASSWORD in infrastructure/.env}
      # UTC storage per backend rules; clients convert on read.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback by default: local-only dependency, not an intranet service.
      - '${UNE_BIND_ADDRESS:-127.0.0.1}:${UNE_DB_PORT:-5432}:5432'
    volumes:
      - une_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${UNE_DB_USER:-une} -d ${UNE_DB_NAME:-une}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: une-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${UNE_MINIO_ROOT_USER:-une-minio}
      MINIO_ROOT_PASSWORD: ${UNE_MINIO_ROOT_PASSWORD:?set UNE_MINIO_ROOT_PASSWORD in infrastructure/.env}
    ports:
      - '${UNE_BIND_ADDRESS:-127.0.0.1}:${UNE_MINIO_API_PORT:-9000}:9000'
      - '${UNE_BIND_ADDRESS:-127.0.0.1}:${UNE_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - une_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot bootstrap: bucket + least-privilege service account so
  # services never need the MinIO root credentials (human ops only).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: une-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      UNE_MINIO_ROOT_USER: ${UNE_MINIO_ROOT_USER:-une-minio}
      UNE_MINIO_ROOT_PASSWORD: ${UNE_MINIO_ROOT_PASSWORD:?set UNE_MINIO_ROOT_PASSWORD in infrastructure/.env}
      UNE_MINIO_BUCKET: ${UNE_MINIO_BUCKET:-une-documents}
      UNE_STORAGE_ACCESS_KEY: ${UNE_STORAGE_ACCESS_KEY:?set UNE_STORAGE_ACCESS_KEY in infrastructure/.env}
      UNE_STORAGE_SECRET_KEY: ${UNE_STORAGE_SECRET_KEY:?set UNE_STORAGE_SECRET_KEY in infrastructure/.env}
    volumes:
      - ./minio-init.sh:/scripts/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/scripts/minio-init.sh']
    restart: 'no'

volumes:
  une_pgdata:
  une_minio_data:
