# UNE local development dependencies (CC-002).
# Run from this directory so docker compose picks up infrastructure/.env:
#   cp .env.example .env   # then set passwords
#   docker compose up -d
# No secrets in this file; credentials come from infrastructure/.env only.

name: une-local

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: une-postgres
    environment:
      POSTGRES_USER: ${UNE_DB_USER:-une}
      POSTGRES_PASSWORD: ${UNE_DB_PASSWORD:?set UNE_DB_PASSWORD in infrastructure/.env}
      POSTGRES_DB: ${UNE_DB_NAME:-une}
      # UTC storage per backend rules; clients convert on read.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${UNE_DB_PORT:-5432}:5432'
    volumes:
      - une_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${UNE_DB_USER:-une} -d ${UNE_DB_NAME:-une}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: une-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${UNE_MINIO_ROOT_USER:-une-minio}
      MINIO_ROOT_PASSWORD: ${UNE_MINIO_ROOT_PASSWORD:?set UNE_MINIO_ROOT_PASSWORD in infrastructure/.env}
    ports:
      - '${UNE_MINIO_API_PORT:-9000}:9000'
      - '${UNE_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - une_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap so services/api can assume the bucket exists.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: une-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      UNE_MINIO_ROOT_USER: ${UNE_MINIO_ROOT_USER:-une-minio}
      UNE_MINIO_ROOT_PASSWORD: ${UNE_MINIO_ROOT_PASSWORD:?set UNE_MINIO_ROOT_PASSWORD in infrastructure/.env}
      UNE_MINIO_BUCKET: ${UNE_MINIO_BUCKET:-une-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$UNE_MINIO_ROOT_USER\" \"$$UNE_MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$UNE_MINIO_BUCKET\" &&
      echo \"bucket $$UNE_MINIO_BUCKET ready\"
      "
    restart: 'no'

volumes:
  une_pgdata:
  une_minio_data:
