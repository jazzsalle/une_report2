# HWPX 분석 코퍼스 매니페스트 (CC-140, ADR-29 D8)
#
# 파일은 이름이 아니라 **sha256으로 해석**한다. 실 파일명이 한글이라
# 유니코드 정규화(NFC/NFD)·플랫폼 인코딩 차이에 노출되기 때문이며, 로더는
# `dir`을 스캔해 해시로 항목을 매칭한다. `alias`는 테스트·증거 문서에서
# 쓰는 ASCII 식별자다.
#
# expectedVerdict는 **구현 전에 지어내지 않는다**. 최초 구현 후 실측하여
# evidence(왜 그 판정인지)와 함께 채우고, 이후에는 회귀 기준으로 고정한다.
# 미채움 상태는 `PENDING_MEASUREMENT`로 표기하며 로더가 이를 허용한다.

