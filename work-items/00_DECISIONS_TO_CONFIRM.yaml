version: '1.1'
status: APPROVED
required_before: CC-001
decisions:
  repository_url: https://github.com/jazzsalle/une_report2
  default_branch: main
  branch_policy: >-
    Trunk-based: feature/CC-<id> branches per Work Item, merged to main after
    the Work Item gate review; no force-push to main; applied migrations and
    audit history are never rewritten.
  backend_profile: nestjs-node-typescript  # ADR-19; supersedes recommended-dotnet8
  frontend_profile: react-typescript
  package_manager: pnpm
  database_version: postgresql-16
  object_storage: minio-s3-compatible  # S3-compatible port; demo env may use R2/Supabase Storage
  local_container_runtime: docker-compose  # free path only: WSL2 Docker Engine CE / Rancher Desktop / Podman
  poc_auth_mode: mock-jwt
  integration_auth_mode: t3q-sso-token-exchange-awaiting-contract
  ci_platform: github-actions
  deployment_target: dev-frontend-vercel-backend-railway-container  # demo host: Railway (closed 2026-07-30, OB-14); final delivery env OPEN (OB-14)
  supported_browsers: chrome-edge-latest
  hancom_test_version: OPEN-until-G4  # OB-08
  windows_qa_environment: windows-11
constraints:
  - Developer PCs are on internal networks without fixed IPs; team/meeting-room
    demos require public URLs, so the shared demo environment must be fully
    cloud-hosted (Vercel frontend + cloud container backend + managed
    PostgreSQL + S3-compatible storage). Local-only backend cannot serve demos.
  - Shared demo environments must contain masked/sample data only; no real
    personal or institution-sensitive data on public cloud.
  - Vercel hosts frontend deployments only; API/worker/HWPX engine run as
    containers (long-running workers, outbox polling, SSE, and long HWPX jobs
    do not fit serverless functions).
  - Public demo environments require access control on both sides - frontend
    (Vercel Deployment Protection/SSO or basic auth) and backend (IP allowlist
    or gateway auth). mock-jwt issuance is enabled only when AUTH_MODE=mock,
    its signing key is injected as an environment secret (never committed or
    logged), and mock-jwt is never used in any environment holding unmasked
    data. Tenant claims must be validated server-side even in mock mode
    (CC-100).
approval:
  approved_by: jazzsalle
  approved_at: 2026-07-30
  notes: >-
    Backend changed from recommended ASP.NET Core 8 to NestJS (Node/TypeScript)
    for full-stack TypeScript unification with the React frontend and rhwp
    adapter. Deviation from 10_API_DB_SEQUENCE_v1.0 ("Spring Boot or .NET 8")
    is recorded in ADR-19 (docs/adr/ADR-19-backend-profile-nestjs.md).
    Demo backend host closed 2026-07-30 by user decision: Railway (existing
    paid account). Final delivery environment stays OPEN under OB-14.
