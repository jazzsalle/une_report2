name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; setting
      # "version" here too makes pnpm/action-setup fail on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+/22.12+; profile baseline is 22.12+.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:contracts
      # CC-140: third_party/rhwp intake gate (ADR-29 D1). Green today because
      # nothing is imported; bites the moment source lands without provenance.
      - run: pnpm validate:intake
      # Compose stays structurally valid incl. interpolation; dummy secrets
      # satisfy the ${VAR:?} guards (no services are started in CI).
      - run: >
          UNE_DB_PASSWORD=ci UNE_DB_APP_PASSWORD=ci UNE_MINIO_ROOT_PASSWORD=ci
          UNE_STORAGE_ACCESS_KEY=ci UNE_STORAGE_SECRET_KEY=ci
          docker compose -f infrastructure/docker-compose.yml config --quiet
      # Generated contract types must match contracts/openapi (ADR-20).
      # git add -N makes untracked (uncommitted new) generated files fail too.
      - run: pnpm generate:contract-types
      - run: git add -N -- '**/src/generated/**' && git diff --exit-code -- '**/src/generated/**'
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/validate_handoff.py
      # CC-130: mock-server baseline behavior tests (tests/baseline). httpx is
      # required by starlette's TestClient and is not in requirements.txt.
      - run: pip install -r mock-server/requirements.txt pytest httpx
      - run: python -m pytest tests/baseline

  # CC-004: migrations must apply to a real PostgreSQL 16 and the committed
  # data dictionary must match the applied schema (drift gate).
  db-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_USER: une
          # Throwaway service-container credential; never reuse on any shared
          # or persistent instance.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: une
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U une -d une"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://une:ci-only@localhost:5432/une
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace deps resolve to dist/ (gitignored) — tests that import
      # @une/domain / @une/provider-adapters need a build first (QA 필수-1).
      - run: pnpm build
      - run: pnpm --filter @une/db-integration test
      # CC-100: HTTP e2e (mock auth/tenant/RBAC) runs its transactions with
      # SET LOCAL ROLE une_app, so FORCE RLS applies as in production.
      - run: pnpm --filter @une/api test
      # CC-120: worker e2e claims jobs as SET LOCAL ROLE une_worker (dispatch
      # policies + tenant-scoped terminal writes exactly as in production).
      - run: pnpm --filter @une/worker test
      - run: pnpm db:data-dictionary
      # git add -N makes an untracked (never-committed) dictionary fail too.
      - run: git add -N -- docs/db/DATA_DICTIONARY.md && git diff --exit-code -- docs/db/DATA_DICTIONARY.md
